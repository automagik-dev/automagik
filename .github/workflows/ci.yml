name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    # One version everywhere, the release tooling's tests, and the market index: DSH's own
    # parser, and every pinned commit holds the package it lists (so it needs history).
    name: Versions and market index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # scripts/test-guard.test.ts runs real `node --test` runs, on the plugins' Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check

  landing:
    name: Landing page and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node --test apps/landing/landing.test.mjs apps/landing/waitlist.test.mjs
      - name: Verify the page in the runner's Chrome
        shell: bash
        run: |
          set -euo pipefail
          export LANDING_CHROME="$(command -v google-chrome)"
          test -x "$LANDING_CHROME"
          node apps/landing/verify-browser.mjs

      - name: Browser screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: landing-browser-evidence
          path: .cache/landing-evidence/
          if-no-files-found: warn

  brand-font:
    # The title font in docs/brand/fonts is a subset of an upstream file. This job makes the
    # subset again from that file, at its pinned commit, and fails unless the result is the
    # committed font, byte for byte (docs/brand/fonts/README.md has the call). The tooling is in
    # scripts/brand-font, outside docs/brand, because that folder is copied into other repositories.
    name: Brand font rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Rebuild fredoka-latin.woff2 from its pinned source and compare
        shell: bash
        working-directory: scripts/brand-font
        env:
          SOURCE_URL: https://raw.githubusercontent.com/google/fonts/2e5fa2e951237b6ae65f705693d12ca76a7f78c8/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/font-rebuild"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$RUNNER_TEMP/font-rebuild/Fredoka.ttf" "$SOURCE_URL"
          node rebuild.mjs "$RUNNER_TEMP/font-rebuild/Fredoka.ttf" "$RUNNER_TEMP/font-rebuild/fredoka-latin.woff2"

      - name: The rebuilt font
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brand-font-rebuild
          path: ${{ runner.temp }}/font-rebuild/fredoka-latin.woff2
          if-no-files-found: warn

  id:
    name: Automagik ID (local Workers runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      # The pages are tested in a real Chromium; without this their browser tests would skip.
      ID_PAGES_BROWSER: required
    defaults:
      run:
        working-directory: apps/id
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Chromium for the page tests
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bun run test
      - run: node scripts/mutations.mjs

  privacy:
    # The whole repository, on every pull request and push, whatever changed: a docs-only or
    # plugin-only change is checked too. The scan root is the git top level
    # (herdr/scripts/privacy-check.mjs), and the list is the one beside the script; the
    # folders still waiting on issue #795 are listed in its `pending` entries.
    name: Privacy (whole repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - run: node herdr/scripts/privacy-check.mjs

      # No Stripe key, price or account id in any tracked file (RFC 0025 phase A's check; #910).
      - run: node server/secrecy.mjs --repo .

  herdr:
    # The herdr pack (herdr/, the old automagik-herdr CI): the real Herdr app's loader on every
    # pack mod (a pinned Linux herdr-app, headless), its tests, a syntax check of every pack mod
    # and its tooling, shellcheck on the installer and the CLI's shell scripts, and its catalog
    # index (its version is the root's: `bun run check` above). Plain JavaScript that Herdr loads as
    # it is: no install, no dependencies. On the newest Node 22 and on 24, the tests' floor: the
    # pack's users run it on 22.7 or later (AGENTS.md), but the test stubs need
    # module.registerHooks (22.15+).
    # Only when herdr/ changed, or the workflows and lane tooling that test and pack it.
    name: herdr pack (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HERDR_CHANGED_PATHS: '^(herdr/|herdr-layout/|\.github/workflows/(ci|release)\.yml$|\.github/scripts/herdr-app-check\.mjs$|scripts/(lane|version)\.ts$)'
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: herdr
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether herdr/ changed
        id: changed
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that opens a branch, or a base this checkout lacks, tests the pack anyway.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "herdr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff goes to a file: piped into `grep -q`, git diff dies of SIGPIPE at the first
          # match, and pipefail reads that as "did not change" (#895).
          diff_file="${RUNNER_TEMP}/herdr-changed.txt"
          if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
            echo "::error::git diff ${BASE}...HEAD failed"
            exit 1
          fi
          grep_status=0
          grep -E "${HERDR_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
          case "${grep_status}" in
            0) echo "herdr=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "herdr/ did not change: nothing to test" ;;
            *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
          esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.herdr == 'true'
        with:
          node-version: ${{ matrix.node }}

      # The app's own mod loader, not a stand-in: every PACK_MODS mod of the pack built from this
      # commit must load in the pinned Linux herdr-app. #624's node:url import passed the pack's
      # tests and failed only here, so this runs before them and prints herdr-app's own output.
      # One matrix leg is enough: the loader does not depend on the job's Node. libxkbcommon-x11-0
      # is the app's one missing library (libxcb-xkb1 comes with it); check needs no X server.
      - name: herdr-app system libraries
        if: steps.changed.outputs.herdr == 'true' && matrix.node == '24'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-x11-0 libxcb-xkb1

      - name: Every pack mod loads in herdr-app
        if: steps.changed.outputs.herdr == 'true' && matrix.node == '24'
        working-directory: .
        run: node .github/scripts/herdr-app-check.mjs

      # am-quota's Keychain tests run against the stand-in in test/am-quota-keychain.mjs, first on
      # PATH; am-quota-keychain-guard.test.mjs fails any that could reach the real `security`.
      - name: Tests
        id: tests
        if: steps.changed.outputs.herdr == 'true'
        run: node --test 'test/*.test.mjs'

      - name: Syntax
        id: syntax
        if: steps.changed.outputs.herdr == 'true'
        run: |
          set -euo pipefail
          for f in mods/*/*.js mods/*/*.mjs mods/*/bin/*.mjs mods/*/pack/*.mjs scripts/*.mjs scripts/*/*.mjs; do
            node --check "$f"
          done
          sh -n install.sh
          sh -n mods/am-sidebar/bin/run.sh
          sh -n mods/am-sidebar/bin/automagik-herdr
          shellcheck -s sh install.sh mods/am-sidebar/bin/run.sh mods/am-sidebar/bin/automagik-herdr

      # No home paths, private hosts or machine names anywhere in the repository: the standalone
      # `privacy` job above runs herdr/scripts/privacy-check.mjs once, from the repository root.

      - name: Catalog
        id: catalog
        if: steps.changed.outputs.herdr == 'true'
        run: node scripts/catalog.mjs --check

      # The Automations panel installs our scheduler release and pins its darwin sha256s
      # (mods/am-automations/scheduler.js): checked against that release's checksums.txt.
      - name: Scheduler pin
        if: steps.changed.outputs.herdr == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/scheduler-pin.mjs

      # On every pull request, whatever changed: herdr.dev skips the whole repository when a herdr-mod
      # entry folder (any folder holding mods/<name>/main.js) holds layouts/ (RFC 0011).
      - name: No layouts/ in a herdr-mod entry folder
        run: node scripts/entries.mjs --check

      # Every part.json under herdr/ and herdr-layout/ (RFC 0012): its fields, and what it names exists.
      - name: Parts (part.json)
        run: node scripts/parts.mjs --check

      - name: One version (the root's)
        if: steps.changed.outputs.herdr == 'true'
        run: node scripts/version.mjs check

      # am (am/, RFC 0012) carries byte-equal copies of the sidebar's CLI and briefing: a herdr
      # change that drifts from them fails here, in its own pull request. The fix is to run
      # `node scripts/am-copies.mjs --write` at the repository's root and commit am/.
      - name: am's copies of the CLI and briefing
        if: steps.changed.outputs.herdr == 'true'
        run: node ../scripts/am-copies.mjs --check

      # The change check and this assertion read the same diff in two independent steps: a skip
      # in the first one cannot hide a change from the second (#895, as usagemeter's).
      - name: Assert the steps ran
        if: always()
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OUTCOMES: tests=${{ steps.tests.outcome }} syntax=${{ steps.syntax.outcome }} catalog=${{ steps.catalog.outcome }}
        run: |
          set -euo pipefail
          changed=false
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=true
          else
            diff_file="${RUNNER_TEMP}/herdr-assert.txt"
            if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
              echo "::error::git diff ${BASE}...HEAD failed"
              exit 1
            fi
            grep_status=0
            grep -E "${HERDR_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
            case "${grep_status}" in
              0) changed=true ;;
              1) ;;
              *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
            esac
          fi
          if [[ "${changed}" != true ]]; then
            echo "herdr/ unchanged: no steps expected"
            exit 0
          fi
          missing=''
          for outcome in ${OUTCOMES}; do
            [[ "${outcome#*=}" == success ]] || missing="${missing} ${outcome%%=*}"
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::herdr/ changed but these steps did not succeed:${missing}"
            exit 1
          fi
          echo "ran: ${OUTCOMES}"

  scheduler:
    # The vendored scheduler (herdr/scheduler/, DnzzL/herdr-automations v0.12.1, its UPSTREAM.md): Go
    # source the pack never carries. Its binary ships from its own release lane
    # (scheduler-release.yml), and a scheduler change cuts no monorepo release (scripts/lane.ts
    # NEVER_SHIPPED). Go's vet and tests, and a CGO-free build of the four release targets.
    # Only when herdr/scheduler/ changed, or this workflow.
    name: Scheduler (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCHEDULER_CHANGED_PATHS: '^(herdr/scheduler/|\.github/workflows/ci\.yml$)'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether herdr/scheduler/ changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that opens a branch, or a base this checkout lacks, tests the scheduler anyway.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "scheduler=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff goes to a file: piped into `grep -q`, git diff dies of SIGPIPE at the first
          # match, and pipefail reads that as "did not change" (#895).
          diff_file="${RUNNER_TEMP}/scheduler-changed.txt"
          if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
            echo "::error::git diff ${BASE}...HEAD failed"
            exit 1
          fi
          grep_status=0
          grep -E "${SCHEDULER_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
          case "${grep_status}" in
            0) echo "scheduler=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "herdr/scheduler/ did not change: nothing to test" ;;
            *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
          esac

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changed.outputs.scheduler == 'true'
        with:
          go-version: '1.26.10'
          cache-dependency-path: herdr/scheduler/go.sum

      - name: Vet
        id: vet
        if: steps.changed.outputs.scheduler == 'true'
        working-directory: herdr/scheduler
        run: go vet ./...

      - name: Tests
        id: tests
        if: steps.changed.outputs.scheduler == 'true'
        working-directory: herdr/scheduler
        run: go test ./...

      # The four targets scheduler-release.yml builds: no cgo, so nothing to cross-compile against.
      - name: Cross builds (CGO off)
        id: builds
        if: steps.changed.outputs.scheduler == 'true'
        working-directory: herdr/scheduler
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -o "${RUNNER_TEMP}/herdr-automations_${goos}_${goarch}" .
          done

      # The change check and this assertion read the same diff in two independent steps: a skip
      # in the first one cannot hide a change from the second (#895, as usagemeter's).
      - name: Assert the steps ran
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OUTCOMES: vet=${{ steps.vet.outcome }} tests=${{ steps.tests.outcome }} builds=${{ steps.builds.outcome }}
        run: |
          set -euo pipefail
          changed=false
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=true
          else
            diff_file="${RUNNER_TEMP}/scheduler-assert.txt"
            if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
              echo "::error::git diff ${BASE}...HEAD failed"
              exit 1
            fi
            grep_status=0
            grep -E "${SCHEDULER_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
            case "${grep_status}" in
              0) changed=true ;;
              1) ;;
              *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
            esac
          fi
          if [[ "${changed}" != true ]]; then
            echo "herdr/scheduler/ unchanged: no steps expected"
            exit 0
          fi
          missing=''
          for outcome in ${OUTCOMES}; do
            [[ "${outcome#*=}" == success ]] || missing="${missing} ${outcome%%=*}"
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::herdr/scheduler/ changed but these steps did not succeed:${missing}"
            exit 1
          fi
          echo "ran: ${OUTCOMES}"

  am:
    # am, the one command (am/, RFC 0012), which every release carries: its tests, a syntax check,
    # shellcheck on its launchers and its copies of the pack's CLI and briefing. Plain JavaScript
    # like the pack: its users run Node 22.7 or later; the tests run on the newest Node 22 and 24.
    # Only when am/, what it copies, or the workflows and tooling that release it changed.
    name: am (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AM_CHANGED_PATHS: '^(am/|herdr/mods/am-sidebar/|plugin-lane/keys\.json$|\.github/workflows/(ci|release)\.yml$|scripts/(am-copies\.mjs|am-lane\.ts|lane\.ts|version\.ts)$)'
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: am
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether am/ changed
        id: changed
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "am=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff goes to a file: piped into `grep -q`, git diff dies of SIGPIPE at the first
          # match, and pipefail reads that as "did not change" (#895).
          diff_file="${RUNNER_TEMP}/am-changed.txt"
          if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
            echo "::error::git diff ${BASE}...HEAD failed"
            exit 1
          fi
          grep_status=0
          grep -E "${AM_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
          case "${grep_status}" in
            0) echo "am=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "am/ did not change: nothing to test" ;;
            *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
          esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.am == 'true'
        with:
          node-version: ${{ matrix.node }}

      # First, so a herdr change that drifted from am's copies fails here, naming the fix.
      - name: Copies of the pack's CLI and briefing
        id: copies
        if: steps.changed.outputs.am == 'true'
        run: node ../scripts/am-copies.mjs --check

      - name: Tests
        id: tests
        if: steps.changed.outputs.am == 'true'
        run: node --test 'test/*.test.mjs'

      - name: Syntax
        id: syntax
        if: steps.changed.outputs.am == 'true'
        run: |
          set -euo pipefail
          for f in *.js *.mjs bin/*.mjs lib/*.mjs; do
            node --check "$f"
          done
          shellcheck -s sh bin/am bin/run.sh bin/automagik-herdr

      # The change check and this assertion read the same diff in two independent steps: a skip
      # in the first one cannot hide a change from the second (#895, as usagemeter's).
      - name: Assert the steps ran
        if: always()
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OUTCOMES: copies=${{ steps.copies.outcome }} tests=${{ steps.tests.outcome }} syntax=${{ steps.syntax.outcome }}
        run: |
          set -euo pipefail
          changed=false
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=true
          else
            diff_file="${RUNNER_TEMP}/am-assert.txt"
            if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
              echo "::error::git diff ${BASE}...HEAD failed"
              exit 1
            fi
            grep_status=0
            grep -E "${AM_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
            case "${grep_status}" in
              0) changed=true ;;
              1) ;;
              *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
            esac
          fi
          if [[ "${changed}" != true ]]; then
            echo "am/ unchanged: no steps expected"
            exit 0
          fi
          missing=''
          for outcome in ${OUTCOMES}; do
            [[ "${outcome#*=}" == success ]] || missing="${missing} ${outcome%%=*}"
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::am/ changed but these steps did not succeed:${missing}"
            exit 1
          fi
          echo "ran: ${OUTCOMES}"

  pocket:
    # Pocket's phone app (apps/pocket/, the old automagik-pocket android.yml): the debug APK, the
    # unit tests and lint. Its version is the root package.json's, so a change there builds it too.
    # Only when apps/pocket/ changed, or the workflows, lane tooling and version that build it.
    name: Pocket (build, test, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POCKET_CHANGED_PATHS: '^(apps/pocket/|apps/bots-dsh/src/host/pets/genie-clay/|apps/bots-dsh/src/client/pet(-poses)?\.js$|package\.json$|\.github/workflows/(ci|release)\.yml$|scripts/(lane|version)\.ts$)'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Also Genie's art and the pet poses, which the APK bundles and its tests check (apps/pocket/docs/decisions/teams-v1.md).
      - name: Whether apps/pocket/ changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that opens a branch, or a base this checkout lacks, builds the app anyway.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "pocket=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff goes to a file: piped into `grep -q`, git diff dies of SIGPIPE at the first
          # match, and pipefail reads that as "did not change" (#895).
          diff_file="${RUNNER_TEMP}/pocket-changed.txt"
          if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
            echo "::error::git diff ${BASE}...HEAD failed"
            exit 1
          fi
          grep_status=0
          grep -E "${POCKET_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
          case "${grep_status}" in
            0) echo "pocket=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "apps/pocket/ did not change: nothing to build" ;;
            *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
          esac

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.changed.outputs.pocket == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.changed.outputs.pocket == 'true'
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Robolectric fetches its android-all jars into ~/.m2 while the tests run, outside Gradle's
      # cache, so a download miss failed unrelated PRs (#549). The jars depend only on the
      # Robolectric version and the SDKs the tests ask for (@Config(sdk = ...)), so those are the key.
      - name: Robolectric cache key
        id: robolectric
        if: steps.changed.outputs.pocket == 'true'
        run: |
          set -euo pipefail
          android=apps/pocket/android
          version="$(grep -oE 'org\.robolectric:robolectric:[0-9][0-9A-Za-z.-]*' "$android/app/build.gradle.kts" | head -n 1 | cut -d: -f3 || true)"
          sdks="$(grep -rhoE '@Config\(sdk = \[[0-9, ]+\]' "$android/app/src/test" | grep -oE '[0-9]+' | sort -un | paste -sd- - || true)"
          if [ -z "$version" ]; then
            echo "::warning::Robolectric's version not found in $android/app/build.gradle.kts; caching ~/.m2 under 'unknown'"
            version=unknown
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sdks=${sdks:-default}" >> "$GITHUB_OUTPUT"
          echo "Robolectric $version, SDKs ${sdks:-default}"

      # A miss still builds and tests: Robolectric downloads what is missing and the job saves it.
      - name: Cache Robolectric's jars (~/.m2)
        id: m2
        if: steps.changed.outputs.pocket == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: robolectric-m2-${{ runner.os }}-${{ steps.robolectric.outputs.version }}-sdk${{ steps.robolectric.outputs.sdks }}-${{ hashFiles('apps/pocket/android/**/robolectric.properties') }}
          restore-keys: |
            robolectric-m2-${{ runner.os }}-${{ steps.robolectric.outputs.version }}-

      # Validates the wrapper checksum and caches Gradle's dependencies.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.changed.outputs.pocket == 'true'

      # One shared debug key for PR APKs (docs/decisions/shared-debug-signing-key.md). With the
      # secret, the job signs with it and publishes the APK; without it (a fork), the default key.
      - name: Materialize the shared debug keystore
        id: debug_key
        if: steps.changed.outputs.pocket == 'true'
        env:
          KEYSTORE: ${{ secrets.POCKET_DEBUG_SIGNING_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE}" ]; then
            echo "No shared debug key in this repository's secrets: the build uses the default debug key."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          store="$RUNNER_TEMP/pocket-debug.keystore"
          printf '%s' "$KEYSTORE" | base64 -d > "$store"
          chmod 600 "$store"
          echo "POCKET_DEBUG_STORE=$store" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build the debug APK, run the unit tests and lint
        id: build
        if: steps.changed.outputs.pocket == 'true'
        working-directory: apps/pocket/android
        run: |
          touch "$RUNNER_TEMP/m2-marker"
          ./gradlew --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      # The certificate is public evidence that two PR runs share a key; the APK is what a tester installs.
      - name: Debug APK certificate
        if: steps.changed.outputs.pocket == 'true' && steps.debug_key.outputs.present == 'true'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            apps/pocket/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the debug APK
        if: steps.changed.outputs.pocket == 'true' && steps.debug_key.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocket-debug-apk-${{ github.event.pull_request.number || github.run_number }}
          path: apps/pocket/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Remove the shared debug keystore
        if: always() && steps.debug_key.outputs.present == 'true'
        run: rm -f "${POCKET_DEBUG_STORE:-}"

      # Evidence only, never a failure: Gradle hides the tests' "Downloading" lines, so this lists
      # the jars this run fetched into ~/.m2. A warm cache fetches none.
      - name: Robolectric jars fetched in this run
        if: always() && steps.changed.outputs.pocket == 'true'
        run: |
          echo "cache-hit=${{ steps.m2.outputs.cache-hit }}"
          if [ -f "$RUNNER_TEMP/m2-marker" ] && [ -d ~/.m2/repository ]; then
            fetched="$(find ~/.m2/repository -name '*.jar' -newer "$RUNNER_TEMP/m2-marker" || true)"
            echo "fetched: $(printf '%s' "$fetched" | grep -c . || true) jar(s)"
            [ -z "$fetched" ] || printf '%s\n' "$fetched"
          else
            echo "fetched: unknown (no marker or no ~/.m2/repository)"
          fi
          find ~/.m2/repository -name '*.jar' -exec ls -l {} + 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.changed.outputs.pocket == 'true'
        with:
          name: pocket-reports
          path: |
            apps/pocket/android/app/build/reports/
            apps/pocket/android/app/build/test-results/
          if-no-files-found: ignore

      # The terminal page the app shows (its xterm assets), driven in Chromium.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.changed.outputs.pocket == 'true'
        with:
          python-version: '3.12'

      - name: Terminal page (Playwright)
        id: terminal
        if: steps.changed.outputs.pocket == 'true'
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python apps/pocket/android/scripts/test_terminal.py

      # The change check and this assertion read the same diff in two independent steps: a skip
      # in the first one cannot hide a change from the second (#895, as usagemeter's).
      - name: Assert the steps ran
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OUTCOMES: build=${{ steps.build.outcome }} terminal=${{ steps.terminal.outcome }}
        run: |
          set -euo pipefail
          changed=false
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=true
          else
            diff_file="${RUNNER_TEMP}/pocket-assert.txt"
            if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
              echo "::error::git diff ${BASE}...HEAD failed"
              exit 1
            fi
            grep_status=0
            grep -E "${POCKET_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
            case "${grep_status}" in
              0) changed=true ;;
              1) ;;
              *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
            esac
          fi
          if [[ "${changed}" != true ]]; then
            echo "apps/pocket/ unchanged: no steps expected"
            exit 0
          fi
          missing=''
          for outcome in ${OUTCOMES}; do
            [[ "${outcome#*=}" == success ]] || missing="${missing} ${outcome%%=*}"
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::apps/pocket/ changed but these steps did not succeed:${missing}"
            exit 1
          fi
          echo "ran: ${OUTCOMES}"

  pocket-link-changes:
    # Decide on Linux before the matrix can request a scarce macOS runner. The shared
    # transcript fixture is the tests' only repository input outside Pocket Link itself.
    name: Pocket Link changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      link: ${{ steps.changed.outputs.link }}
    env:
      POCKET_LINK_CHANGED_PATHS: '^(herdr/mods/pocket-link/|herdr/test/fixtures/transcript-folder-rule\.json$|\.github/workflows/ci\.yml$)'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether Pocket Link changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "link=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff goes to a file: piped into `grep -q`, git diff dies of SIGPIPE at the first
          # match, and pipefail reads that as "did not change" (#895).
          diff_file="${RUNNER_TEMP}/link-changed.txt"
          # PRs compare from the merge base; pushes compare the complete before/after trees.
          range="${BASE}..${HEAD_SHA}"
          if [[ "${EVENT}" == pull_request ]]; then range="${BASE}...${HEAD_SHA}"; fi
          if ! git diff --no-renames --name-only "${range}" > "${diff_file}"; then
            echo "::error::git diff ${range} failed"
            exit 1
          fi
          grep_status=0
          grep -E "${POCKET_LINK_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
          case "${grep_status}" in
            0) echo "link=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "link=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
          esac

  pocket-link:
    # The real socket-boundary test skips on Linux, so relevant changes need both OSes.
    # Job-level if is evaluated before matrix expansion and runner allocation.
    name: Pocket Link bridge (${{ matrix.os }})
    needs: pocket-link-changes
    if: needs.pocket-link-changes.outputs.link == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        working-directory: herdr/mods/pocket-link
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Syntax
        id: syntax
        run: |
          set -euo pipefail
          for f in bridge/*.mjs chat/*.js chat/*.mjs find-node.js main.js; do node --check "$f"; done

      - name: Test
        id: test
        run: node --test bridge/*.test.mjs chat/*.test.mjs find-node.test.mjs

      - name: Assert the steps ran
        if: always()
        env:
          OUTCOMES: syntax=${{ steps.syntax.outcome }} test=${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          for outcome in ${OUTCOMES}; do
            if [[ "${outcome#*=}" != success ]]; then
              echo "::error::Pocket Link ${outcome%%=*} did not succeed"
              exit 1
            fi
          done
          echo "ran: ${OUTCOMES}"

  pocket-link-required:
    # Branch protection must require this stable aggregate, not either conditional OS job.
    name: Pocket Link bridge
    needs: [pocket-link-changes, pocket-link]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful coverage when Pocket Link changed
        env:
          DETECTION: ${{ needs.pocket-link-changes.result }}
          CHANGED: ${{ needs.pocket-link-changes.outputs.link }}
          TESTS: ${{ needs.pocket-link.result }}
        run: |
          set -euo pipefail
          if [[ "${DETECTION}" != success ]]; then
            echo "::error::Pocket Link path detection did not succeed (${DETECTION})"
            exit 1
          fi
          case "${CHANGED}:${TESTS}" in
            true:success) echo "Pocket Link passed on Linux and macOS" ;;
            false:skipped) echo "Pocket Link unchanged: no macOS runner needed" ;;
            *) echo "::error::Pocket Link coverage missing (changed=${CHANGED}, tests=${TESTS})"; exit 1 ;;
          esac

  meter:
    # Meter's local tools (meter/statusline: the Claude Code status line and the limits logger that
    # runs it as `claude-limits-statusline.mjs -- <status line>`): syntax and their dependency-free
    # tests, the formatter against fixture stdin objects included. No release ships them
    # (scripts/lane.ts NEVER_SHIPPED).
    name: Meter status line
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      METER_CHANGED_PATHS: '^(meter/statusline/|\.github/workflows/ci\.yml$)'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether meter/statusline/ changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "meter=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff goes to a file: piped into `grep -q`, git diff dies of SIGPIPE at the first
          # match, and pipefail reads that as "did not change" (#895).
          diff_file="${RUNNER_TEMP}/meter-changed.txt"
          if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
            echo "::error::git diff ${BASE}...HEAD failed"
            exit 1
          fi
          grep_status=0
          grep -E "${METER_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
          case "${grep_status}" in
            0) echo "meter=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "meter/statusline/ did not change: nothing to test" ;;
            *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
          esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.meter == 'true'
        with:
          node-version: '22'

      - name: Syntax and tests
        id: tests
        if: steps.changed.outputs.meter == 'true'
        run: |
          set -euo pipefail
          for f in meter/statusline/*.mjs; do node --check "$f"; done
          node --test 'meter/statusline/test/*.test.mjs'

      # The change check and this assertion read the same diff in two independent steps: a skip
      # in the first one cannot hide a change from the second (#895, as usagemeter's).
      - name: Assert the steps ran
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OUTCOMES: tests=${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          changed=false
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=true
          else
            diff_file="${RUNNER_TEMP}/meter-assert.txt"
            if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
              echo "::error::git diff ${BASE}...HEAD failed"
              exit 1
            fi
            grep_status=0
            grep -E "${METER_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
            case "${grep_status}" in
              0) changed=true ;;
              1) ;;
              *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
            esac
          fi
          if [[ "${changed}" != true ]]; then
            echo "meter/statusline/ unchanged: no steps expected"
            exit 0
          fi
          missing=''
          for outcome in ${OUTCOMES}; do
            [[ "${outcome#*=}" == success ]] || missing="${missing} ${outcome%%=*}"
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::meter/statusline/ changed but these steps did not succeed:${missing}"
            exit 1
          fi
          echo "ran: ${OUTCOMES}"

  usagemeter:
    # usagemeter, the Rust token meter (meter/usagemeter/, imported with its history by RFC 0017
    # delivery 2): format, clippy with warnings denied and the tests, on Linux and macOS, then its
    # standalone installer's test against the binary just built. It ships on the meter lane (RFC
    # 0017 delivery 4: scripts/lane.ts, and release.yml's meter jobs build its release binaries).
    # The toolchain is pinned so a new clippy lint never fails an unchanged crate; moving it is a
    # change of its own. Only when the crate, the herdr-meter doc's keeper (meter/schema/), the workflows that test
    # and release it, or the lane and version tooling changed.
    name: usagemeter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      RUST_TOOLCHAIN: 1.93.0
      USAGEMETER_CHANGED_PATHS: '^(meter/(usagemeter|schema)/|\.github/workflows/(ci|release)\.yml$|scripts/(lane|version)\.ts$)'
    defaults:
      run:
        working-directory: meter/usagemeter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether meter/usagemeter/ changed
        id: changed
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "usagemeter=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff_file="${RUNNER_TEMP}/usagemeter-changed.txt"
          if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
            echo "::error::git diff ${BASE}...HEAD failed"
            exit 1
          fi
          grep_status=0
          grep -E "${USAGEMETER_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
          case "${grep_status}" in
            0) echo "usagemeter=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "meter/usagemeter/ did not change: nothing to test" ;;
            *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
          esac

      - name: Toolchain
        if: steps.changed.outputs.usagemeter == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          cargo --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.changed.outputs.usagemeter == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            meter/usagemeter/target
          key: usagemeter-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('meter/usagemeter/Cargo.lock') }}
          restore-keys: usagemeter-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Format
        id: format
        if: steps.changed.outputs.usagemeter == 'true'
        run: cargo fmt --check

      - name: Clippy
        id: clippy
        if: steps.changed.outputs.usagemeter == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        id: test
        if: steps.changed.outputs.usagemeter == 'true'
        run: cargo test --locked

      # The installer stays until RFC 0017 delivery 9. Its test installs from a release laid out on
      # disk, so the binary the tests built stands in for this machine's release asset.
      - name: Installer
        if: steps.changed.outputs.usagemeter == 'true'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then shellcheck -s sh install.sh tests/install.sh; fi
          cargo build --locked --bin usagemeter
          case "$(uname -s) $(uname -m)" in
            'Darwin arm64') asset=usagemeter-darwin-arm64 ;;
            'Darwin x86_64') asset=usagemeter-darwin-x86_64 ;;
            'Linux x86_64') asset=usagemeter-linux-x86_64 ;;
            'Linux aarch64') asset=usagemeter-linux-aarch64 ;;
            *) echo "::error::no usagemeter asset for $(uname -sm)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/release"
          cp target/debug/usagemeter "$RUNNER_TEMP/release/$asset"
          sh tests/install.sh "$RUNNER_TEMP/release"

      # The change check and this assertion read the same diff in two independent steps: a skip
      # in the first one cannot hide a crate change from the second.
      - name: Assert Format, Clippy and Test ran
        if: always()
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          changed=false
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=true
          else
            diff_file="${RUNNER_TEMP}/usagemeter-assert.txt"
            if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
              echo "::error::git diff ${BASE}...HEAD failed"
              exit 1
            fi
            grep_status=0
            grep -E "${USAGEMETER_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
            case "${grep_status}" in
              0) changed=true ;;
              1) ;;
              *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
            esac
          fi
          if [[ "${changed}" != true ]]; then
            echo "meter/usagemeter/ unchanged: no Rust steps expected"
            exit 0
          fi
          missing=''
          [[ "${FORMAT_OUTCOME}" == success ]] || missing="${missing} Format"
          [[ "${CLIPPY_OUTCOME}" == success ]] || missing="${missing} Clippy"
          [[ "${TEST_OUTCOME}" == success ]] || missing="${missing} Test"
          if [[ -n "${missing}" ]]; then
            echo "::error::meter/usagemeter/ changed but these steps did not run:${missing}"
            exit 1
          fi
          echo "Format, Clippy and Test ran on ${RUNNER_OS}"

  dsh-sandbox:
    # The dsh-sandbox runner (apps/dsh-sandbox/: the hc socket-mask wrapper, its profile row and
    # the install/check helper): syntax and hermetic tests (fake bwrap, temp Unix sockets and
    # temp profiles; no live socket, docker.sock or profile). The pack carries the wrapper in
    # its release; no release here ships this folder (scripts/lane.ts NEVER_SHIPPED).
    # Only when apps/dsh-sandbox/ changed, or this workflow.
    name: dsh-sandbox runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SANDBOX_CHANGED_PATHS: '^(apps/dsh-sandbox/|\.github/workflows/ci\.yml$)'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether apps/dsh-sandbox/ changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff goes to a file: piped into `grep -q`, git diff dies of SIGPIPE at the first
          # match, and pipefail reads that as "did not change" (#895).
          diff_file="${RUNNER_TEMP}/sandbox-changed.txt"
          if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
            echo "::error::git diff ${BASE}...HEAD failed"
            exit 1
          fi
          grep_status=0
          grep -E "${SANDBOX_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
          case "${grep_status}" in
            0) echo "sandbox=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "apps/dsh-sandbox/ did not change: nothing to test" ;;
            *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
          esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.sandbox == 'true'
        with:
          node-version: '22'

      - name: Syntax and tests
        id: tests
        if: steps.changed.outputs.sandbox == 'true'
        run: |
          set -euo pipefail
          for f in apps/dsh-sandbox/bin/*.mjs; do node --check "$f"; done
          node --test 'apps/dsh-sandbox/test/*.test.mjs'

      # The change check and this assertion read the same diff in two independent steps: a skip
      # in the first one cannot hide a change from the second (#895, as usagemeter's).
      - name: Assert the steps ran
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OUTCOMES: tests=${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          changed=false
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=true
          else
            diff_file="${RUNNER_TEMP}/sandbox-assert.txt"
            if ! git diff --name-only "${BASE}...HEAD" > "${diff_file}"; then
              echo "::error::git diff ${BASE}...HEAD failed"
              exit 1
            fi
            grep_status=0
            grep -E "${SANDBOX_CHANGED_PATHS}" "${diff_file}" > /dev/null || grep_status=$?
            case "${grep_status}" in
              0) changed=true ;;
              1) ;;
              *) echo "::error::grep over the changed paths failed (${grep_status})"; exit 1 ;;
            esac
          fi
          if [[ "${changed}" != true ]]; then
            echo "apps/dsh-sandbox/ unchanged: no steps expected"
            exit 0
          fi
          missing=''
          for outcome in ${OUTCOMES}; do
            [[ "${outcome#*=}" == success ]] || missing="${missing} ${outcome%%=*}"
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::apps/dsh-sandbox/ changed but these steps did not succeed:${missing}"
            exit 1
          fi
          echo "ran: ${OUTCOMES}"

  plugin:
    # The Bot team and the welcome run on Node, as DSH does: Bun installs each and the DSH
    # release it pins in dev/harness/package.json, which its tests run against.
    name: ${{ matrix.app }} (plugin tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [acp-dsh, bots-dsh, locale-pt-br-dsh, welcome-dsh]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache the pinned DSH harness
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/${{ matrix.app }}/dev/harness/node_modules
          key: dsh-harness-bun-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles(format('apps/{0}/dev/harness/package.json', matrix.app)) }}

      - name: Install
        run: |
          bun install --frozen-lockfile
          [ -d dev/harness/node_modules ] || bun run harness

      - name: Omni's plugins at the pinned release
        # The welcome lists the tools Omni's channels and canvases register; its test reads
        # them from Omni at the release apps/desktop/omni.json pins.
        if: matrix.app == 'welcome-dsh'
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/omni"
          commit=$(node -p "require('../desktop/omni.json').commit")
          git init -q "${dir}"
          git -C "${dir}" remote add origin https://github.com/automagik-si/omni
          git -C "${dir}" sparse-checkout set --no-cone /apps/omni-channels-dsh/ /apps/omni-canvas-dsh/
          git -C "${dir}" fetch -q --depth 1 --filter=blob:none origin "${commit}"
          git -C "${dir}" checkout -q FETCH_HEAD
          echo "OMNI_CHECKOUT=${dir}" >> "$GITHUB_ENV"

      - name: Chrome for the Bot team's layout check
        # The Ubuntu image ships Google Chrome at this path. Under CI the composer layout test
        # fails, rather than skips, when it finds no browser (#323).
        if: matrix.app == 'bots-dsh'
        run: echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"

      - name: Electron for the Bot team's script wall check
        # browser_exec's process wall is checked on both runtimes the Bot team ships on. The
        # desktop app's is Electron as Node: the Electron apps/desktop pins, from its lock.
        # Under CI that half fails, rather than skips, when it finds no Electron.
        if: matrix.app == 'bots-dsh'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          # The package fetches its binary on first use, checked against its own checksums,
          # and says so on stdout: fetch first, then ask for the path alone.
          node node_modules/electron/install.js
          bin="$(node -p "require('electron')")"
          test -x "${bin}"
          echo "ELECTRON_BIN=${bin}" >> "$GITHUB_ENV"

      - name: Generated files are current
        # A package with no browser half has no client to build.
        run: '[ ! -f scripts/build-client.mjs ] || node scripts/build-client.mjs --check'

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  acp-image-read:
    name: acp-dsh (real Codex image reads)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/acp-dsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Pinned native Codex and public runtime canary
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/image-read"
          mkdir -p "${dir}/tmp"
          release="https://github.com/openai/codex/releases/download/rust-v0.167.1"
          curl -fsSL "${release}/codex-x86_64-unknown-linux-musl.tar.gz" -o "${dir}/codex.tgz"
          hash=64bcc99c32e434b4bcb0508a97df9b7aeecdb97e956d976fb13661096ec4e3e2
          echo "${hash}  ${dir}/codex.tgz" | sha256sum --check --strict
          tar -xzf "${dir}/codex.tgz" -C "${dir}"
          curl -fsSL "${release}/bwrap-x86_64-unknown-linux-musl.tar.gz" -o "${dir}/bwrap.tgz"
          hash=eb799e781a9ffd37b1ee46280fda10212a6efaf3cccfb8bf7603a00520355ac7
          echo "${hash}  ${dir}/bwrap.tgz" | sha256sum --check --strict
          mkdir -p "${dir}/codex-resources"
          tar -xzf "${dir}/bwrap.tgz" -C "${dir}/codex-resources"
          mv "${dir}/codex-resources/bwrap-x86_64-unknown-linux-musl" \
            "${dir}/codex-resources/bwrap"
          # Ubuntu restricts unprofiled user namespaces. Allow this runner's bwrap only;
          # its mount/network sandbox and the tested Codex read policy still apply.
          cat > "${dir}/bwrap.apparmor" <<EOF
          abi <abi/4.0>,
          profile image-read-bwrap "${dir}/codex-resources/bwrap" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "${dir}/bwrap.apparmor"
          # A public 1x1 PNG, installed only in this disposable runner's runtime read root.
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9aw'
          printf '%s' "${png}AAAABJRU5ErkJggg==" | base64 --decode > "${dir}/runtime.png"
          sudo install -m 644 "${dir}/runtime.png" /usr/local/share/automagik-image-read.png
          echo "AUTOMAGIK_TEST_CODEX=${dir}/codex-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
          echo 'AUTOMAGIK_TEST_CODEX_RUNTIME_IMAGE=/usr/local/share/automagik-image-read.png' \
            >> "$GITHUB_ENV"
          echo "TMPDIR=${dir}/tmp" >> "$GITHUB_ENV"

      - name: Real helper reads (required, no skips)
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --wait --pipe \
            -p MemoryMax=4G -p MemorySwapMax=0 -p "User=$(id -un)" \
            -p "WorkingDirectory=${PWD}" \
            env "PATH=${PATH}" "TMPDIR=${TMPDIR}" NODE_OPTIONS=--max-old-space-size=2048 \
            "AUTOMAGIK_TEST_CODEX=${AUTOMAGIK_TEST_CODEX}" \
            "AUTOMAGIK_TEST_CODEX_RUNTIME_IMAGE=${AUTOMAGIK_TEST_CODEX_RUNTIME_IMAGE}" \
            AUTOMAGIK_REQUIRE_IMAGE_READ_TEST=1 \
            node scripts/image-read-gate.mjs

  pets:
    # The headless pet bake (automagik-pets) on Node, as DSH and Automagik Herdr run it: Bun
    # installs sharp, whose prebuilt binary carries libvips; no browser is needed (the parity
    # check against Chromium skips without one).
    name: automagik-pets (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/automagik-pets
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  desktop:
    # The desktop app's main-process logic in plain Node (home layout, profile install and the
    # move from the old package names, the preload, dsh supervision, navigation, updates), so
    # the Electron binary itself is not downloaded here. On Linux and on Windows, which the app
    # ships on too (desktop-build.yml).
    name: Desktop (main-process tests${{ matrix.os == 'windows-latest' && ', windows' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DO_NOT_TRACK: '1'
    steps:
      # As the Windows build checks out (desktop-build.yml): the files as the commit holds them.
      - name: Check out without CRLF
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Test
        run: npm test

  acp-windows:
    # acp-dsh runs the app's pnpm.cmd and the agents' CLIs (codex.cmd) on Windows through cmd.exe
    # (src/host/batch-spawn.js). Those tests import only Node's own modules: no harness needed.
    name: acp-dsh (Windows spawns)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/acp-dsh
        shell: bash
    steps:
      - name: Check out without CRLF
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - name: Test
        run: node --test test/batch-spawn.test.js

  boot:
    # The plugins booted for real with Omni's channels and canvases (the release omni.json
    # pins): boot-check.yml, which Follow Omni also runs on a candidate Omni before carrying it.
    name: Boot
    uses: ./.github/workflows/boot-check.yml
    permissions:
      contents: read
