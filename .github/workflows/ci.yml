name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    # One version everywhere, the release tooling's tests, and the market index: DSH's own
    # parser, and every pinned commit holds the package it lists (so it needs history).
    name: Versions and market index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check

  herdr:
    # The herdr pack (herdr/, the old automagik-herdr CI): its tests, a syntax check of every pack
    # mod and its tooling, shellcheck on the installer and the CLI's shell scripts, and its catalog
    # index (its version is the root's: `bun run check` above). Plain JavaScript that Herdr loads as
    # it is: no install, no dependencies. On the newest Node 22 and on 24: the pack runs on 22.7 or
    # later (AGENTS.md), but its test stubs need module.registerHooks, which 22.7 lacks.
    # Only when herdr/ changed, or the workflows and lane tooling that test and pack it.
    name: herdr pack (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: herdr
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether herdr/ changed
        id: changed
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that opens a branch, or a base this checkout lacks, tests the pack anyway.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "herdr=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${BASE}...HEAD" | grep -qE '^(herdr/|\.github/workflows/(ci|release)\.yml$|scripts/(lane|version)\.ts$)'; then
            echo "herdr=true" >> "$GITHUB_OUTPUT"
          else
            echo "herdr/ did not change: nothing to test"
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.herdr == 'true'
        with:
          node-version: ${{ matrix.node }}

      # am-quota's Keychain tests run against the stand-in in test/am-quota-keychain.mjs, first on
      # PATH; am-quota-keychain-guard.test.mjs fails any that could reach the real `security`.
      - name: Tests
        if: steps.changed.outputs.herdr == 'true'
        run: node --test 'test/*.test.mjs'

      - name: Syntax
        if: steps.changed.outputs.herdr == 'true'
        run: |
          set -euo pipefail
          for f in mods/*/*.js mods/*/*.mjs mods/*/bin/*.mjs scripts/*.mjs; do
            node --check "$f"
          done
          sh -n install.sh
          sh -n mods/am-sidebar/bin/run.sh
          sh -n mods/am-sidebar/bin/automagik-herdr
          shellcheck -s sh install.sh mods/am-sidebar/bin/run.sh mods/am-sidebar/bin/automagik-herdr

      - name: Catalog
        if: steps.changed.outputs.herdr == 'true'
        run: node scripts/catalog.mjs --check

      - name: One version (the root's)
        if: steps.changed.outputs.herdr == 'true'
        run: node scripts/version.mjs check

  plugin:
    # The Bot team and the welcome run on Node, as DSH does: Bun installs each and the DSH
    # release it pins in dev/harness/package.json, which its tests run against.
    name: ${{ matrix.app }} (plugin tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [acp-dsh, bots-dsh, locale-pt-br-dsh, unfold-bot-dsh, unfold-bridge-dsh, unfold-capabilities-dsh, unfold-events-dsh, unfold-mind-dsh, unfold-session-dsh, unfold-settings-dsh, unfold-sse-dsh, unfold-trajectory-dsh, welcome-dsh]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Cache the pinned DSH harness
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/${{ matrix.app }}/dev/harness/node_modules
          key: dsh-harness-bun-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles(format('apps/{0}/dev/harness/package.json', matrix.app)) }}

      - name: Install
        run: |
          bun install --frozen-lockfile
          [ -d dev/harness/node_modules ] || bun run harness

      - name: Omni's plugins at the pinned release
        # The welcome lists the tools Omni's channels and canvases register; its test reads
        # them from Omni at the release apps/desktop/omni.json pins.
        if: matrix.app == 'welcome-dsh'
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/omni"
          commit=$(node -p "require('../desktop/omni.json').commit")
          git init -q "${dir}"
          git -C "${dir}" remote add origin https://github.com/automagik-dev/omni
          git -C "${dir}" sparse-checkout set --no-cone /apps/omni-channels-dsh/ /apps/omni-canvas-dsh/
          git -C "${dir}" fetch -q --depth 1 --filter=blob:none origin "${commit}"
          git -C "${dir}" checkout -q FETCH_HEAD
          echo "OMNI_CHECKOUT=${dir}" >> "$GITHUB_ENV"

      - name: Generated files are current
        # A package with no browser half has no client to build.
        run: '[ ! -f scripts/build-client.mjs ] || node scripts/build-client.mjs --check'

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  pets:
    # The headless pet bake (automagik-pets) on Node, as DSH and Automagik Herdr run it: Bun
    # installs sharp, whose prebuilt binary carries libvips; no browser is needed (the parity
    # check against Chromium skips without one).
    name: automagik-pets (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/automagik-pets
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  desktop:
    # The desktop app's main-process logic in plain Node (home layout, profile install and the
    # move from the old package names, the preload, dsh supervision, navigation, updates), so
    # the Electron binary itself is not downloaded here.
    name: Desktop (main-process tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Test
        run: npm test

  boot:
    # The plugins booted for real with Omni's channels and canvases (the release the desktop
    # carries) and the add-ons the desktop profile pins: DSH refuses the whole web UI when one
    # plugin's client import misses, so a rename one of them still imports, or an add-on pinned
    # to a development build (v3.53.0, react/jsx-dev-runtime), fails here.
    name: Boot with Omni's plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Cache the pinned DSH harness
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/bots-dsh/dev/harness/node_modules
          key: dsh-harness-bun-bots-dsh-${{ runner.os }}-${{ hashFiles('apps/bots-dsh/dev/harness/package.json') }}

      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          [ -d apps/bots-dsh/dev/harness/node_modules ] || (cd apps/bots-dsh && bun run harness)

      - name: Boot
        run: node scripts/boot-check.mjs --shot boot.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: boot-screenshot
          path: boot.png
          if-no-files-found: ignore
          retention-days: 7
