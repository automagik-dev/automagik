name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    # One version everywhere, the release tooling's tests, and the market index: DSH's own
    # parser, and every pinned commit holds the package it lists (so it needs history).
    name: Versions and market index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check

  herdr:
    # The herdr pack (herdr/, the old automagik-herdr CI): its tests, a syntax check of every pack
    # mod and its tooling, shellcheck on the installer and the CLI's shell scripts, and its catalog
    # index (its version is the root's: `bun run check` above). Plain JavaScript that Herdr loads as
    # it is: no install, no dependencies. On the newest Node 22 and on 24, the tests' floor: the
    # pack's users run it on 22.7 or later (AGENTS.md), but the test stubs need
    # module.registerHooks (22.15+).
    # Only when herdr/ changed, or the workflows and lane tooling that test and pack it.
    name: herdr pack (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: herdr
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether herdr/ changed
        id: changed
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that opens a branch, or a base this checkout lacks, tests the pack anyway.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "herdr=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${BASE}...HEAD" | grep -qE '^(herdr/|herdr-layout/|\.github/workflows/(ci|release)\.yml$|scripts/(lane|version)\.ts$)'; then
            echo "herdr=true" >> "$GITHUB_OUTPUT"
          else
            echo "herdr/ did not change: nothing to test"
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.herdr == 'true'
        with:
          node-version: ${{ matrix.node }}

      # am-quota's Keychain tests run against the stand-in in test/am-quota-keychain.mjs, first on
      # PATH; am-quota-keychain-guard.test.mjs fails any that could reach the real `security`.
      - name: Tests
        if: steps.changed.outputs.herdr == 'true'
        run: node --test 'test/*.test.mjs'

      - name: Syntax
        if: steps.changed.outputs.herdr == 'true'
        run: |
          set -euo pipefail
          for f in mods/*/*.js mods/*/*.mjs mods/*/bin/*.mjs scripts/*.mjs scripts/*/*.mjs; do
            node --check "$f"
          done
          sh -n install.sh
          sh -n mods/am-sidebar/bin/run.sh
          sh -n mods/am-sidebar/bin/automagik-herdr
          shellcheck -s sh install.sh mods/am-sidebar/bin/run.sh mods/am-sidebar/bin/automagik-herdr

      # No home paths, private hosts or machine names in the pack (scripts/privacy-check.mjs).
      - name: Privacy
        if: steps.changed.outputs.herdr == 'true'
        run: node scripts/privacy-check.mjs

      - name: Catalog
        if: steps.changed.outputs.herdr == 'true'
        run: node scripts/catalog.mjs --check

      # release.js and install.sh pin each usagemeter build by sha256: checked against the release.
      - name: usagemeter pin
        if: steps.changed.outputs.herdr == 'true'
        run: node scripts/usagemeter-pin.mjs

      # On every pull request, whatever changed: herdr.dev skips the whole repository when a herdr-mod
      # entry folder (any folder holding mods/<name>/main.js) holds layouts/ (RFC 0011).
      - name: No layouts/ in a herdr-mod entry folder
        run: node scripts/entries.mjs --check

      # Every part.json under herdr/ and herdr-layout/ (RFC 0012): its fields, and what it names exists.
      - name: Parts (part.json)
        run: node scripts/parts.mjs --check

      - name: One version (the root's)
        if: steps.changed.outputs.herdr == 'true'
        run: node scripts/version.mjs check

  pocket:
    # Pocket's phone app (apps/pocket/, the old automagik-pocket android.yml): the debug APK, the
    # unit tests and lint. Its version is the root package.json's, so a change there builds it too.
    # Only when apps/pocket/ changed, or the workflows, lane tooling and version that build it.
    name: Pocket (build, test, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether apps/pocket/ changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that opens a branch, or a base this checkout lacks, builds the app anyway.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "pocket=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${BASE}...HEAD" | grep -qE '^(apps/pocket/|package\.json$|\.github/workflows/(ci|release)\.yml$|scripts/(lane|version)\.ts$)'; then
            echo "pocket=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps/pocket/ did not change: nothing to build"
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.changed.outputs.pocket == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.changed.outputs.pocket == 'true'
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Validates the wrapper checksum and caches Gradle's dependencies.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.changed.outputs.pocket == 'true'

      - name: Build the debug APK, run the unit tests and lint
        if: steps.changed.outputs.pocket == 'true'
        working-directory: apps/pocket/android
        run: ./gradlew --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.changed.outputs.pocket == 'true'
        with:
          name: pocket-reports
          path: |
            apps/pocket/android/app/build/reports/
            apps/pocket/android/app/build/test-results/
          if-no-files-found: ignore

      # The terminal page the app shows (its xterm assets), driven in Chromium.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.changed.outputs.pocket == 'true'
        with:
          python-version: '3.12'

      - name: Terminal page (Playwright)
        if: steps.changed.outputs.pocket == 'true'
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python apps/pocket/android/scripts/test_terminal.py

  pocket-link:
    # Pocket Link's bridge (herdr/mods/pocket-link, Pocket's, never in the pack): syntax and its
    # dependency-free tests (the pre-pairing limits, the pairing code, where its state lives,
    # public-status.json, how the dialog finds Node), on Linux and macOS. The pack's own gate above
    # does not run them: they live beside the mod, not in herdr/test/.
    name: Pocket Link bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        working-directory: herdr/mods/pocket-link
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whether Pocket Link changed
        id: changed
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "link=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${BASE}...HEAD" | grep -qE '^(herdr/mods/pocket-link/|\.github/workflows/ci\.yml$)'; then
            echo "link=true" >> "$GITHUB_OUTPUT"
          else
            echo "herdr/mods/pocket-link/ did not change: nothing to test"
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.link == 'true'
        with:
          node-version: '22'

      - name: Syntax
        if: steps.changed.outputs.link == 'true'
        run: |
          set -euo pipefail
          for f in bridge/*.mjs find-node.js main.js; do node --check "$f"; done

      - name: Test
        if: steps.changed.outputs.link == 'true'
        run: node --test bridge/*.test.mjs find-node.test.mjs

  plugin:
    # The Bot team and the welcome run on Node, as DSH does: Bun installs each and the DSH
    # release it pins in dev/harness/package.json, which its tests run against.
    name: ${{ matrix.app }} (plugin tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [acp-dsh, bots-dsh, locale-pt-br-dsh, unfold-bot-dsh, unfold-bridge-dsh, unfold-capabilities-dsh, unfold-events-dsh, unfold-mind-dsh, unfold-session-dsh, unfold-settings-dsh, unfold-sse-dsh, unfold-trajectory-dsh, welcome-dsh]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Cache the pinned DSH harness
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/${{ matrix.app }}/dev/harness/node_modules
          key: dsh-harness-bun-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles(format('apps/{0}/dev/harness/package.json', matrix.app)) }}

      - name: Install
        run: |
          bun install --frozen-lockfile
          [ -d dev/harness/node_modules ] || bun run harness

      - name: Omni's plugins at the pinned release
        # The welcome lists the tools Omni's channels and canvases register; its test reads
        # them from Omni at the release apps/desktop/omni.json pins.
        if: matrix.app == 'welcome-dsh'
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/omni"
          commit=$(node -p "require('../desktop/omni.json').commit")
          git init -q "${dir}"
          git -C "${dir}" remote add origin https://github.com/automagik-dev/omni
          git -C "${dir}" sparse-checkout set --no-cone /apps/omni-channels-dsh/ /apps/omni-canvas-dsh/
          git -C "${dir}" fetch -q --depth 1 --filter=blob:none origin "${commit}"
          git -C "${dir}" checkout -q FETCH_HEAD
          echo "OMNI_CHECKOUT=${dir}" >> "$GITHUB_ENV"

      - name: Generated files are current
        # A package with no browser half has no client to build.
        run: '[ ! -f scripts/build-client.mjs ] || node scripts/build-client.mjs --check'

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  pets:
    # The headless pet bake (automagik-pets) on Node, as DSH and Automagik Herdr run it: Bun
    # installs sharp, whose prebuilt binary carries libvips; no browser is needed (the parity
    # check against Chromium skips without one).
    name: automagik-pets (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/automagik-pets
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  desktop:
    # The desktop app's main-process logic in plain Node (home layout, profile install and the
    # move from the old package names, the preload, dsh supervision, navigation, updates), so
    # the Electron binary itself is not downloaded here.
    name: Desktop (main-process tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Test
        run: npm test

  boot:
    # The plugins booted for real with Omni's channels and canvases (the release omni.json
    # pins): boot-check.yml, which Follow Omni also runs on a candidate Omni before carrying it.
    name: Boot
    uses: ./.github/workflows/boot-check.yml
    permissions:
      contents: read
