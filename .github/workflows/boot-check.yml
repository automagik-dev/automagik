name: Boot check

# The plugins booted for real with Omni's channels and canvases (the release the desktop
# carries) and the add-ons the desktop profile pins: DSH refuses the whole web UI when one
# plugin's client import misses, so a rename one of them still imports, or an add-on pinned
# to a development build (v3.53.0, react/jsx-dev-runtime), fails here.
#
# CI calls it on every push and pull request with the Omni apps/desktop/omni.json pins.
# Follow Omni calls it with a candidate Omni (omni_version and omni_commit) before it moves
# omni.json on dev, so an Omni release that does not boot never reaches a desktop release. The
# candidate is written exactly as Follow Omni's carry writes it (omni.json and the welcome's
# package.json), so the tree that boots is the tree that is carried.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out (the caller's default when empty)
        type: string
        default: ''
      omni_version:
        description: A candidate Omni release to boot instead of the one omni.json pins
        type: string
        default: ''
      omni_commit:
        description: The candidate's commit (required with omni_version)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  boot:
    name: Boot with Omni's plugins${{ inputs.omni_version != '' && format(' {0}', inputs.omni_version) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: '1'
      OMNI_VERSION: ${{ inputs.omni_version }}
      OMNI_COMMIT: ${{ inputs.omni_commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: The candidate Omni
        if: inputs.omni_version != ''
        run: |
          set -euo pipefail
          [[ "${OMNI_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error ::omni_version is not a release version (x.y.z)"; exit 1; }
          [[ "${OMNI_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error ::omni_commit '${OMNI_COMMIT}' is not a full commit sha"; exit 1; }
          node -e '
            const fs = require("node:fs")
            const [version, commit] = process.argv.slice(1)
            const file = "apps/desktop/omni.json"
            const json = JSON.parse(fs.readFileSync(file, "utf8"))
            fs.writeFileSync(file, JSON.stringify({ ...json, version, commit }, null, 2) + "\n")
            // The welcome installs the same release of the Omni plugins in a plain DSH.
            const welcome = "apps/welcome-dsh/package.json"
            const pkg = JSON.parse(fs.readFileSync(welcome, "utf8"))
            pkg.automagik.omni = { ...pkg.automagik.omni, version, commit }
            fs.writeFileSync(welcome, JSON.stringify(pkg, null, 2) + "\n")
          ' "${OMNI_VERSION}" "${OMNI_COMMIT}"
          cat apps/desktop/omni.json
          node -p 'JSON.stringify(require("./apps/welcome-dsh/package.json").automagik.omni)'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache the pinned DSH harness
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/bots-dsh/dev/harness/node_modules
          key: dsh-harness-bun-bots-dsh-${{ runner.os }}-${{ hashFiles('apps/bots-dsh/dev/harness/package.json') }}

      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          [ -d apps/bots-dsh/dev/harness/node_modules ] || (cd apps/bots-dsh && bun run harness)

      - name: Boot
        run: node scripts/boot-check.mjs --shot boot.png

      - name: The candidate fails
        if: failure() && inputs.omni_version != ''
        run: |
          line="Omni ${OMNI_VERSION} (${OMNI_COMMIT:0:9}) fails the boot check: not followed, nothing pushed, no release. The next scheduled run tries again."
          echo "::error ::${line}"
          echo "### ${line}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: boot-screenshot
          path: boot.png
          if-no-files-found: ignore
          retention-days: 7
