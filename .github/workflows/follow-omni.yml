name: Follow Omni

# The desktop app carries Omni's channels and canvases from one Omni release
# (apps/desktop/omni.json). Every 30 minutes (or when dispatched) this looks for the newest
# Omni release (`v<version>`, prereleases included) above the one omni.json pins (and the
# welcome's package.json, which installs the same release in a plain DSH). When its
# channels and canvas plugins carry its version and are tested on the DeepSeek Harness the
# desktop runs (apps/desktop/runtime/package.json, the Bot team's harness), it moves omni.json
# to it on dev and cuts an Automagik release with it (release.yml). A release tested on another
# DSH is not followed until the Bot team moves to that DSH (apps/desktop/scripts/follow-dsh.mjs
# and the harness pins, by hand, with their tests).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: follow-omni
  cancel-in-progress: false

jobs:
  follow:
    name: Look for a newer Omni
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      OMNI: automagik-dev/omni
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev

      - name: The newest Omni release
        id: newest
        run: |
          set -euo pipefail
          current=$(node -p "require('./apps/desktop/omni.json').version")
          gh api "repos/${OMNI}/releases?per_page=30" \
            --jq '.[] | select(.draft | not) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tag_name | ltrimstr("v")' \
            > releases.txt
          newest=$(sort -V releases.txt | tail -1)
          if [[ -z "${newest}" || "${newest}" == "${current}" || "$(printf '%s\n%s\n' "${current}" "${newest}" | sort -V | tail -1)" != "${newest}" ]]; then
            echo "Omni ${newest:-none}: omni.json is at ${current}, nothing to follow"
            exit 0
          fi
          read_json() { gh api "repos/${OMNI}/contents/$1?ref=v${newest}" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true; }
          for app in omni-channels-dsh omni-canvas-dsh; do
            version=$(read_json "apps/${app}/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})')
            if [[ "${version}" != "${newest}" ]]; then
              echo "::notice ::Omni ${newest}: ${app} is at '${version}', not its version: not following it"
              exit 0
            fi
          done
          tested=$(read_json "apps/omni-channels-dsh/dev/harness/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).dependencies["@deepseek-ai/dsh"])}catch{console.log("")}})')
          pinned=$(node -p "require('./apps/desktop/runtime/package.json').dependencies['@deepseek-ai/dsh']")
          if [[ "${tested}" != "${pinned}" ]]; then
            echo "::notice ::Omni ${newest} tests its plugins on dsh '${tested}', the desktop runs ${pinned}: not following it until the Bot team moves"
            exit 0
          fi
          echo "version=${newest}" >> "$GITHUB_OUTPUT"

      - name: Move to it
        id: bump
        if: steps.newest.outputs.version != ''
        env:
          VERSION: ${{ steps.newest.outputs.version }}
        run: |
          set -euo pipefail
          commit=$(gh api "repos/${OMNI}/commits/v${VERSION}" --jq .sha)
          node -e '
            const fs = require("node:fs")
            const [version, commit] = process.argv.slice(1)
            const file = "apps/desktop/omni.json"
            const json = JSON.parse(fs.readFileSync(file, "utf8"))
            fs.writeFileSync(file, JSON.stringify({ ...json, version, commit }, null, 2) + "\n")
            // The welcome installs the same release of the Omni plugins in a plain DSH.
            const welcome = "apps/welcome-dsh/package.json"
            const pkg = JSON.parse(fs.readFileSync(welcome, "utf8"))
            pkg.automagik.omni = { ...pkg.automagik.omni, version, commit }
            fs.writeFileSync(welcome, JSON.stringify(pkg, null, 2) + "\n")
          ' "${VERSION}" "${commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(desktop): carry Omni ${VERSION}"
          git push -q origin HEAD:refs/heads/dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: follow
    if: needs.follow.outputs.sha != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets: inherit
