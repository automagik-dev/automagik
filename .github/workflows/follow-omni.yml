name: Follow Omni

# The desktop app carries Omni's channels and canvases from one Omni release
# (apps/desktop/omni.json). Omni's `omni-release` repository_dispatch is the fast path; our
# Release workflow (release.yml) completing on dev also checks after every Automagik merge.
# Any release conclusion qualifies: this reads Omni's releases itself, independently of whether
# Automagik's release succeeded. The every-30-minute schedule is the last fallback; a dispatch
# by hand also checks. This looks for the newest Omni release (`v<version>`, prereleases
# included) above the one omni.json pins (and the welcome's package.json, which installs the
# same release in a plain DSH). Each of Omni's
# plugins carries the Omni release of its own last change (omni#1356), so a plugin may be
# behind the release but never ahead of it. When the channels and canvas plugins are at or
# below its version and admit the desktop runtime in the same DSH patch series as their
# harness, it boots that Omni with dev's plugins (boot-check.yml, the check CI runs), and only
# when it boots does it move omni.json on dev and cut an Automagik release (release.yml): the
# bump is pushed with GITHUB_TOKEN, so CI never boots it before installed apps update. An Omni
# that fails the boot is not followed and the run fails; the next run tries it again. The bump
# commit is built on exactly the dev commit that booted and pushed without force: when dev
# moved during the boot, the push is refused, nothing is carried, and the next run boots the
# new dev. Nothing untested rides along.
# Downgrades and a different patch series wait for a coordinated harness move.
#
# It carries at most one Omni a UTC day (#371): when the commit by which dev last moved omni.json
# (along its first parents: a squash, this workflow's push, or a true merge, at its merge time) was
# committed today (UTC), a newer Omni is held. It still boots (a
# failing boot fails the run) but nothing is carried or released; the first run after 00:00 UTC
# carries the newest Omni then. The bump and the release wait together: a carry left on dev would
# make the next merge's release, of any lane, a full one (scripts/lane.ts kindOf). Dispatched by
# hand with skip_daily_hold, it carries anyway and says so in a warning.
#
# Dispatched with dry_run, it boots and builds the bump but only rehearses the push
# (`git push --dry-run`) and cuts no release. A dry run is never held; it reports whether a real
# run would be. omni_version (and omni_commit) put a given Omni
# through the gate, also one that is not newer; dev_sha boots and builds on an older dev
# commit, as if dev moved during the boot. All three are only taken with dry_run, and
# skip_daily_hold never is.
#
# Omni's dispatch carries {version, tag, sha} as a hint only: the run still reads Omni's
# releases itself and follows what it finds, through the same checks and boot as the
# schedule, and only logs the hint next to it. Nothing from the payload is carried. While the
# list does not show the hinted release yet, it looks again every 20s for up to 2 minutes,
# then warns and goes on with what the list shows. The token that sends the dispatch lives
# in Omni (AUTOMAGIK_DISPATCH_TOKEN). Runs share one concurrency
# group: a dispatch during a follow waits for it, and a later one replaces the waiting one,
# which loses nothing because every run looks for the newest release itself.

on:
  schedule:
    # Off the top and the half of the hour, where GitHub delays and drops scheduled runs. A
    # change to this line also makes its committer the schedule's actor (GitHub's documented
    # way to bring back a schedule that stopped firing).
    - cron: '11,41 * * * *'
  repository_dispatch:
    # Sent by Omni's release workflow when it publishes a release.
    types: [omni-release]
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Boot the candidate and rehearse the push; push nothing, release nothing
        type: boolean
        default: false
      omni_version:
        description: Put this Omni release through the gate (dry_run only)
        type: string
        default: ''
      omni_commit:
        description: The commit to boot for omni_version (its tag's commit when empty; dry_run only)
        type: string
        default: ''
      dev_sha:
        description: Boot and build on this dev commit instead of dev's tip, as if dev moved (dry_run only)
        type: string
        default: ''
      skip_daily_hold:
        description: Carry even though omni.json already moved today (UTC); never with dry_run
        type: boolean
        default: false

permissions: {}

concurrency:
  group: follow-omni
  cancel-in-progress: false

jobs:
  follow:
    name: Look for a newer Omni
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.newest.outputs.version }}
      commit: ${{ steps.newest.outputs.commit }}
      dev: ${{ steps.newest.outputs.dev }}
      held: ${{ steps.hold.outputs.held }}
    env:
      GH_TOKEN: ${{ github.token }}
      OMNI: automagik-si/omni
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      WANT_VERSION: ${{ inputs.omni_version }}
      WANT_COMMIT: ${{ inputs.omni_commit }}
      WANT_DEV: ${{ inputs.dev_sha }}
      SKIP_HOLD: ${{ inputs.skip_daily_hold && 'true' || 'false' }}
      # Omni's dispatch payload: logged next to what the run finds, never followed.
      HINT_VERSION: ${{ github.event.client_payload.version }}
      HINT_TAG: ${{ github.event.client_payload.tag }}
      HINT_SHA: ${{ github.event.client_payload.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          # The whole history: on a shallow one, the oldest commit fetched looks as if it moved
          # omni.json (the Once a UTC day step).
          fetch-depth: 0
          persist-credentials: false

      - name: The newest Omni release
        id: newest
        run: |
          set -euo pipefail
          if [[ -n "${WANT_VERSION}${WANT_COMMIT}${WANT_DEV}" && "${DRY_RUN}" != true ]]; then
            echo "::error ::omni_version, omni_commit and dev_sha are only taken with dry_run: a chosen Omni or dev is never carried"
            exit 1
          fi
          if [[ "${SKIP_HOLD}" == true && "${DRY_RUN}" == true ]]; then
            echo "::error ::skip_daily_hold is not taken with dry_run: a dry run is never held"
            exit 1
          fi
          # Dispatch inputs reach GITHUB_OUTPUT: only a release version and full shas pass.
          if [[ -n "${WANT_VERSION}" && ! "${WANT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::omni_version is not a release version (x.y.z)"
            exit 1
          fi
          if [[ -n "${WANT_COMMIT}" && ! "${WANT_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error ::omni_commit is not a full commit sha"
            exit 1
          fi
          if [[ -n "${WANT_DEV}" && ! "${WANT_DEV}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error ::dev_sha '${WANT_DEV}' is not a full commit sha"
            exit 1
          fi
          current=$(node -p "require('./apps/desktop/omni.json').version")
          if [[ -n "${WANT_VERSION}" ]]; then
            newest="${WANT_VERSION}"
          else
            lookup() {
              gh api "repos/${OMNI}/releases?per_page=30" \
                --jq '.[] | select(.draft | not) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tag_name | ltrimstr("v")' \
                > releases.txt
              newest=$(sort -V releases.txt | tail -1)
            }
            # above A B: version A is higher than B, or B is empty.
            above() { [[ "$1" != "$2" && "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" == "$1" ]]; }
            lookup
            if [[ "${GITHUB_EVENT_NAME}" == repository_dispatch ]]; then
              # The hint is only printed, and only what has the shape of a version, tag and sha.
              hint() { [[ "$1" =~ $2 ]] && echo "$1" || echo '(malformed)'; }
              wanted=$(hint "${HINT_VERSION}" '^[0-9]+\.[0-9]+\.[0-9]+$')
              # Omni dispatches as it publishes, and the releases list may lag: look again until
              # it lists the hinted release. Still only what the lookup lists is followed.
              unlisted() { [[ "${wanted}" != '(malformed)' ]] && above "${wanted}" "${newest}"; }
              for try in 1 2 3 4 5 6; do
                unlisted || break
                echo "Omni ${wanted} is not listed yet (newest ${newest:-none}): again in 20s (${try}/6)"
                sleep 20
                lookup
              done
              line="Omni dispatched ${wanted} ($(hint "${HINT_TAG}" '^v[0-9]+\.[0-9]+\.[0-9]+$')"
              line+=" $(hint "${HINT_SHA}" '^[0-9a-f]{40}$'))"
              line+="; the newest release is ${newest:-none}"
              echo "${line}"
              echo "### ${line}" >> "$GITHUB_STEP_SUMMARY"
              if unlisted; then
                echo "::warning ::Omni dispatched ${wanted}, but its releases still list ${newest:-none} after 2 minutes"
              fi
            fi
            if [[ -z "${newest}" || "${newest}" == "${current}" || "$(printf '%s\n%s\n' "${current}" "${newest}" | sort -V | tail -1)" != "${newest}" ]]; then
              echo "Omni ${newest:-none}: omni.json is at ${current}, nothing to follow"
              exit 0
            fi
          fi
          read_json() { gh api "repos/${OMNI}/contents/$1?ref=v${newest}" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true; }
          for app in omni-channels-dsh omni-canvas-dsh; do
            version=$(read_json "apps/${app}/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})')
            if [[ -z "${version}" || "$(printf '%s\n%s\n' "${version}" "${newest}" | sort -V | tail -1)" != "${newest}" ]]; then
              echo "::notice ::Omni ${newest}: ${app} is at '${version}', ahead of its release or unreadable: not following it"
              exit 0
            fi
          done
          tested=$(read_json "apps/omni-channels-dsh/dev/harness/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).dependencies["@deepseek-ai/dsh"])}catch{console.log("")}})')
          pinned=$(node -p "require('./apps/desktop/runtime/package.json').dependencies['@deepseek-ai/dsh']")
          for app in omni-channels-dsh omni-canvas-dsh; do
            range=$(read_json "apps/${app}/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).engines.dsh)}catch{console.log("")}})')
            if ! node --input-type=module -e 'import { acceptsHarness } from "./apps/desktop/scripts/follow-dsh.mjs"; process.exit(acceptsHarness(...process.argv.slice(1)) ? 0 : 1)' "${pinned}" "${tested}" "${range}"; then
              echo "::notice ::Omni ${newest} ${app} tests on dsh '${tested}' and declares '${range}', the desktop runs ${pinned}: not following it until the Bot team moves"
              exit 0
            fi
          done
          commit="${WANT_COMMIT:-$(gh api "repos/${OMNI}/commits/v${newest}" --jq .sha)}"
          {
            echo "version=${newest}"
            echo "commit=${commit}"
            echo "dev=${WANT_DEV:-$(git rev-parse HEAD)}"
          } >> "$GITHUB_OUTPUT"
          echo "### Candidate: Omni ${newest} (${commit:0:9}), omni.json is at ${current}$([[ "${DRY_RUN}" == true ]] && echo ', dry run: boot check only')" >> "$GITHUB_STEP_SUMMARY"

      # Once a UTC day (#371): when a commit that moved omni.json on dev was committed today (UTC),
      # by this workflow or by hand, the candidate is held: it still boots, so a bad Omni still
      # fails the run, but it is not carried or released. Nothing is stored: the first run after
      # 00:00 UTC (the 00:11 schedule) looks for the newest Omni itself and carries that.
      - name: Once a UTC day
        id: hold
        if: steps.newest.outputs.version != ''
        env:
          VERSION: ${{ steps.newest.outputs.version }}
        run: |
          set -euo pipefail
          # The checkout is dev's tip with its whole history (never dev_sha). Along dev's first
          # parents, the commit that last moved omni.json is the one dev made: a squash or a push
          # by this workflow, or a true merge, dated when it was merged, never its branch commit.
          # An error here fails the run: a day is never assumed free.
          last=$(TZ=UTC git log --first-parent -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format='%H %cd' HEAD -- apps/desktop/omni.json)
          sha="${last%% *}"
          at="${last#* }"
          today=$(date -u +%F)
          held=false
          if [[ -n "${last}" && "${at:0:10}" == "${today}" ]]; then
            moved="omni.json moved today at ${at:11:5}Z (${sha:0:9})"
            if [[ "${DRY_RUN}" == true ]]; then
              line="Dry run: a real run would hold Omni ${VERSION}: ${moved}"
            elif [[ "${SKIP_HOLD}" == true ]]; then
              line="Daily hold skipped by hand: carrying Omni ${VERSION} although ${moved}"
              echo "::warning ::${line}"
            else
              held=true
              line="Omni ${VERSION} held: ${moved}; it boots but is not carried."
              line+=" The first run after 00:00 UTC (the 00:11 schedule) carries the newest Omni"
            fi
          else
            line="omni.json last moved ${at:0:10}${last:+ at ${at:11:5}Z (${sha:0:9})}, not today (${today} UTC):"
            [[ -n "${last}" ]] || line="omni.json was never moved on dev:"
            line+=" $([[ "${DRY_RUN}" == true ]] && echo 'a real run would carry' || echo 'carrying') Omni ${VERSION} once it boots"
          fi
          echo "held=${held}" >> "$GITHUB_OUTPUT"
          echo "${line}"
          echo "### ${line}" >> "$GITHUB_STEP_SUMMARY"

  boot:
    name: Boot the candidate
    needs: follow
    if: needs.follow.outputs.version != ''
    uses: ./.github/workflows/boot-check.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.follow.outputs.dev }}
      omni_version: ${{ needs.follow.outputs.version }}
      omni_commit: ${{ needs.follow.outputs.commit }}

  carry:
    # Only after the candidate booted: a failed boot fails the run here and nothing moves. The
    # bump goes on the dev commit that booted, and only a fast-forward of dev is pushed. A held
    # candidate (omni.json already moved today, UTC) is not carried, so nothing is released.
    name: Move to it
    needs: [follow, boot]
    if: needs.follow.outputs.version != '' && needs.follow.outputs.held != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.follow.outputs.dev }}

      - name: Move omni.json and the welcome to it
        id: bump
        env:
          VERSION: ${{ needs.follow.outputs.version }}
          COMMIT: ${{ needs.follow.outputs.commit }}
          BOOTED: ${{ needs.follow.outputs.dev }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs")
            const [version, commit] = process.argv.slice(1)
            const file = "apps/desktop/omni.json"
            const json = JSON.parse(fs.readFileSync(file, "utf8"))
            fs.writeFileSync(file, JSON.stringify({ ...json, version, commit }, null, 2) + "\n")
            // The welcome installs the same release of the Omni plugins in a plain DSH.
            const welcome = "apps/welcome-dsh/package.json"
            const pkg = JSON.parse(fs.readFileSync(welcome, "utf8"))
            pkg.automagik.omni = { ...pkg.automagik.omni, version, commit }
            fs.writeFileSync(welcome, JSON.stringify(pkg, null, 2) + "\n")
          ' "${VERSION}" "${COMMIT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          empty=()
          if git diff --quiet; then
            # A dry run may rehearse the Omni dev already carries; a real run never carries nothing.
            [[ "${DRY_RUN}" == true ]] || { echo "::error ::Omni ${VERSION} changes nothing on dev ${BOOTED:0:9}"; exit 1; }
            empty=(--allow-empty)
          fi
          git commit -qa "${empty[@]}" -m "chore(desktop): carry Omni ${VERSION}"
          [[ "$(git rev-parse HEAD^)" == "${BOOTED}" ]] || { echo "::error ::the bump is not on the dev commit that booted (${BOOTED})"; exit 1; }
          rehearse=()
          [[ "${DRY_RUN}" == true ]] && rehearse=(--dry-run)
          # No force: dev only fast-forwards from the commit that booted.
          if git push "${rehearse[@]}" origin HEAD:refs/heads/dev; then
            if [[ "${DRY_RUN}" == true ]]; then
              echo "### Dry run: Omni ${VERSION} would fast-forward dev ${BOOTED:0:9} -> $(git rev-parse --short=9 HEAD); not pushed, no release" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          tip=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [[ -n "${tip}" && "${tip}" != "${BOOTED}" ]]; then
            line="dev moved from ${BOOTED:0:9} to ${tip:0:9} while Omni ${VERSION} booted: not carried, no release; retrying next schedule"
            echo "::notice ::${line}"
            echo "### ${line}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error ::the push to dev was refused and dev is still at ${BOOTED:0:9}"
          exit 1

  release:
    name: Release
    needs: carry
    if: needs.carry.outputs.sha != '' && !inputs.dry_run
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: write # release.yml dispatches the stable release's server image.
    secrets: inherit
