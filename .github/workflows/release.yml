name: Release

# Cuts an Automagik release from dev on every merge into it, as Tactu does: one version for the
# whole repository (3.N, semver 3.N.0, N one above the last release: scripts/version.ts),
# committed and tagged `v<version>` on dev, published as the GitHub release `v<version>` with
#
#   automagik-bots-dsh-<version>.tgz      the Bot team (npm pack of apps/bots-dsh)
#   automagik-welcome-dsh-<version>.tgz   the welcome and Connect AI (apps/welcome-dsh)
#   automagik-unfold-bridge-dsh-<version>.tgz  the Unfold bridge (apps/unfold-bridge-dsh)
#   automagik-unfold-mind-dsh-<version>.tgz    the Unfold Mind stream (apps/unfold-mind-dsh)
#   automagik-locale-pt-br-dsh-<version>.tgz   Brazilian Portuguese for DSH (apps/locale-pt-br-dsh)
#   automagik-acp-dsh-<version>.tgz       agents over ACP as DSH models (apps/acp-dsh)
#   automagik-unfold-capabilities-dsh-<version>.tgz  what Unfold can do, read-only (apps/unfold-capabilities-dsh)
#   automagik-unfold-settings-dsh-<version>.tgz      how Unfold is set up, read-only (apps/unfold-settings-dsh)
#   automagik-unfold-events-dsh-<version>.tgz  what the Unfold agent is doing, in DSH (apps/unfold-events-dsh)
#   automagik-unfold-sse-dsh-<version>.tgz     server-sent events for the Unfold plugins (apps/unfold-sse-dsh)
#   automagik-unfold-trajectory-dsh-<version>.tgz  Unfold's trajectory (apps/unfold-trajectory-dsh)
#   automagik-unfold-session-dsh-<version>.tgz Unfold's session as a DSH conversation (apps/unfold-session-dsh)
#   automagik-unfold-bot-dsh-<version>.tgz     the Unfold Bot (apps/unfold-bot-dsh)
#   plugins.json                          each tarball's name, version, file and integrity
#   <add-on>-<its version>.tgz            the add-ons the lane carries, at the profile's pins
#   addons.json                           (scripts/lane.ts LANE_ADDONS), and what each one is
#   automagik-herdr-pack-<version>.tgz    the herdr pack, when herdr/ shipped something since the
#   automagik-herdr-pack-<version>.tgz.sha256  last release: every PACK_MODS folder of the tag's
#                                         herdr/mods/ (never pocket-link) plus
#                                         herdr-layout/layouts/automagik.json as layouts/automagik.json,
#                                         and its sha256 (docs/rfcs/0011-monorepo-parts-and-releases.md)
#
#   automagik-pocket-<version>.apk       Pocket's phone app, when apps/pocket/ shipped something since
#   latest.json                           the last release: the APK signed with the release key
#                                         (POCKET_SIGNING_KEYSTORE / POCKET_SIGNING_PASSWORD) and what
#                                         the app reads to update (versionCode, versionName, url, sha256)
#
# and, when it packed the herdr pack, it signs pack.json (the newest pack: its release, tarball URL
# and sha256; ed25519, the HERDR_PACK_KEY secret, the pack's own key; the public keys are
# herdr/mods/am-sidebar/pack-keys.json) and puts it with pack.json.sig on the rolling `herdr-lane`
# release, which holds nothing else: herdr/install.sh and `automagik-herdr update` read only that.
#
# and, when it built Pocket on a release that is not a prerelease, it replaces latest.json on the
# rolling `pocket-lane` release, which holds nothing else and is never Latest: installed phones read
# only that (apps/pocket/android/app/build.gradle.kts) and take the APK from its vX.Y.Z release.
#
# and then the desktop app's builds (desktop-build.yml). Omni pins a release's plugins.json
# (its apps/automagik.json) to serve them from its own market and admin UI; the
# dsh-marketplace lists the plugins at the tag's commit. After the release, the market index
# here lists it (scripts/marketplace.ts pin) and main moves to the tag.
#
# Only the jobs that write dev (the cut, the index listing) take turns; a release's desktop
# builds run on their own (desktop-build.yml locks per version), so a plugin patch merged during
# a full release's Mac build is out in minutes instead of after it.
#
# A push to dev (a merged pull request) cuts one; so does follow-omni.yml (workflow_call), and a
# dispatch: gh workflow run release.yml --ref dev [--field prerelease=true] [--field desktop=false]
# [--field replace_unverified_herdr_pointer=true] (only when the posted herdr-lane pointer no longer
# verifies, e.g. its key left pack-keys.json, and you have checked its sequence is not newer: the
# release otherwise refuses to post over it; scripts/herdr-lane.ts posted).
# The workflow's own pushes (the version commit, the index listing, follow-omni's pin) start no
# run: GitHub starts none for a push made with the workflow token. A dev that has nothing since the
# last release but those commits cuts nothing. Cuts queue one at a time; a merge that lands while
# one is cutting is released by the next run, with every merge after it that lands before it starts.
#
# The plugin lane (scripts/lane.ts): when everything since the last full release (v3.N.0) is the
# plugins' alone (or moves only the pins of the add-ons the lane carries), the release is a patch,
# v3.N.P, with the plugin tarballs and no desktop build. When everything since the last release
# (any tag) is under herdr/, it is a herdr patch, v3.N.P with the pack alone: no plugin tarballs, no
# new lane, no desktop build, no market listing (the plugins did not move). When it is all under
# apps/pocket/ (or apps/pocket/ and the herdr part), it is a pocket patch the same way, with the APK.
# Every release, full or patch, then signs lane.json (ed25519, the PLUGIN_LANE_KEY secret; the
# public keys are plugin-lane/keys.json) and puts it on the rolling `plugin-lane` release, which
# holds nothing else. The desktop app and Omni's market install the plugins from it, without a
# release of their own.
#
# Nothing is published to npm: the plugins ship as git sources and release files only.
# Pushes use the workflow's own token; CI already ran on the dev commit being released, and
# this job runs the gates again before it tags.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a prerelease (not shown as Latest)'
        required: false
        type: boolean
        default: false
      desktop:
        description: 'Build and add the desktop app'
        required: false
        type: boolean
        default: true
      replace_unverified_herdr_pointer:
        description: 'Post the herdr lane over a posted pointer that does not verify (RFC 0011)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      prerelease:
        description: 'Publish as a prerelease (not shown as Latest)'
        required: false
        type: boolean
        default: false
      desktop:
        description: 'Build and add the desktop app'
        required: false
        type: boolean
        default: true
      replace_unverified_herdr_pointer:
        description: 'Post the herdr lane over a posted pointer that does not verify (RFC 0011)'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  cut:
    name: Cut v<version> on dev
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-cut
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cut.outputs.version }}
      sha: ${{ steps.cut.outputs.sha }}
      lane: ${{ steps.lane.outputs.kind }}
      herdr: ${{ steps.lane.outputs.herdr }}
      pocket: ${{ steps.lane.outputs.pocket }}
      pocket_since: ${{ steps.lane.outputs.pocket_since }}
    env:
      DO_NOT_TRACK: '1'
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Anything new since the last release
        id: new
        run: |
          set -euo pipefail
          # The newest release, a full one or a plugin patch (calendar tags have six-digit minors).
          last=$(git tag --list 'v3.*' --sort=-v:refname | grep -E '^v3\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$' | head -1 || true)
          # Commits since it other than the release's own (its version commit and index listing)
          # and those that ship nothing (CI, docs, tests).
          if [[ -n "${last}" && -z "$(git log --no-merges --format=%s "${last}..HEAD" | grep -vE '^(chore\(release\)|ci|docs|test)(\([^)]*\))?!?: ' || true)" ]]; then
            echo "dev has nothing since ${last}: no release"
          # Nor a change no install sees, whatever its commit says (a plugin's dev tools, its lint
          # script: not in its package's files). A release of it would only ask every app to restart.
          elif [[ -n "${last}" && "$(bun scripts/lane.ts ships "${last}")" == "no" ]]; then
            echo "nothing since ${last} reaches an install: no release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The gates the release stands on
        if: steps.new.outputs.release == 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run check
          for app in acp-dsh bots-dsh locale-pt-br-dsh unfold-bot-dsh unfold-bridge-dsh unfold-capabilities-dsh unfold-events-dsh unfold-mind-dsh unfold-session-dsh unfold-settings-dsh unfold-sse-dsh unfold-trajectory-dsh welcome-dsh; do
            (cd "apps/${app}" && bun install --frozen-lockfile --ignore-scripts && { [ ! -f scripts/build-client.mjs ] || node scripts/build-client.mjs --check; })
          done

      - name: Which lane
        id: lane
        if: steps.new.outputs.release == 'true'
        run: |
          set -euo pipefail
          full=$(git tag --list 'v3.*.0' --sort=-v:refname | grep -E '^v3\.(0|[1-9][0-9]{0,3})\.0$' | head -1 || true)
          last=$(git tag --list 'v3.*' --sort=-v:refname | grep -E '^v3\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$' | head -1 || true)
          kind=$(bun scripts/lane.ts kind "${full}" "${last}")
          # The herdr pack is rebuilt when herdr/ shipped something since the last release, any kind.
          herdr=$(bun scripts/lane.ts herdr "${last}")
          # Pocket's app is rebuilt when apps/pocket/ shipped something since the build phones have: the
          # version pocket-lane names (a prerelease never moves it, so a Pocket change in one comes
          # again), or the last release when there is no lane yet (scripts/lane.ts pocket-since).
          lane_version=$(gh release download pocket-lane --repo "${GITHUB_REPOSITORY}" -p latest.json -O - 2>/dev/null | jq -r '.versionName // empty' 2>/dev/null || true)
          pocket_since=$(bun scripts/lane.ts pocket-since "${last}" "${lane_version}")
          pocket=$(bun scripts/lane.ts pocket "${pocket_since}")
          { echo "kind=${kind}"; echo "herdr=${herdr}"; echo "pocket=${pocket}"; echo "pocket_since=${pocket_since}"; echo "base=${full#v}"; } >> "$GITHUB_OUTPUT"
          echo "since ${full:-the start}: ${kind} release; since ${last:-the start}, the herdr pack: ${herdr}; since ${pocket_since:-the start}, Pocket: ${pocket}"

      # The old automagik-herdr CI gate, on the pack this release attaches (Node 22.7+, shellcheck).
      - name: The herdr pack's gates
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.herdr == 'yes'
        working-directory: herdr
        run: |
          set -euo pipefail
          node --test 'test/*.test.mjs'
          for f in mods/*/*.js mods/*/*.mjs mods/*/bin/*.mjs mods/*/pack/*.mjs scripts/*.mjs scripts/*/*.mjs; do
            node --check "$f"
          done
          sh -n install.sh
          shellcheck -s sh install.sh mods/am-sidebar/bin/run.sh mods/am-sidebar/bin/automagik-herdr
          node scripts/catalog.mjs --check
          node scripts/version.mjs check
          node scripts/entries.mjs --check
          node scripts/parts.mjs --check

      # Before the cut, so a release that packs the pack never goes out without a pointer the
      # installed packs trust: HERDR_PACK_KEY must be a key pack-keys.json lists (its keyId is the
      # entry with its public key). The HERDR_PACK_SIGNER variable picks the secret slot, so a
      # rotation's new key waits in HERDR_PACK_KEY_NEXT until it is switched on (RFC 0011).
      - name: The herdr pack's signing key
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.herdr == 'yes'
        env:
          HERDR_PACK_KEY: ${{ vars.HERDR_PACK_SIGNER == 'HERDR_PACK_KEY_NEXT' && secrets.HERDR_PACK_KEY_NEXT || secrets.HERDR_PACK_KEY }}
        run: bun scripts/herdr-lane.ts check-key

      # Before the cut, so a release that rebuilds Pocket never goes out with an app that fails its
      # tests or lint, nor without the key that signs it (names only: the values are never read here).
      - name: Pocket's signing key is in the secrets
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'
        env:
          HAS_KEYSTORE: ${{ secrets.POCKET_SIGNING_KEYSTORE != '' }}
          HAS_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD != '' }}
        run: |
          if [[ "${HAS_KEYSTORE}" != "true" || "${HAS_PASSWORD}" != "true" ]]; then
            echo "::error::POCKET_SIGNING_KEYSTORE and POCKET_SIGNING_PASSWORD must be in this repository's secrets: a Pocket release is signed with the release key"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'

      - name: Pocket's gates
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'
        working-directory: apps/pocket/android
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug

      # Before the cut, so an add-on that cannot ride the lane stops the run before any tag.
      - name: Pack the add-ons the lane carries
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.kind != 'herdr' && steps.lane.outputs.kind != 'pocket'
        run: |
          set -euo pipefail
          bun scripts/lane.ts pack-addons release

      - name: Version, commit and tag
        id: cut
        if: steps.new.outputs.release == 'true'
        env:
          KIND: ${{ steps.lane.outputs.kind }}
          HERDR: ${{ steps.lane.outputs.herdr }}
        run: |
          set -euo pipefail
          if [[ "${KIND}" == "plugins" || "${KIND}" == "herdr" || "${KIND}" == "pocket" ]]; then version=$(bun scripts/lane.ts next-patch); else version=$(bun scripts/version.ts next); fi
          bun scripts/version.ts set "${version}"
          bun scripts/version.ts check
          # The herdr pack's marketplace index rides the release commit, regenerated from this tree.
          if [[ "${HERDR}" == "yes" ]]; then (cd herdr && node scripts/catalog.mjs); fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(release): v${version}"
          git tag -a "v${version}" -m "Automagik ${version%.0}"
          # Atomic: when dev moved meanwhile (a second merge), neither lands, so no tag names a
          # release commit dev never got (v3.5.0 did, on 2026-10-25). The newer merge's own run
          # (queued behind this one) then releases these changes with it, so this run stops
          # here, cleanly: no version, and the steps and jobs after it skip.
          if ! git push -q --atomic origin HEAD:refs/heads/dev "refs/tags/v${version}"; then
            git fetch -q origin dev
            if [[ "$(git rev-parse origin/dev)" != "$(git rev-parse HEAD~1)" ]]; then
              echo "::notice::dev moved on while this run cut v${version}; the run for the newer merge releases these changes too"
              exit 0
            fi
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Into release/ before the plugins' PLUGINS.SHA256SUMS, which then lists the pack too: a full
      # release's desktop build keeps every file that list names (desktop-build.yml).
      - name: Pack the herdr pack
        if: steps.cut.outputs.version != '' && steps.lane.outputs.herdr == 'yes'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          # From the tag, not the working tree, by the tag's own herdr/scripts/pack.mjs (the step am
          # runs on a checkout too, RFC 0012): the tag's PACK_MODS (every folder of herdr/mods/ but
          # pocket-link must be in it), layouts/automagik.json, and the layout part's part.json inside
          # the sidebar's folder; it checks the archive's top level is exactly PACK_MODS plus layouts.
          mkdir -p release
          tgz="automagik-herdr-pack-${VERSION}.tgz"
          git show "v${VERSION}:herdr/scripts/pack.mjs" > "${RUNNER_TEMP}/pack.mjs"
          node "${RUNNER_TEMP}/pack.mjs" --repo . --ref "v${VERSION}" --out "release/${tgz}"
          (cd release && sha256sum -- "${tgz}" > "${tgz}.sha256")
          cat "release/${tgz}.sha256"

      - name: Pack the plugins
        if: steps.cut.outputs.version != '' && steps.lane.outputs.kind != 'herdr' && steps.lane.outputs.kind != 'pocket'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          SHA: ${{ steps.cut.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          for app in acp-dsh bots-dsh locale-pt-br-dsh unfold-bot-dsh unfold-bridge-dsh unfold-capabilities-dsh unfold-events-dsh unfold-mind-dsh unfold-session-dsh unfold-settings-dsh unfold-sse-dsh unfold-trajectory-dsh welcome-dsh; do
            (cd "apps/${app}" && npm pack --silent --ignore-scripts --pack-destination ../../release >/dev/null)
          done
          bun scripts/release-plugins.ts release "${VERSION}" "${SHA}" > release/plugins.json
          cat release/plugins.json
          (cd release && sha256sum -- * > PLUGINS.SHA256SUMS)

      - name: Publish the release
        if: steps.cut.outputs.version != ''
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          SHA: ${{ steps.cut.outputs.sha }}
          KIND: ${{ steps.lane.outputs.kind }}
          HERDR: ${{ steps.lane.outputs.herdr }}
          POCKET: ${{ steps.lane.outputs.pocket }}
        run: |
          set -euo pipefail
          notes="\`@automagik/acp-dsh\`, \`@automagik/bots-dsh\`, \`@automagik/locale-pt-br-dsh\`, \`@automagik/welcome-dsh\` for DeepSeek Harness, and the Automagik desktop app. Install the plugins from the [Automagik market](https://github.com/automagik-dev/dsh-marketplace) or from an Omni's own market; \`plugins.json\` lists each tarball's integrity. The desktop builds follow when they are done."
          [[ "${KIND}" == "herdr" ]] && notes="The Automagik Herdr pack alone (no plugins, no desktop build)."
          [[ "${KIND}" == "pocket" ]] && notes="Automagik Pocket (no plugins, no desktop build)."
          [[ "${HERDR}" == "yes" ]] && notes="${notes} Automagik Herdr: \`automagik-herdr-pack-${VERSION}.tgz\` (its sha256 in \`.sha256\`); install with \`curl -fsSL https://raw.githubusercontent.com/automagik-dev/automagik/main/herdr/install.sh | bash\`, or run \`automagik-herdr update\`."
          [[ "${POCKET}" == "yes" ]] && notes="${notes} Automagik Pocket: \`automagik-pocket-${VERSION}.apk\` follows (the Pocket job) with \`latest.json\`; installed phones update on their own."
          # Flags add up: a dispatched prerelease stays a prerelease whatever its kind, and only a
          # full stable release is Latest. A plugin, herdr or pocket patch is not Latest: the desktop
          # app's builds stay on the full one.
          flags=()
          [[ "${PRERELEASE}" == "true" ]] && flags+=(--prerelease)
          if [[ "${PRERELEASE}" == "true" || "${KIND}" == "plugins" || "${KIND}" == "herdr" || "${KIND}" == "pocket" ]]; then
            flags+=(--latest=false)
          else
            flags+=(--latest)
          fi
          # A pocket patch with no herdr/ change packs nothing here (its APK follows in the Pocket
          # job): the release then starts with no file, never with a literal "release/*".
          shopt -s nullglob
          files=(release/*)
          gh release create "v${VERSION}" "${files[@]}" "${flags[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Automagik ${VERSION%.0}" \
            --notes "${notes}"

      - name: Sign and post the herdr lane
        if: steps.cut.outputs.version != '' && steps.lane.outputs.herdr == 'yes'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          SHA: ${{ steps.cut.outputs.sha }}
          HERDR_PACK_KEY: ${{ vars.HERDR_PACK_SIGNER == 'HERDR_PACK_KEY_NEXT' && secrets.HERDR_PACK_KEY_NEXT || secrets.HERDR_PACK_KEY }}
          HERDR_LANE_REPLACE_UNVERIFIED: ${{ inputs.replace_unverified_herdr_pointer }}
        run: |
          set -euo pipefail
          mkdir -p herdr-lane
          bun scripts/herdr-lane.ts manifest "release/automagik-herdr-pack-${VERSION}.tgz" "${VERSION}" "${SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > herdr-lane/pack.json
          bun scripts/herdr-lane.ts sign herdr-lane/pack.json > herdr-lane/pack.json.sig
          bun scripts/herdr-lane.ts verify herdr-lane/pack.json herdr-lane/pack.json.sig
          if ! gh release view herdr-lane --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create herdr-lane --repo "${GITHUB_REPOSITORY}" --target dev --prerelease --latest=false \
              --title "Automagik Herdr pack lane" \
              --notes "pack.json names the newest Automagik Herdr pack (its tarball stays on its own versioned release); pack.json.sig is its ed25519 signature, checked against herdr/mods/am-sidebar/pack-keys.json. See scripts/herdr-lane.ts."
          fi
          # Never back: a re-run of an older release's run must not re-post an older pointer over a
          # newer one. Only "nothing posted yet" lets it post blind; any other error reading the
          # posted pointer stops the run (re-run it), and a posted pointer that does not verify is
          # replaced only when the run was dispatched with replace_unverified_herdr_pointer.
          mkdir -p herdr-lane/posted
          if ! gh release download herdr-lane --repo "${GITHUB_REPOSITORY}" -p pack.json -p pack.json.sig -D herdr-lane/posted --clobber 2> herdr-lane/download.err; then
            if grep -qE '^(release not found|no assets match the file pattern|no assets to download)$' herdr-lane/download.err; then
              echo "herdr lane: nothing posted on herdr-lane yet"
            else
              cat herdr-lane/download.err >&2
              echo "::error::herdr lane: could not read the posted pointer; refusing to post blind (re-run the job)"
              exit 1
            fi
          fi
          bun scripts/herdr-lane.ts posted herdr-lane/pack.json herdr-lane/posted
          # --clobber replaces each asset in turn, so a reader may briefly see a pointer and a
          # signature that do not match, or neither: both fail closed (refused, or no update yet).
          gh release upload herdr-lane herdr-lane/pack.json.sig herdr-lane/pack.json --clobber --repo "${GITHUB_REPOSITORY}"

      # A herdr or pocket patch packs no plugins: the lane stays on the release that last did.
      - name: Sign and post the plugin lane
        if: steps.cut.outputs.version != '' && steps.lane.outputs.kind != 'herdr' && steps.lane.outputs.kind != 'pocket'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          KIND: ${{ steps.lane.outputs.kind }}
          BASE: ${{ steps.lane.outputs.base }}
          PLUGIN_LANE_KEY: ${{ secrets.PLUGIN_LANE_KEY }}
        run: |
          set -euo pipefail
          # A full release is its own base: apps of this 3.N take patches on it from now on.
          base="${BASE}"
          [[ "${KIND}" != "plugins" ]] && base="${VERSION}"
          mkdir -p lane
          bun scripts/lane.ts manifest release/plugins.json "${base}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" release/addons.json > lane/lane.json
          bun scripts/lane.ts sign lane/lane.json > lane/lane.json.sig
          bun scripts/lane.ts verify lane/lane.json lane/lane.json.sig
          # A welcome of this version installs nothing without this lane: a transient error gets
          # two more tries, 10 s and then 20 s later, before the cut fails.
          tries=0
          until gh release upload "v${VERSION}" lane/lane.json lane/lane.json.sig --repo "${GITHUB_REPOSITORY}"; do
            tries=$((tries + 1))
            if (( tries == 3 )); then
              echo "::error::lane/lane.json and lane/lane.json.sig did not reach v${VERSION} after 3 tries"
              exit 1
            fi
            sleep $((tries * 10))
          done
          if ! gh release view plugin-lane --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create plugin-lane --repo "${GITHUB_REPOSITORY}" --target dev --prerelease --latest=false \
              --title "Automagik plugin lane" \
              --notes "lane.json lists the newest Automagik plugins (their tarballs are on their own versioned releases); lane.json.sig is its ed25519 signature, checked against plugin-lane/keys.json. See scripts/lane.ts."
          fi
          gh release upload plugin-lane lane/lane.json lane/lane.json.sig --clobber --repo "${GITHUB_REPOSITORY}"

  pocket:
    name: Pocket
    needs: cut
    if: needs.cut.outputs.version != '' && needs.cut.outputs.pocket == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No concurrency group: every release that rebuilt Pocket gets its APK and latest.json, never
    # dropped for a newer run. Only the small pocket-lane job below takes turns. On vX.Y.Z this job
    # adds only its own two files, which desktop-build.yml keeps (its asset sweep spares them).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.cut.outputs.version }}
      SINCE: ${{ needs.cut.outputs.pocket_since }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.cut.outputs.version }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # The keystore is written to the runner's temp folder for this one build and removed after it.
      - name: Build the release APK
        working-directory: apps/pocket/android
        env:
          KEYSTORE: ${{ secrets.POCKET_SIGNING_KEYSTORE }}
          POCKET_SIGNING_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$POCKET_SIGNING_PASSWORD" ]; then
            echo "::error::No release key in this repository's secrets: a Pocket release must be signed with it."; exit 1
          fi
          export POCKET_SIGNING_STORE="$RUNNER_TEMP/pocket.jks"
          trap 'rm -f "$POCKET_SIGNING_STORE"' EXIT
          echo "$KEYSTORE" | base64 -d > "$POCKET_SIGNING_STORE"
          ./gradlew --stacktrace :app:assembleRelease

      - name: The APK and its latest.json
        run: |
          set -euo pipefail
          meta=apps/pocket/android/app/build/outputs/apk/release/output-metadata.json
          code=$(jq -r '.elements[0].versionCode' "$meta")
          name=$(jq -r '.elements[0].versionName' "$meta")
          want=$(bun scripts/version.ts code "${VERSION}")
          [ "$name" = "$VERSION" ] || { echo "::error::the APK says ${name}, the tag says ${VERSION}"; exit 1; }
          [ "$code" = "$want" ] || { echo "::error::the APK's versionCode is ${code}, ${VERSION} gives ${want}"; exit 1; }
          mkdir -p pocket
          apk="automagik-pocket-${VERSION}.apk"
          cp apps/pocket/android/app/build/outputs/apk/release/app-release.apk "pocket/${apk}"
          sha=$(sha256sum "pocket/${apk}" | cut -d' ' -f1)
          # What changed in the app: the subjects that touched apps/pocket/ since the build phones have.
          summary=$(git log --no-merges --format='%s' "${SINCE:+${SINCE}..}v${VERSION}" -- apps/pocket | grep -vE '^chore\(release\)' | head -5 | paste -sd ';' - | head -c 400 || true)
          jq -n --argjson code "$code" --arg name "$name" --arg sha "$sha" --arg notes "$summary" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${apk}" \
            '{versionCode: $code, versionName: $name, url: $url, sha256: $sha, notes: $notes}' > pocket/latest.json
          cat pocket/latest.json

      # The APK first, latest.json after it: a reader never finds a latest.json whose APK is missing.
      - name: Attach them to v${{ needs.cut.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" "pocket/automagik-pocket-${VERSION}.apk" --repo "${GITHUB_REPOSITORY}"
          gh release upload "v${VERSION}" pocket/latest.json --repo "${GITHUB_REPOSITORY}"

  pocket-lane:
    name: Pocket lane
    needs: [cut, pocket]
    # Installed phones read only this (docs/rfcs/0011-monorepo-parts-and-releases.md, "Pocket"). A
    # prerelease run never moves it, so it never enters the group. Its tag is not v*, so no updater or
    # tag lookup that keys on v3.N.P takes it, and it is created as a prerelease and never edited, so
    # it is never Latest. One at a time across runs: GitHub keeps at most one job waiting in the group
    # and drops an older waiting one for a newer, which is only ever a later release whose APK built,
    # so the lane still ends on the newest build. It never moves to a lower versionCode either.
    # herdr-lane (the cut job) and plugin-lane are other releases with other files.
    if: needs.cut.outputs.version != '' && needs.cut.outputs.pocket == 'yes' && inputs.prerelease != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pocket-lane
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.cut.outputs.version }}
    steps:
      - name: Post latest.json on pocket-lane
        run: |
          set -euo pipefail
          mkdir -p pocket
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" -p latest.json -D pocket
          if ! gh release view pocket-lane --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create pocket-lane --repo "${GITHUB_REPOSITORY}" --target dev --prerelease --latest=false \
              --title "Automagik Pocket lane" \
              --notes "latest.json names the newest Automagik Pocket build (its APK stays on its own versioned release, with its sha256 here); installed phones read only this file. See docs/rfcs/0011-monorepo-parts-and-releases.md."
          fi
          current=$(gh release download pocket-lane --repo "${GITHUB_REPOSITORY}" -p latest.json -O - 2>/dev/null | jq -r '.versionCode // 0' 2>/dev/null || echo 0)
          code=$(jq -r '.versionCode' pocket/latest.json)
          if (( code <= ${current:-0} )); then
            echo "pocket-lane already names versionCode ${current}, not below ${code}: left as it is"
            exit 0
          fi
          gh release upload pocket-lane pocket/latest.json --clobber --repo "${GITHUB_REPOSITORY}"

  desktop:
    name: Desktop
    needs: cut
    # A push carries no inputs, and a missing input compares equal to false. A plugin, herdr or pocket patch has no app.
    if: needs.cut.outputs.version != '' && needs.cut.outputs.lane != 'plugins' && needs.cut.outputs.lane != 'herdr' && needs.cut.outputs.lane != 'pocket' && (github.event_name == 'push' || inputs.desktop != false)
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      ref: ${{ needs.cut.outputs.sha }}
      prerelease: ${{ inputs.prerelease == true }}
      publish: true

  list:
    name: List it in the market index; main follows
    needs: cut
    if: needs.cut.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-list
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.cut.outputs.version }}
      SHA: ${{ needs.cut.outputs.sha }}
      LANE: ${{ needs.cut.outputs.lane }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # A herdr or pocket patch moved no plugin: the index stays on the release that last packed them.
      - name: Pin the index to the release
        if: env.LANE != 'herdr' && env.LANE != 'pocket'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/marketplace.ts pin "v${VERSION}"
          bun scripts/marketplace.ts check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- marketplace/automagik.json; then
            git commit -qm "chore(release): list v${VERSION} in the market index" -- marketplace/automagik.json
            # A cut that landed meanwhile moved dev: list on top of it.
            for attempt in 1 2 3; do
              git push -q origin HEAD:refs/heads/dev && break
              git pull -q --rebase origin dev
            done
          fi

      - name: main moves to the release
        run: |
          set -euo pipefail
          # Fast-forward only: main holds released commits and nothing else. A release listed after a
          # newer one (they run side by side now) leaves main where the newer one put it.
          git fetch -q origin main
          if git merge-base --is-ancestor origin/main "${SHA}"; then
            git push -q origin "${SHA}:refs/heads/main"
          else
            echo "main is already past ${SHA}"
          fi
