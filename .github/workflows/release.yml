name: Release

# Cuts an Automagik release from dev on every merge into it, as Tactu does: one version for the
# whole repository (3.N, semver 3.N.0, N one above the last release: scripts/version.ts),
# committed and tagged `v<version>` on dev, published as the GitHub release `v<version>` with
#
#   automagik-bots-dsh-<version>.tgz      the Bot team (npm pack of apps/bots-dsh)
#   automagik-welcome-dsh-<version>.tgz   the welcome and Connect AI (apps/welcome-dsh)
#   automagik-locale-pt-br-dsh-<version>.tgz   Brazilian Portuguese for DSH (apps/locale-pt-br-dsh)
#   automagik-acp-dsh-<version>.tgz       agents over ACP as DSH models (apps/acp-dsh)
#   plugins.json                          each tarball's name, version, file and integrity
#   <add-on>-<its version>.tgz            the add-ons the lane carries, at the profile's pins
#   addons.json                           (scripts/lane.ts LANE_ADDONS), and what each one is
#
#   automagik-herdr-pack-<version>.tgz    the herdr pack, when herdr/ shipped something since the
#   automagik-herdr-pack-<version>.tgz.sha256  last release: every PACK_MODS folder of the tag's
#                                         herdr/mods/ (never pocket-link) plus
#                                         herdr-layout/layouts/automagik.json as layouts/automagik.json,
#                                         and its sha256 (docs/rfcs/0011-monorepo-parts-and-releases.md)
#
#   automagik-am-<version>.tgz           am, the one command (am/, docs/rfcs/0012-am-cli-and-parts.md), on
#   automagik-am-<version>.tgz.sha256    every release whatever its kind: the tag's am/ but its tests
#
#   usagemeter-darwin-arm64              usagemeter, the token meter (meter/usagemeter/,
#   usagemeter-darwin-x86_64             docs/rfcs/0017-usagemeter-crate.md), when the crate shipped
#   usagemeter-linux-x86_64              something since the build machines have (meter-since): the
#   usagemeter-linux-aarch64             four binaries meter/usagemeter/part.json names, built on CI
#   usagemeter.SHA256SUMS                from the tag (the meter jobs), and their sha256s
#   meter.json, meter.json.sig           that build's signed pointer (scripts/meter-lane.ts)
#
#   automagik-pocket-<version>.apk       Pocket's phone app, when apps/pocket/ shipped something since
#   latest.json                           the last release: the APK signed with the release key
#                                         (POCKET_SIGNING_KEYSTORE / POCKET_SIGNING_PASSWORD) and what
#                                         the app reads to update (versionCode, versionName, url, sha256)
#
# and, when it packed the herdr pack, it signs pack.json (the newest pack: its release, tarball URL
# and sha256; ed25519, the HERDR_PACK_KEY secret, the pack's own key; the public keys are
# herdr/mods/am-sidebar/pack-keys.json) and puts it with pack.json.sig on the rolling `herdr-lane`
# release, which holds nothing else: herdr/install.sh and `automagik-herdr update` read only that.
#
# and, on every release, it signs am.json (the newest am: its release, tarball URL and sha256; ed25519,
# the AM_LANE_KEY secret, am's own key, the slot AM_LANE_SIGNER names; the public keys are
# am/am-keys.json) and puts it with am.json.sig on the rolling `am-lane` release, which holds nothing
# else: `am update` reads only that, posted by a job of its own (am-lane) so its refusals stop
# nothing else. While am-keys.json lists no key, or AM_LANE_KEY is not set, the release attaches
# am, posts no am-lane and says so in a warning; once keys are listed, a secret that is none of
# them stops the release before the tag (scripts/am-lane.ts check-key).
#
# and, when it built the meter, it signs meter.json (that build: its release and, per target, each
# binary's URL and sha256; ed25519, the METER_LANE_KEY secret, the meter's own key, the slot
# METER_LANE_SIGNER names; the public keys are meter/usagemeter/meter-keys.json) and attaches it and
# meter.json.sig to vX.Y.Z with the binaries, so no meter build is public unsigned; on a release that
# is not a prerelease it then puts them on the rolling `meter-lane` release, which holds nothing else,
# posted by a job of its own (meter-lane) so its refusals stop nothing else. The key comes first: the
# meter lane is held (no meter build, attach or post; the crate ships nothing) until meter-keys.json
# lists a key AND the query contract carries RFC 0021's widened attribution.precision
# (scripts/lane.ts meterHeld). Once open, a METER_LANE_KEY that is unset or none of the listed keys
# stops the release before the tag (scripts/meter-lane.ts check-key).
#
# and, when it built Pocket on a release that is not a prerelease, it replaces latest.json on the
# rolling `pocket-lane` release, which holds nothing else and is never Latest: installed phones read
# only that (apps/pocket/android/app/build.gradle.kts) and take the APK from its vX.Y.Z release.
#
# Every stable release carrying plugins.json also dispatches server-image.yml on its tag with
# content=v<version>. The workflow token's release event starts no workflow, but workflow_dispatch
# does. This is a separate job after the cut, with only actions: write; a failed dispatch warns
# and no other lane waits for it. The image workflow publishes the image and server-image.json.
#
# and then the desktop app's builds (desktop-build.yml). Omni pins a release's plugins.json
# (its apps/automagik.json) to serve them from its own market and admin UI; the
# dsh-marketplace lists the plugins at the tag's commit. After the release, the market index
# here lists it (scripts/marketplace.ts pin) and main moves to the tag.
#
# Only the jobs that write dev (the cut, the index listing) take turns; a release's desktop
# builds run on their own (desktop-build.yml locks per version), so a plugin patch merged during
# a full release's Mac build is out in minutes instead of after it.
#
# A push to dev (a merged pull request) cuts one; so does follow-omni.yml (workflow_call), and a
# dispatch: gh workflow run release.yml --ref dev [--field prerelease=true] [--field desktop=false]
# [--field replace_unverified_herdr_pointer=true] (only when the posted herdr-lane pointer no longer
# verifies, e.g. its key left pack-keys.json, and you have checked its sequence is not newer: the
# release otherwise refuses to post over it; scripts/herdr-lane.ts posted)
# [--field replace_unverified_am_pointer=true] (the same for the posted am-lane pointer;
# scripts/am-lane.ts posted) [--field replace_unverified_meter_pointer=true] (the same for the
# posted meter-lane pointer; scripts/meter-lane.ts posted).
# The workflow's own pushes (the version commit, the index listing, follow-omni's pin) start no
# run: GitHub starts none for a push made with the workflow token. A dev that has nothing since the
# last release but those commits cuts nothing. Cuts queue one at a time; a merge that lands while
# one is cutting is released by the next run, with every merge after it that lands before it starts.
#
# The plugin lane (scripts/lane.ts): when everything since the last full release (v3.N.0) is the
# plugins' alone (or moves only the pins of the add-ons the lane carries), the release is a patch,
# v3.N.P, with the plugin tarballs and no desktop build. When everything since the last release
# (any tag) is under herdr/, it is a herdr patch, v3.N.P with the pack alone: no plugin tarballs, no
# new lane, no desktop build, no market listing (the plugins did not move). When it is all under
# apps/pocket/ (or apps/pocket/ and the herdr part), it is a pocket patch the same way, with the APK.
# When it is all am's (am/), it is an am patch: am alone. When it is all the meter's (meter/usagemeter/,
# with or without am/), it is a meter patch: the meter's binaries (and am). am/ and the meter never
# make a release more than it is otherwise (scripts/lane.ts kind).
# Every release, full or patch, then signs lane.json (ed25519, the PLUGIN_LANE_KEY secret; the
# public keys are plugin-lane/keys.json) and puts it on the rolling `plugin-lane` release, which
# holds nothing else. The desktop app and Omni's market install the plugins from it, without a
# release of their own.
#
# Nothing is published to npm: the plugins ship as git sources and release files only.
# Pushes use the workflow's own token; CI already ran on the dev commit being released, and
# this job runs the gates again before it tags.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a prerelease (not shown as Latest)'
        required: false
        type: boolean
        default: false
      desktop:
        description: 'Build and add the desktop app'
        required: false
        type: boolean
        default: true
      replace_unverified_herdr_pointer:
        description: 'Post the herdr lane over a posted pointer that does not verify (RFC 0011)'
        required: false
        type: boolean
        default: false
      replace_unverified_am_pointer:
        description: 'Post the am lane over a posted pointer that does not verify (RFC 0012)'
        required: false
        type: boolean
        default: false
      replace_unverified_meter_pointer:
        description: 'Post the meter lane over a posted pointer that does not verify (RFC 0017)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      prerelease:
        description: 'Publish as a prerelease (not shown as Latest)'
        required: false
        type: boolean
        default: false
      desktop:
        description: 'Build and add the desktop app'
        required: false
        type: boolean
        default: true
      replace_unverified_herdr_pointer:
        description: 'Post the herdr lane over a posted pointer that does not verify (RFC 0011)'
        required: false
        type: boolean
        default: false
      replace_unverified_am_pointer:
        description: 'Post the am lane over a posted pointer that does not verify (RFC 0012)'
        required: false
        type: boolean
        default: false
      replace_unverified_meter_pointer:
        description: 'Post the meter lane over a posted pointer that does not verify (RFC 0017)'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  cut:
    name: Cut v<version> on dev
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-cut
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cut.outputs.version }}
      plugins: ${{ steps.publish.outputs.plugins }}
      sha: ${{ steps.cut.outputs.sha }}
      lane: ${{ steps.lane.outputs.kind }}
      herdr: ${{ steps.lane.outputs.herdr }}
      pocket: ${{ steps.lane.outputs.pocket }}
      pocket_since: ${{ steps.lane.outputs.pocket_since }}
      am_sign: ${{ steps.amkey.outputs.sign }}
      meter: ${{ steps.lane.outputs.meter }}
      meter_sign: ${{ steps.meterkey.outputs.sign }}
    env:
      DO_NOT_TRACK: '1'
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.9

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Anything new since the last release
        id: new
        run: |
          set -euo pipefail
          # The newest release, a full one or a plugin patch (calendar tags have six-digit minors).
          last=$(git tag --list 'v3.*' --sort=-v:refname | grep -E '^v3\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$' | head -1 || true)
          if [[ -z "${last}" ]]; then
            # The first release: everything since the beginning ships.
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # The path decision is authoritative, not the subjects: PR #759's test(pocket) squash
            # merge touched Pocket's shipped Kotlin source while its subject looked inert (#767).
            # Ask ships first; a failure stops the run instead of reading as "nothing reaches an
            # install".
            ships=$(bun scripts/lane.ts ships "${last}")
            if [[ "${ships}" == "yes" ]]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            elif [[ "${ships}" != "no" ]]; then
              echo "::error::scripts/lane.ts ships ${last} printed '${ships}', not yes or no"
              exit 1
            else
              # The subjects are only a fast path to the wording: all inert (the release's own
              # version commit and index listing, CI, docs, tests) with nothing shipping is "dev
              # has nothing"; any other subject reaches no install either when the diff ships
              # nothing (a plugin's dev tools, its lint script: not in its package's files).
              subjects=$(git log --no-merges --format=%s "${last}..HEAD" \
                | grep -vE '^(chore\(release\)|ci|docs|test)(\([^)]*\))?!?: ' || true)
              if [[ -n "${subjects}" ]]; then
                echo "nothing since ${last} reaches an install: no release"
              else
                echo "dev has nothing since ${last}: no release"
              fi
            fi
          fi

      - name: The gates the release stands on
        if: steps.new.outputs.release == 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run check
          for app in acp-dsh bots-dsh locale-pt-br-dsh welcome-dsh; do
            (cd "apps/${app}" && bun install --frozen-lockfile --ignore-scripts && { [ ! -f scripts/build-client.mjs ] || node scripts/build-client.mjs --check; })
          done

      - name: Which lane
        id: lane
        if: steps.new.outputs.release == 'true'
        run: |
          set -euo pipefail
          full=$(git tag --list 'v3.*.0' --sort=-v:refname | grep -E '^v3\.(0|[1-9][0-9]{0,3})\.0$' | head -1 || true)
          last=$(git tag --list 'v3.*' --sort=-v:refname | grep -E '^v3\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$' | head -1 || true)
          kind=$(bun scripts/lane.ts kind "${full}" "${last}")
          # The herdr pack is rebuilt when herdr/ shipped something since the last release, any kind.
          herdr=$(bun scripts/lane.ts herdr "${last}")
          # Pocket's app is rebuilt when apps/pocket/ shipped something since the build phones have: the
          # version pocket-lane names (a prerelease never moves it, so a Pocket change in one comes
          # again), or the last release when there is no lane yet (scripts/lane.ts pocket-since).
          lane_version=$(gh release download pocket-lane --repo "${GITHUB_REPOSITORY}" -p latest.json -O - 2>/dev/null | jq -r '.versionName // empty' 2>/dev/null || true)
          pocket_since=$(bun scripts/lane.ts pocket-since "${last}" "${lane_version}")
          pocket=$(bun scripts/lane.ts pocket "${pocket_since}")
          # The meter is built when meter/usagemeter/ shipped something since the build machines have:
          # the version meter-lane names, else the newest stable release (a prerelease never moves the
          # lane and is never the base: its meter is built again by the next stable release), or every
          # change when no release has carried the meter yet (scripts/lane.ts meter-since). It answers
          # no while the lane is held: no key listed, or RFC 0021's contract not in (meterHeld). The
          # prerelease list must be read: an error here stops the run rather than guess a base.
          meter_version=$(gh release download meter-lane --repo "${GITHUB_REPOSITORY}" -p meter.json -O - 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
          prerelease_tags=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName')
          mapfile -t prereleases <<< "${prerelease_tags}"
          meter_since=$(bun scripts/lane.ts meter-since "${last}" "${meter_version}" "${prereleases[@]}")
          meter=$(bun scripts/lane.ts meter "${meter_since}")
          { echo "kind=${kind}"; echo "herdr=${herdr}"; echo "pocket=${pocket}"; echo "pocket_since=${pocket_since}"; echo "meter=${meter}"; echo "base=${full#v}"; } >> "$GITHUB_OUTPUT"
          echo "since ${full:-the start}: ${kind} release; since ${last:-the start}, the herdr pack: ${herdr}; since ${pocket_since:-the start}, Pocket: ${pocket}; since ${meter_since:-the start}, the meter: ${meter}"

      # The old automagik-herdr CI gate, on the pack this release attaches (Node 22.7+, shellcheck).
      - name: The herdr pack's gates
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.herdr == 'yes'
        working-directory: herdr
        run: |
          set -euo pipefail
          node --test 'test/*.test.mjs'
          for f in mods/*/*.js mods/*/*.mjs mods/*/bin/*.mjs mods/*/pack/*.mjs scripts/*.mjs scripts/*/*.mjs; do
            node --check "$f"
          done
          sh -n install.sh
          shellcheck -s sh install.sh mods/am-sidebar/bin/run.sh mods/am-sidebar/bin/automagik-herdr
          node scripts/catalog.mjs --check
          node scripts/version.mjs check
          node scripts/entries.mjs --check
          node scripts/parts.mjs --check

      # The release gate for every mod the pack ships (#652, generalised): walk each PACK_MODS
      # entry's static import graph against gpui-shell 0.7.1 and fail a load-time import.meta.url.
      # The pack's tests above run it too; this step names the gate a pack release may not skip.
      - name: Every pack mod's import graph
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.herdr == 'yes'
        working-directory: herdr
        run: node --test test/mod-imports.test.mjs

      # The same mods through the app's own loader (#624, #652), headless: the pack this release
      # would attach is built from this commit and every PACK_MODS mod must load in the pinned
      # Linux herdr-app. A load failure stops the release and prints herdr-app's output for that
      # mod. The version and sha256 are pinned in .github/scripts/herdr-app-check.mjs, never latest.
      - name: herdr-app system libraries
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.herdr == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-x11-0 libxcb-xkb1

      - name: Every pack mod loads in herdr-app
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.herdr == 'yes'
        run: node .github/scripts/herdr-app-check.mjs --strict

      # Before the cut, so a release that packs the pack never goes out without a pointer the
      # installed packs trust: HERDR_PACK_KEY must be a key pack-keys.json lists (its keyId is the
      # entry with its public key). The HERDR_PACK_SIGNER variable picks the secret slot, so a
      # rotation's new key waits in HERDR_PACK_KEY_NEXT until it is switched on (RFC 0011).
      - name: The herdr pack's signing key
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.herdr == 'yes'
        env:
          HERDR_PACK_KEY: ${{ vars.HERDR_PACK_SIGNER == 'HERDR_PACK_KEY_NEXT' && secrets.HERDR_PACK_KEY_NEXT || secrets.HERDR_PACK_KEY }}
        run: bun scripts/herdr-lane.ts check-key

      # Every release carries am (RFC 0012): its tests, a syntax check, shellcheck on its launcher,
      # and its copies of the pack's CLI and briefing byte for byte the pack's.
      - name: The am part's gates
        if: steps.new.outputs.release == 'true'
        working-directory: am
        run: |
          set -euo pipefail
          node ../scripts/am-copies.mjs --check
          node --test 'test/*.test.mjs'
          for f in *.js *.mjs bin/*.mjs lib/*.mjs; do
            node --check "$f"
          done
          shellcheck -s sh bin/am bin/run.sh bin/automagik-herdr

      # Before the cut, on every release, since every release carries am: once am-keys.json lists
      # keys, AM_LANE_KEY (the slot AM_LANE_SIGNER names) must be one of them, or the run stops
      # before it tags. While none is listed, or the secret is not set, the release warns, attaches
      # am and posts no am-lane (sign=no): the key is the owner's to add (am-lane.ts keygen).
      - name: The am lane's signing key
        id: amkey
        if: steps.new.outputs.release == 'true'
        env:
          AM_LANE_KEY: ${{ vars.AM_LANE_SIGNER == 'AM_LANE_KEY_NEXT' && secrets.AM_LANE_KEY_NEXT || secrets.AM_LANE_KEY }}
        run: bun scripts/am-lane.ts check-key

      # Before the cut, so a release that builds the meter never goes out with a crate that fails its
      # gates (ci.yml's usagemeter job, again on the commit being released), on the toolchain ci.yml
      # pins. Its four release binaries are built after the cut, on CI, from the tag (the meter job).
      - name: The meter's gates
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.meter == 'yes'
        working-directory: meter/usagemeter
        env:
          RUST_TOOLCHAIN: 1.93.0
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # Before the cut, on a release that builds the meter (so meter-keys.json lists a key: the lane is
      # held until it does): METER_LANE_KEY (the slot METER_LANE_SIGNER names) must be set and be one
      # of the listed keys, or the run stops before it tags. No warn-only path: a meter build is never
      # attached unsigned (sign=yes or a failed run).
      - name: The meter lane's signing key
        id: meterkey
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.meter == 'yes'
        env:
          METER_LANE_KEY: ${{ vars.METER_LANE_SIGNER == 'METER_LANE_KEY_NEXT' && secrets.METER_LANE_KEY_NEXT || secrets.METER_LANE_KEY }}
        run: bun scripts/meter-lane.ts check-key

      # Before the cut, so a release that rebuilds Pocket never goes out with an app that fails its
      # tests or lint, nor without the key that signs it (names only: the values are never read here).
      - name: Pocket's signing key is in the secrets
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'
        env:
          HAS_KEYSTORE: ${{ secrets.POCKET_SIGNING_KEYSTORE != '' }}
          HAS_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD != '' }}
        run: |
          if [[ "${HAS_KEYSTORE}" != "true" || "${HAS_PASSWORD}" != "true" ]]; then
            echo "::error::POCKET_SIGNING_KEYSTORE and POCKET_SIGNING_PASSWORD must be in this repository's secrets: a Pocket release is signed with the release key"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'

      - name: Pocket's gates
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.pocket == 'yes'
        working-directory: apps/pocket/android
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug

      # Before the cut, so an add-on that cannot ride the lane stops the run before any tag.
      - name: Pack the add-ons the lane carries
        if: steps.new.outputs.release == 'true' && steps.lane.outputs.kind != 'herdr' && steps.lane.outputs.kind != 'pocket' && steps.lane.outputs.kind != 'am' && steps.lane.outputs.kind != 'meter'
        run: |
          set -euo pipefail
          bun scripts/lane.ts pack-addons release

      - name: Version, commit and tag
        id: cut
        if: steps.new.outputs.release == 'true'
        env:
          KIND: ${{ steps.lane.outputs.kind }}
          HERDR: ${{ steps.lane.outputs.herdr }}
          METER: ${{ steps.lane.outputs.meter }}
        run: |
          set -euo pipefail
          if [[ "${KIND}" == "plugins" || "${KIND}" == "herdr" || "${KIND}" == "pocket" || "${KIND}" == "am" || "${KIND}" == "meter" ]]; then version=$(bun scripts/lane.ts next-patch); else version=$(bun scripts/version.ts next); fi
          bun scripts/version.ts set "${version}"
          bun scripts/version.ts check
          # The crate's lock must still match its Cargo.toml, or the tag's --locked builds fail.
          if [[ "${METER}" == "yes" ]]; then cargo metadata --locked --format-version 1 --manifest-path meter/usagemeter/Cargo.toml > /dev/null; fi
          # The herdr pack's marketplace index rides the release commit, regenerated from this tree.
          if [[ "${HERDR}" == "yes" ]]; then (cd herdr && node scripts/catalog.mjs); fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(release): v${version}"
          git tag -a "v${version}" -m "Automagik ${version%.0}"
          # Atomic: when dev moved meanwhile (a second merge), neither lands, so no tag names a
          # release commit dev never got (v3.5.0 did, on 2026-10-25). The newer merge's own run
          # (queued behind this one) then releases these changes with it, so this run stops
          # here, cleanly: no version, and the steps and jobs after it skip.
          if ! git push -q --atomic origin HEAD:refs/heads/dev "refs/tags/v${version}"; then
            git fetch -q origin dev
            if [[ "$(git rev-parse origin/dev)" != "$(git rev-parse HEAD~1)" ]]; then
              echo "::notice::dev moved on while this run cut v${version}; the run for the newer merge releases these changes too"
              exit 0
            fi
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Every release, whatever its kind (RFC 0012). Into release/ before the plugins'
      # PLUGINS.SHA256SUMS, which then lists it too: a full release's desktop build keeps every file
      # that list names (desktop-build.yml). From the tag: am/ without its tests.
      - name: Pack am
        if: steps.cut.outputs.version != ''
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          tgz="automagik-am-${VERSION}.tgz"
          git archive --format=tar.gz -o "release/${tgz}" "v${VERSION}:am" -- . ':(exclude)test'
          [[ "$(tar -xzOf "release/${tgz}" VERSION)" == "${VERSION}" ]] || { echo "::error::am's VERSION in ${tgz} is not ${VERSION}"; exit 1; }
          if tar -tzf "release/${tgz}" | grep -q '^test/'; then echo "::error::${tgz} carries am's tests"; exit 1; fi
          (cd release && sha256sum -- "${tgz}" > "${tgz}.sha256")
          cat "release/${tgz}.sha256"

      # Into release/ before the plugins' PLUGINS.SHA256SUMS, which then lists the pack too: a full
      # release's desktop build keeps every file that list names (desktop-build.yml).
      - name: Pack the herdr pack
        if: steps.cut.outputs.version != '' && steps.lane.outputs.herdr == 'yes'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          # From the tag, not the working tree, by the tag's own herdr/scripts/pack.mjs (the step am
          # runs on a checkout too, RFC 0012): the tag's PACK_MODS (every folder of herdr/mods/ but
          # pocket-link must be in it), layouts/automagik.json, and the layout part's part.json inside
          # the sidebar's folder; it checks the archive's top level is exactly PACK_MODS plus layouts.
          mkdir -p release
          tgz="automagik-herdr-pack-${VERSION}.tgz"
          git show "v${VERSION}:herdr/scripts/pack.mjs" > "${RUNNER_TEMP}/pack.mjs"
          node "${RUNNER_TEMP}/pack.mjs" --repo . --ref "v${VERSION}" --out "release/${tgz}"
          (cd release && sha256sum -- "${tgz}" > "${tgz}.sha256")
          cat "release/${tgz}.sha256"

      - name: Pack the plugins
        if: steps.cut.outputs.version != '' && steps.lane.outputs.kind != 'herdr' && steps.lane.outputs.kind != 'pocket' && steps.lane.outputs.kind != 'am' && steps.lane.outputs.kind != 'meter'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          SHA: ${{ steps.cut.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          for app in acp-dsh bots-dsh locale-pt-br-dsh welcome-dsh; do
            (cd "apps/${app}" && npm pack --silent --ignore-scripts --pack-destination ../../release >/dev/null)
          done
          bun scripts/release-plugins.ts release "${VERSION}" "${SHA}" > release/plugins.json
          cat release/plugins.json
          (cd release && sha256sum -- * > PLUGINS.SHA256SUMS)

      - name: Publish the release
        id: publish
        if: steps.cut.outputs.version != ''
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          SHA: ${{ steps.cut.outputs.sha }}
          KIND: ${{ steps.lane.outputs.kind }}
          HERDR: ${{ steps.lane.outputs.herdr }}
          POCKET: ${{ steps.lane.outputs.pocket }}
          METER: ${{ steps.lane.outputs.meter }}
        run: |
          set -euo pipefail
          notes="\`@automagik/acp-dsh\`, \`@automagik/bots-dsh\`, \`@automagik/locale-pt-br-dsh\`, \`@automagik/welcome-dsh\` for DeepSeek Harness, and the Automagik desktop app. Install the plugins from the [Automagik market](https://github.com/automagik-si/dsh-marketplace) or from an Omni's own market; \`plugins.json\` lists each tarball's integrity. The desktop builds follow when they are done."
          [[ "${KIND}" == "herdr" ]] && notes="The Automagik Herdr pack alone (no plugins, no desktop build)."
          [[ "${KIND}" == "pocket" ]] && notes="Automagik Pocket (no plugins, no desktop build)."
          [[ "${KIND}" == "am" ]] && notes="am, the Automagik command, alone (no plugins, no desktop build)."
          [[ "${KIND}" == "meter" ]] && notes="usagemeter, the Automagik token meter, alone (no plugins, no desktop build)."
          [[ "${HERDR}" == "yes" ]] && notes="${notes} Automagik Herdr: \`automagik-herdr-pack-${VERSION}.tgz\` (its sha256 in \`.sha256\`); install with \`curl -fsSL https://raw.githubusercontent.com/automagik-si/automagik/main/herdr/install.sh | bash\`, or run \`automagik-herdr update\`."
          notes="${notes} am: \`automagik-am-${VERSION}.tgz\` (its sha256 in \`.sha256\`); \`am update\` takes it from the signed am-lane."
          [[ "${METER}" == "yes" ]] && notes="${notes} usagemeter: \`usagemeter-darwin-arm64\`, \`usagemeter-darwin-x86_64\`, \`usagemeter-linux-x86_64\` and \`usagemeter-linux-aarch64\` follow (the meter jobs) with \`usagemeter.SHA256SUMS\` and their signed pointer, \`meter.json\` and \`meter.json.sig\`."
          [[ "${POCKET}" == "yes" ]] && notes="${notes} Automagik Pocket: \`automagik-pocket-${VERSION}.apk\` follows (the Pocket job) with \`latest.json\`; installed phones update on their own."
          # Flags add up: a dispatched prerelease stays a prerelease whatever its kind, and only a
          # full stable release is Latest. A plugin, herdr, pocket, am or meter patch is not Latest: the
          # desktop app's builds stay on the full one.
          flags=()
          [[ "${PRERELEASE}" == "true" ]] && flags+=(--prerelease)
          if [[ "${PRERELEASE}" == "true" || "${KIND}" == "plugins" || "${KIND}" == "herdr" || "${KIND}" == "pocket" || "${KIND}" == "am" || "${KIND}" == "meter" ]]; then
            flags+=(--latest=false)
          else
            flags+=(--latest)
          fi
          # A pocket patch with no herdr/ change packs nothing here (its APK follows in the Pocket
          # job): the release then starts with no file, never with a literal "release/*".
          shopt -s nullglob
          files=(release/*)
          gh release create "v${VERSION}" "${files[@]}" "${flags[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Automagik ${VERSION%.0}" \
            --notes "${notes}"
          if [[ -f release/plugins.json ]]; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and post the herdr lane
        if: steps.cut.outputs.version != '' && steps.lane.outputs.herdr == 'yes'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          SHA: ${{ steps.cut.outputs.sha }}
          HERDR_PACK_KEY: ${{ vars.HERDR_PACK_SIGNER == 'HERDR_PACK_KEY_NEXT' && secrets.HERDR_PACK_KEY_NEXT || secrets.HERDR_PACK_KEY }}
          HERDR_LANE_REPLACE_UNVERIFIED: ${{ inputs.replace_unverified_herdr_pointer }}
        run: |
          set -euo pipefail
          mkdir -p herdr-lane
          bun scripts/herdr-lane.ts manifest "release/automagik-herdr-pack-${VERSION}.tgz" "${VERSION}" "${SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > herdr-lane/pack.json
          bun scripts/herdr-lane.ts sign herdr-lane/pack.json > herdr-lane/pack.json.sig
          bun scripts/herdr-lane.ts verify herdr-lane/pack.json herdr-lane/pack.json.sig
          if ! gh release view herdr-lane --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create herdr-lane --repo "${GITHUB_REPOSITORY}" --target dev --prerelease --latest=false \
              --title "Automagik Herdr pack lane" \
              --notes "pack.json names the newest Automagik Herdr pack (its tarball stays on its own versioned release); pack.json.sig is its ed25519 signature, checked against herdr/mods/am-sidebar/pack-keys.json. See scripts/herdr-lane.ts."
          fi
          # Never back: a re-run of an older release's run must not re-post an older pointer over a
          # newer one. Only "nothing posted yet" lets it post blind; any other error reading the
          # posted pointer stops the run (re-run it), and a posted pointer that does not verify is
          # replaced only when the run was dispatched with replace_unverified_herdr_pointer.
          mkdir -p herdr-lane/posted
          if ! gh release download herdr-lane --repo "${GITHUB_REPOSITORY}" -p pack.json -p pack.json.sig -D herdr-lane/posted --clobber 2> herdr-lane/download.err; then
            if grep -qE '^(release not found|no assets match the file pattern|no assets to download)$' herdr-lane/download.err; then
              echo "herdr lane: nothing posted on herdr-lane yet"
            else
              cat herdr-lane/download.err >&2
              echo "::error::herdr lane: could not read the posted pointer; refusing to post blind (re-run the job)"
              exit 1
            fi
          fi
          bun scripts/herdr-lane.ts posted herdr-lane/pack.json herdr-lane/posted
          # --clobber replaces each asset in turn, so a reader may briefly see a pointer and a
          # signature that do not match, or neither: both fail closed (refused, or no update yet).
          gh release upload herdr-lane herdr-lane/pack.json.sig herdr-lane/pack.json --clobber --repo "${GITHUB_REPOSITORY}"

      # A herdr, pocket, am or meter patch packs no plugins: the lane stays on the release that last did.
      - name: Sign and post the plugin lane
        if: steps.cut.outputs.version != '' && steps.lane.outputs.kind != 'herdr' && steps.lane.outputs.kind != 'pocket' && steps.lane.outputs.kind != 'am' && steps.lane.outputs.kind != 'meter'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          KIND: ${{ steps.lane.outputs.kind }}
          BASE: ${{ steps.lane.outputs.base }}
          PLUGIN_LANE_KEY: ${{ secrets.PLUGIN_LANE_KEY }}
        run: |
          set -euo pipefail
          # A full release is its own base: apps of this 3.N take patches on it from now on.
          base="${BASE}"
          [[ "${KIND}" != "plugins" ]] && base="${VERSION}"
          mkdir -p lane
          bun scripts/lane.ts manifest release/plugins.json "${base}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" release/addons.json > lane/lane.json
          bun scripts/lane.ts sign lane/lane.json > lane/lane.json.sig
          bun scripts/lane.ts verify lane/lane.json lane/lane.json.sig
          # A welcome of this version installs nothing without this lane: a transient error gets
          # two more tries, 10 s and then 20 s later, before the cut fails.
          tries=0
          until gh release upload "v${VERSION}" lane/lane.json lane/lane.json.sig --repo "${GITHUB_REPOSITORY}"; do
            tries=$((tries + 1))
            if (( tries == 3 )); then
              echo "::error::lane/lane.json and lane/lane.json.sig did not reach v${VERSION} after 3 tries"
              exit 1
            fi
            sleep $((tries * 10))
          done
          if ! gh release view plugin-lane --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create plugin-lane --repo "${GITHUB_REPOSITORY}" --target dev --prerelease --latest=false \
              --title "Automagik plugin lane" \
              --notes "lane.json lists the newest Automagik plugins (their tarballs are on their own versioned releases); lane.json.sig is its ed25519 signature, checked against plugin-lane/keys.json. See scripts/lane.ts."
          fi
          gh release upload plugin-lane lane/lane.json lane/lane.json.sig --clobber --repo "${GITHUB_REPOSITORY}"

  server-image:
    name: Dispatch the release's server image
    needs: cut
    if: needs.cut.outputs.version != '' && needs.cut.outputs.plugins == 'true' && inputs.prerelease != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.cut.outputs.version }}
    steps:
      - name: Dispatch server-image.yml on the release tag
        run: |
          set -euo pipefail
          if ! gh workflow run server-image.yml --repo "${GITHUB_REPOSITORY}" \
            --ref "v${VERSION}" -f "content=v${VERSION}"; then
            echo "::warning::Could not dispatch server-image.yml for v${VERSION}; retry with content=v${VERSION}"
          fi

  pocket:
    name: Pocket
    needs: cut
    if: needs.cut.outputs.version != '' && needs.cut.outputs.pocket == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No concurrency group: every release that rebuilt Pocket gets its APK and latest.json, never
    # dropped for a newer run. Only the small pocket-lane job below takes turns. On vX.Y.Z this job
    # adds only its own two files, which desktop-build.yml keeps (its asset sweep spares them).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.cut.outputs.version }}
      SINCE: ${{ needs.cut.outputs.pocket_since }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.cut.outputs.version }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # The keystore is written to the runner's temp folder for this one build and removed after it.
      - name: Build the release APK
        working-directory: apps/pocket/android
        env:
          KEYSTORE: ${{ secrets.POCKET_SIGNING_KEYSTORE }}
          POCKET_SIGNING_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$POCKET_SIGNING_PASSWORD" ]; then
            echo "::error::No release key in this repository's secrets: a Pocket release must be signed with it."; exit 1
          fi
          export POCKET_SIGNING_STORE="$RUNNER_TEMP/pocket.jks"
          trap 'rm -f "$POCKET_SIGNING_STORE"' EXIT
          echo "$KEYSTORE" | base64 -d > "$POCKET_SIGNING_STORE"
          ./gradlew --stacktrace :app:assembleRelease

      - name: The APK and its latest.json
        run: |
          set -euo pipefail
          meta=apps/pocket/android/app/build/outputs/apk/release/output-metadata.json
          code=$(jq -r '.elements[0].versionCode' "$meta")
          name=$(jq -r '.elements[0].versionName' "$meta")
          want=$(bun scripts/version.ts code "${VERSION}")
          [ "$name" = "$VERSION" ] || { echo "::error::the APK says ${name}, the tag says ${VERSION}"; exit 1; }
          [ "$code" = "$want" ] || { echo "::error::the APK's versionCode is ${code}, ${VERSION} gives ${want}"; exit 1; }
          mkdir -p pocket
          apk="automagik-pocket-${VERSION}.apk"
          cp apps/pocket/android/app/build/outputs/apk/release/app-release.apk "pocket/${apk}"
          sha=$(sha256sum "pocket/${apk}" | cut -d' ' -f1)
          # What changed in the app: the subjects that touched apps/pocket/ since the build phones have.
          summary=$(git log --no-merges --format='%s' "${SINCE:+${SINCE}..}v${VERSION}" -- apps/pocket | grep -vE '^chore\(release\)' | head -5 | paste -sd ';' - | head -c 400 || true)
          jq -n --argjson code "$code" --arg name "$name" --arg sha "$sha" --arg notes "$summary" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${apk}" \
            '{versionCode: $code, versionName: $name, url: $url, sha256: $sha, notes: $notes}' > pocket/latest.json
          cat pocket/latest.json

      # The APK first, latest.json after it: a reader never finds a latest.json whose APK is missing.
      - name: Attach them to v${{ needs.cut.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" "pocket/automagik-pocket-${VERSION}.apk" --repo "${GITHUB_REPOSITORY}"
          gh release upload "v${VERSION}" pocket/latest.json --repo "${GITHUB_REPOSITORY}"

  pocket-lane:
    name: Pocket lane
    needs: [cut, pocket]
    # Installed phones read only this (docs/rfcs/0011-monorepo-parts-and-releases.md, "Pocket"). A
    # prerelease run never moves it, so it never enters the group. Its tag is not v*, so no updater or
    # tag lookup that keys on v3.N.P takes it, and it is created as a prerelease and never edited, so
    # it is never Latest. One at a time across runs: GitHub keeps at most one job waiting in the group
    # and drops an older waiting one for a newer, which is only ever a later release whose APK built,
    # so the lane still ends on the newest build. It never moves to a lower versionCode either.
    # herdr-lane (the cut job) and plugin-lane are other releases with other files.
    if: needs.cut.outputs.version != '' && needs.cut.outputs.pocket == 'yes' && inputs.prerelease != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pocket-lane
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.cut.outputs.version }}
    steps:
      - name: Post latest.json on pocket-lane
        run: |
          set -euo pipefail
          mkdir -p pocket
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" -p latest.json -D pocket
          if ! gh release view pocket-lane --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create pocket-lane --repo "${GITHUB_REPOSITORY}" --target dev --prerelease --latest=false \
              --title "Automagik Pocket lane" \
              --notes "latest.json names the newest Automagik Pocket build (its APK stays on its own versioned release, with its sha256 here); installed phones read only this file. See docs/rfcs/0011-monorepo-parts-and-releases.md."
          fi
          current=$(gh release download pocket-lane --repo "${GITHUB_REPOSITORY}" -p latest.json -O - 2>/dev/null | jq -r '.versionCode // 0' 2>/dev/null || echo 0)
          code=$(jq -r '.versionCode' pocket/latest.json)
          if (( code <= ${current:-0} )); then
            echo "pocket-lane already names versionCode ${current}, not below ${code}: left as it is"
            exit 0
          fi
          gh release upload pocket-lane pocket/latest.json --clobber --repo "${GITHUB_REPOSITORY}"

  am-lane:
    # Every release that has am's key (check-key said sign=yes), in a job of its own: a refusal here
    # (an unreadable or unverifiable posted pointer, a lower sequence: it fails closed, as the herdr
    # lane) fails this job alone, so the plugin lane, the app, Pocket and the listing still go out.
    # It signs the tarball the release published, checked against its .sha256 first. A posted
    # pointer that does not verify is replaced only when the run was dispatched with
    # replace_unverified_am_pointer.
    name: Post the signed am lane
    needs: cut
    if: needs.cut.outputs.version != '' && needs.cut.outputs.am_sign == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: am-lane
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DO_NOT_TRACK: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.cut.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Sign and post the am lane
        env:
          VERSION: ${{ needs.cut.outputs.version }}
          SHA: ${{ needs.cut.outputs.sha }}
          AM_LANE_KEY: ${{ vars.AM_LANE_SIGNER == 'AM_LANE_KEY_NEXT' && secrets.AM_LANE_KEY_NEXT || secrets.AM_LANE_KEY }}
          AM_LANE_REPLACE_UNVERIFIED: ${{ inputs.replace_unverified_am_pointer }}
        run: |
          set -euo pipefail
          mkdir -p release am-lane
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" -p "automagik-am-${VERSION}.tgz" -p "automagik-am-${VERSION}.tgz.sha256" -D release
          (cd release && sha256sum -c "automagik-am-${VERSION}.tgz.sha256")
          bun scripts/am-lane.ts manifest "release/automagik-am-${VERSION}.tgz" "${VERSION}" "${SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > am-lane/am.json
          bun scripts/am-lane.ts sign am-lane/am.json > am-lane/am.json.sig
          bun scripts/am-lane.ts verify am-lane/am.json am-lane/am.json.sig
          if ! gh release view am-lane --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create am-lane --repo "${GITHUB_REPOSITORY}" --target dev --prerelease --latest=false \
              --title "Automagik am lane" \
              --notes "am.json names the newest am, the Automagik command (its tarball stays on its own versioned release); am.json.sig is its ed25519 signature, checked against am/am-keys.json. See scripts/am-lane.ts."
          fi
          mkdir -p am-lane/posted
          # gh, tried again after a GitHub server error (HTTP 5xx, #768): three times in all, 10 s
          # then 20 s apart. Its last stderr stays in the file $1 names; any other error ends it.
          gh_retry() {
            local err=$1 attempt=1
            shift
            until gh "$@" 2> "${err}"; do
              if (( attempt >= 3 )) || ! grep -qE 'HTTP 5[0-9][0-9]' "${err}"; then return 1; fi
              cat "${err}" >&2
              echo "am lane: a GitHub server error (attempt ${attempt} of 3); trying again"
              sleep $(( attempt * 10 ))
              attempt=$(( attempt + 1 ))
            done
          }
          if ! gh_retry am-lane/download.err release download am-lane --repo "${GITHUB_REPOSITORY}" -p am.json -p am.json.sig -D am-lane/posted --clobber; then
            if grep -qE '^(release not found|no assets match the file pattern|no assets to download)$' am-lane/download.err; then
              echo "am lane: nothing posted on am-lane yet"
            else
              cat am-lane/download.err >&2
              asset="$(grep -oE 'releases/assets/[0-9]+' am-lane/download.err | head -n 1 || true)"
              echo "::error::am lane: could not read the posted pointer (the am-lane release of ${GITHUB_REPOSITORY}${asset:+, asset ${asset##*/}}); refusing to post blind. Nothing was changed: re-run the job"
              exit 1
            fi
          fi
          bun scripts/am-lane.ts posted am-lane/am.json am-lane/posted
          # One file at a time, am.json first: --clobber deletes an asset and then uploads it, so a
          # reader that sees a pointer and a signature that do not match, or one of them missing,
          # refuses it (no update yet). An upload that still fails can leave the pointer half-written.
          # After am.json went up, a re-run finishes it; with only am.json.sig left, a re-run stops
          # and names the command that removes the orphan (am-lane.ts posted).
          for file in am.json am.json.sig; do
            if ! gh_retry am-lane/upload.err release upload am-lane "am-lane/${file}" --clobber --repo "${GITHUB_REPOSITORY}"; then
              cat am-lane/upload.err >&2
              echo "::error::am lane: could not upload ${file} to the am-lane release of ${GITHUB_REPOSITORY}; the posted pointer may be half-written. Re-run the job: it finishes the post, or names the repair"
              exit 1
            fi
          done

  meter:
    # usagemeter's four binaries (RFC 0017, "Release and trust"), the targets
    # meter/usagemeter/part.json's `artifact` names, Intel Mac included for good. Built on CI from the
    # tag, one runner per target, never on a build host: macOS arm64 builds both Macs, and the Linux
    # builds are static (musl) and checked to be static. No cache: a release binary is built clean.
    # No concurrency group: every release that builds the meter gets its binaries.
    name: usagemeter ${{ matrix.asset }}
    needs: cut
    if: needs.cut.outputs.version != '' && needs.cut.outputs.meter == 'yes' && needs.cut.outputs.meter_sign == 'yes'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: usagemeter-darwin-arm64, run: true }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: usagemeter-darwin-x86_64, run: false }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: usagemeter-linux-x86_64, run: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: usagemeter-linux-aarch64, run: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUST_TOOLCHAIN: 1.93.0
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      VERSION: ${{ needs.cut.outputs.version }}
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      RUNS: ${{ matrix.run }}
    defaults:
      run:
        working-directory: meter/usagemeter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.cut.outputs.version }}
          persist-credentials: false

      - name: Toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target "${TARGET}"
          rustup default "${RUST_TOOLCHAIN}"
          cargo --version

      - name: musl
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build
        run: cargo build --release --locked --target "${TARGET}"

      # Static on Linux, and the binary the tag says: `usagemeter <version>` where the runner can run it.
      - name: Check
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/usagemeter"
          file "${bin}"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            file "${bin}" | grep -Eq 'statically linked|static-pie linked' || { echo "::error::${ASSET} is not static"; exit 1; }
          fi
          if [[ "${RUNS}" == "true" ]]; then
            said=$("${bin}" --version)
            [[ "${said}" == "usagemeter ${VERSION}" ]] || { echo "::error::${ASSET} says ${said}, the tag says ${VERSION}"; exit 1; }
          fi
          mkdir -p "${RUNNER_TEMP}/out"
          cp "${bin}" "${RUNNER_TEMP}/out/${ASSET}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  meter-attach:
    # The four binaries, usagemeter.SHA256SUMS (named so, since a full release's desktop build writes
    # its own SHA256SUMS there) and the build's signed pointer (meter.json, meter.json.sig) onto
    # vX.Y.Z; desktop-build.yml's sweep spares them. Exactly the assets part.json names, signed with
    # the meter's key before anything goes up, or nothing: no meter build is ever public unsigned, a
    # prerelease's included. --clobber, so a re-run after a partial upload completes it.
    name: Attach usagemeter to v${{ needs.cut.outputs.version }}
    needs: [cut, meter]
    if: needs.cut.outputs.version != '' && needs.cut.outputs.meter == 'yes' && needs.cut.outputs.meter_sign == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DO_NOT_TRACK: '1'
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.cut.outputs.version }}
      SHA: ${{ needs.cut.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.cut.outputs.version }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: usagemeter-*
          merge-multiple: true
          path: meter-assets

      - name: Attach the binaries, usagemeter.SHA256SUMS and the signed pointer
        env:
          METER_LANE_KEY: ${{ vars.METER_LANE_SIGNER == 'METER_LANE_KEY_NEXT' && secrets.METER_LANE_KEY_NEXT || secrets.METER_LANE_KEY }}
        run: |
          set -euo pipefail
          # The tag's own key list: the lane is held while it lists none, so this never attaches unsigned.
          (( $(jq '[.keys[]?] | length' meter/usagemeter/meter-keys.json) > 0 )) || { echo "::error::meter/usagemeter/meter-keys.json lists no key: the meter lane is held, nothing is attached"; exit 1; }
          mapfile -t assets < <(jq -r '.artifact[]' meter/usagemeter/part.json)
          (( ${#assets[@]} == 4 )) || { echo "::error::meter/usagemeter/part.json names ${#assets[@]} assets, not 4"; exit 1; }
          found=$(cd meter-assets && ls -1 | sort | paste -sd ' ' -)
          want=$(printf '%s\n' "${assets[@]}" | sort | paste -sd ' ' -)
          [[ "${found}" == "${want}" ]] || { echo "::error::the meter jobs built ${found:-nothing}, not ${want}"; exit 1; }
          (cd meter-assets && sha256sum -- "${assets[@]}" > usagemeter.SHA256SUMS)
          cat meter-assets/usagemeter.SHA256SUMS
          bun scripts/meter-lane.ts manifest meter-assets "${VERSION}" "${SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > meter-assets/meter.json
          bun scripts/meter-lane.ts sign meter-assets/meter.json > meter-assets/meter.json.sig
          bun scripts/meter-lane.ts verify meter-assets/meter.json meter-assets/meter.json.sig
          gh release upload "v${VERSION}" "${assets[@]/#/meter-assets/}" meter-assets/usagemeter.SHA256SUMS meter-assets/meter.json.sig meter-assets/meter.json --clobber --repo "${GITHUB_REPOSITORY}"

  meter-lane:
    # The signed pointer meter-attach put on vX.Y.Z, posted on the rolling meter-lane release by a job
    # of its own that holds no key: a refusal here (an unreadable or unverifiable posted pointer, a
    # lower sequence: it fails closed, as the am lane) fails this job alone, so the plugin lane, the
    # app, Pocket, am-lane and the listing still go out. A prerelease never moves it, and is never
    # meter-since's base, so its meter is built again by the next stable release. It posts the
    # pointer only after checking it against meter-keys.json and the binaries the release holds. A
    # posted pointer that does not verify is replaced only when the run was dispatched with
    # replace_unverified_meter_pointer.
    name: Post the signed meter lane
    needs: [cut, meter-attach]
    if: needs.cut.outputs.version != '' && needs.cut.outputs.meter == 'yes' && needs.cut.outputs.meter_sign == 'yes' && inputs.prerelease != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: meter-lane
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DO_NOT_TRACK: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.cut.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Post the meter lane
        env:
          VERSION: ${{ needs.cut.outputs.version }}
          METER_LANE_REPLACE_UNVERIFIED: ${{ inputs.replace_unverified_meter_pointer }}
        run: |
          set -euo pipefail
          mkdir -p release meter-lane
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" -p 'usagemeter-*' -p usagemeter.SHA256SUMS -p meter.json -p meter.json.sig -D release
          (cd release && sha256sum -c usagemeter.SHA256SUMS)
          bun scripts/meter-lane.ts verify release/meter.json release/meter.json.sig
          bun scripts/meter-lane.ts matches release/meter.json release
          cp release/meter.json release/meter.json.sig meter-lane/
          if ! gh release view meter-lane --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create meter-lane --repo "${GITHUB_REPOSITORY}" --target dev --prerelease --latest=false \
              --title "Automagik meter lane" \
              --notes "meter.json names the newest usagemeter build (its binaries stay on their own versioned release); meter.json.sig is its ed25519 signature, checked against meter/usagemeter/meter-keys.json. See scripts/meter-lane.ts."
          fi
          mkdir -p meter-lane/posted
          if ! gh release download meter-lane --repo "${GITHUB_REPOSITORY}" -p meter.json -p meter.json.sig -D meter-lane/posted --clobber 2> meter-lane/download.err; then
            if grep -qE '^(release not found|no assets match the file pattern|no assets to download)$' meter-lane/download.err; then
              echo "meter lane: nothing posted on meter-lane yet"
            else
              cat meter-lane/download.err >&2
              echo "::error::meter lane: could not read the posted pointer; refusing to post blind (re-run the job)"
              exit 1
            fi
          fi
          bun scripts/meter-lane.ts posted meter-lane/meter.json meter-lane/posted
          # --clobber replaces each asset in turn: a reader that sees a pointer and a signature that
          # do not match, or neither, refuses it (no update yet).
          gh release upload meter-lane meter-lane/meter.json.sig meter-lane/meter.json --clobber --repo "${GITHUB_REPOSITORY}"

  desktop:
    name: Desktop
    needs: cut
    # A push carries no inputs, and a missing input compares equal to false. A plugin, herdr, pocket, am or meter patch has no app.
    if: needs.cut.outputs.version != '' && needs.cut.outputs.lane != 'plugins' && needs.cut.outputs.lane != 'herdr' && needs.cut.outputs.lane != 'pocket' && needs.cut.outputs.lane != 'am' && needs.cut.outputs.lane != 'meter' && (github.event_name == 'push' || inputs.desktop != false)
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      ref: ${{ needs.cut.outputs.sha }}
      prerelease: ${{ inputs.prerelease == true }}
      publish: true

  list:
    name: List it in the market index; main follows
    needs: cut
    if: needs.cut.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-list
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.cut.outputs.version }}
      SHA: ${{ needs.cut.outputs.sha }}
      LANE: ${{ needs.cut.outputs.lane }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # A herdr, pocket, am or meter patch moved no plugin: the index stays on the release that last packed them.
      - name: Pin the index to the release
        if: env.LANE != 'herdr' && env.LANE != 'pocket' && env.LANE != 'am' && env.LANE != 'meter'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/marketplace.ts pin "v${VERSION}"
          bun scripts/marketplace.ts check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- marketplace/automagik.json; then
            git commit -qm "chore(release): list v${VERSION} in the market index" -- marketplace/automagik.json
            # A cut that landed meanwhile moved dev: list on top of it.
            for attempt in 1 2 3; do
              git push -q origin HEAD:refs/heads/dev && break
              git pull -q --rebase origin dev
            done
          fi

      - name: main moves to the release
        run: |
          set -euo pipefail
          # Fast-forward only: main holds released commits and nothing else. A release listed after a
          # newer one (they run side by side now) leaves main where the newer one put it.
          git fetch -q origin main
          if git merge-base --is-ancestor origin/main "${SHA}"; then
            git push -q origin "${SHA}:refs/heads/main"
          else
            echo "main is already past ${SHA}"
          fi
