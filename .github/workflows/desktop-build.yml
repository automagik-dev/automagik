name: Desktop build

# Builds the Automagik desktop app (apps/desktop) at one commit of this repository and adds it
# to the release `v<version>`, where `omni desktop` (Omni's CLI) and `genie desktop` find it:
# the Linux AppImage and deb, the macOS arm64 dmg, and SHA256SUMS, which the CLIs check every
# download against. Installed apps update from the same release (apps/desktop/src/update.js):
# latest-linux.yml for the AppImage and latest-mac.yml with the zip for macOS.
#
# The version is Automagik's (package.json), which the app and every plugin here carry; the
# release already holds the plugins (release.yml makes it and calls this). Dispatch it by hand
# to rebuild a release's desktop files: gh workflow run desktop-build.yml --field ref=v<version>.
#
# macOS signing and notarization are optional: with the MAC_CSC_LINK and
# MAC_CSC_KEY_PASSWORD secrets (the Developer ID Application certificate as a base64 .p12)
# the app and the dmg are signed, and with APPLE_API_KEY (the App Store Connect .p8
# contents), APPLE_API_KEY_ID and APPLE_API_ISSUER the app is notarized without stapling by
# afterSign, then stapled by the retry script before the zip/dmg targets, and the dmg is
# notarized and stapled here. The zip's app is validated before the dmg is notarized.
# Without them the dmg is unsigned, and the release carries no macOS update: a signed app
# accepts only an update signed like itself, and an unsigned one cannot update.
#
# The native Windows app is off (2026-11-04): it did not work well enough to ship, and Windows
# is to come back as a Linux-sandboxed build. Its build and its files (the x86_64 installer, its
# blockmap, latest.yml, Automagik-Windows.exe) stay behind the `windows` input, false unless a
# dispatch sets it; release.yml never does. A release without latest.yml offers installed
# Windows apps no update (update.js skips it). The app's Windows code from #269 stays.
#
# With `windows` on, Windows is unsigned for now (D36): the installer and its update feed ship
# without a signature, and SmartScreen warns on the first download. The WIN_CSC_LINK and
# WIN_CSC_KEY_PASSWORD secrets (a code-signing certificate as a base64 .pfx) sign it once they
# exist; apps/desktop/electron-builder.yml `win` has the Azure Trusted Signing alternative.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit to build'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease (not shown as Latest)'
        required: false
        type: boolean
        default: false
      # Declared here too: an input a caller cannot see reads as '', which equals false.
      publish:
        description: 'Publish the release'
        required: false
        type: boolean
        default: true
      windows:
        description: 'Also build and publish the native Windows app (off since 2026-11-04)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch to build (default: main)'
        required: false
        type: string
      prerelease:
        description: 'Publish as a prerelease (not shown as Latest)'
        required: false
        type: boolean
        default: false
      publish:
        description: 'Publish the release (off: build, sign and notarize only, keeping the builds as run artifacts)'
        required: false
        type: boolean
        default: true
      windows:
        description: 'Also build and publish the native Windows app (off since 2026-11-04)'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      sha: ${{ steps.read.outputs.sha }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - name: The app carries Automagik's version
        id: read
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          actual=$(node -p "require('./apps/desktop/package.json').version")
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${actual}" == "${version}" ]] || { echo "::error ::apps/desktop is ${actual}, the repository ${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Mac and Linux always; the Windows leg only with the `windows` input on.
      - name: The builds to run
        id: targets
        env:
          WINDOWS: ${{ inputs.windows }}
        run: |
          set -euo pipefail
          include='{"target":"linux","os":"ubuntu-24.04"},{"target":"mac","os":"macos-15"}'
          if [[ "${WINDOWS}" == true ]]; then
            include+=',{"target":"windows","os":"windows-latest"}'
          fi
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    concurrency:
      group: release-${{ needs.version.outputs.version }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
        # Git Bash on Windows: every step is the same bash on every runner.
        shell: bash
    env:
      DO_NOT_TRACK: '1'
    steps:
      # Windows' git checks out text with CRLF line endings, and the build checks files byte
      # for byte (the runtime patches' hashes): check out exactly what the commit holds.
      - name: Check out without CRLF
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Install build tools
        run: npm ci --no-audit --no-fund

      - name: Prepare the runtime and the plugins
        run: node scripts/prepare-runtime.mjs

      - name: Sharp wasm in Electron (assembled runtime)
        run: node scripts/smoke-sharp.mjs

      - name: Build Linux AppImage and deb
        if: matrix.target == 'linux'
        run: npx --no-install electron-builder --linux AppImage deb --publish never

      - name: Build macOS dmg
        if: matrix.target == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # Signing opens the bundle's many files at once (the runtime's node_modules); the
          # runner allows 256 per process, and the system caps what ulimit may raise it to.
          sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=524288 >/dev/null
          sudo launchctl limit maxfiles 524288 524288
          ulimit -n 524288
          echo "open files: $(ulimit -n)"
          if [[ -n "${MAC_CSC_LINK}" ]]; then
            export CSC_LINK="${MAC_CSC_LINK}" CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD}"
            if [[ -n "${APPLE_API_KEY_CONTENT}" && -n "${APPLE_API_KEY_ID}" && -n "${APPLE_API_ISSUER}" ]]; then
              key="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
              trap 'rm -f "${key}"' EXIT
              (umask 077 && printf '%s' "${APPLE_API_KEY_CONTENT}" > "${key}")
              export APPLE_API_KEY="${key}"
            else
              echo "::warning ::No App Store Connect API key: the dmg is signed but not notarized"
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            fi
          else
            echo "::warning ::No signing certificate: the dmg is unsigned"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          npx --no-install electron-builder --mac dmg zip --arm64 --publish never
          if [[ -n "${MAC_CSC_LINK}" ]]; then
            dmg=$(ls dist/*.dmg)
            codesign --verify --strict "${dmg}"
          fi
          if [[ -n "${MAC_CSC_LINK}" && -n "${APPLE_API_KEY:-}" ]]; then
            # afterSign notarized the app without stapling and ran the retry script on the
            # .app before the zip/dmg targets were packed (apps/desktop/scripts/after-sign.cjs).
            # The updater installs from the zip, so extract its app and prove the ticket is on
            # the copy someone updates from; an unstapled zip fails here, not on a user's Mac.
            shopt -s nullglob
            zips=(dist/*-mac-*.zip)
            (( ${#zips[@]} == 1 )) || { echo "::error ::expected one macOS updater zip, found ${#zips[@]}"; exit 1; }
            unzipped=$(mktemp -d)
            ditto -x -k "${zips[0]}" "${unzipped}"
            apps=("${unzipped}"/*.app)
            (( ${#apps[@]} == 1 )) || { echo "::error ::expected one .app in ${zips[0]}, found ${#apps[@]}"; exit 1; }
            "${GITHUB_WORKSPACE}/scripts/staple-retry.sh" --validate-only "${apps[0]}"
            rm -rf "${unzipped}"
            echo "the updater zip's app is stapled: ${zips[0]}"
            # The dmg someone downloads is a signed file of its own, so it goes to Apple too
            # and carries its ticket. Stapling changes its bytes: the feed gets its new sha512
            # and size, and its blockmap (which no update reads: macOS updates from the zip) goes.
            xcrun notarytool submit "${dmg}" --key "${APPLE_API_KEY}" --key-id "${APPLE_API_KEY_ID}" \
              --issuer "${APPLE_API_ISSUER}" --wait --timeout 30m
            # stapler's ticket round-trip goes to api.apple-cloudkit.com; a dropped connection
            # there is not a bad ticket, so the script retries only Apple's transient network
            # codes (3 attempts at 10/30/90 s, then one re-staple pass) and fails at once on a
            # real rejection. notarytool and electron-builder stay outside it: this is not a
            # re-notarization, and afterSign used the same script on the app before the targets.
            "${GITHUB_WORKSPACE}/scripts/staple-retry.sh" "${dmg}"
            spctl --assess --type open --context context:primary-signature -vv "${dmg}"
            node scripts/restamp-feed.mjs dist/latest-mac.yml "${dmg}"
            rm -f "${dmg}.blockmap"
          fi
          if [[ -z "${MAC_CSC_LINK}" ]]; then
            echo "::warning ::Unsigned: no macOS update feed in this release"
            rm -f dist/latest-mac.yml dist/*.zip dist/*.zip.blockmap
          fi

      # Unsigned unless WIN_CSC_LINK is set: electron-builder then signs nothing and fails on
      # nothing. The update feed ships either way: an installed Windows app checks an update's
      # signature only once a signed build named its publisher (electron-builder.yml `win`).
      - name: Build Windows installer
        if: matrix.target == 'windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Azure Trusted Signing, once electron-builder.yml has its azureSignOptions.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Only the Windows certificate signs here, never one meant for another platform.
          unset CSC_LINK CSC_KEY_PASSWORD
          # Azure Trusted Signing signs only once electron-builder.yml has its azureSignOptions:
          # an AZURE_CLIENT_ID secret alone (set up ahead, or for something else) arms nothing.
          azure=false
          if [[ -n "${AZURE_CLIENT_ID}" ]] && grep -Eq '^[[:space:]]+azureSignOptions:' electron-builder.yml; then
            azure=true
          fi
          [[ "${azure}" == true ]] || unset AZURE_CLIENT_ID
          signed=false
          [[ -n "${WIN_CSC_LINK}" || "${azure}" == true ]] && signed=true
          if [[ -z "${WIN_CSC_LINK}" ]]; then
            [[ "${signed}" == true ]] || echo "::warning ::No Windows code-signing certificate: the installer is unsigned"
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npx --no-install electron-builder --win nsis --x64 --publish never
          ls -l dist
          exe=$(ls dist/*-win-x64.exe)
          status=$(powershell -NoProfile -Command "(Get-AuthenticodeSignature -LiteralPath '${exe}').Status")
          echo "${exe}: ${status}"
          if [[ "${signed}" == true && "${status}" != Valid* ]]; then
            echo "::error ::${exe} is not validly signed (${status})"
            exit 1
          fi
          node scripts/check-feed.mjs dist/latest.yml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/latest-*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    # D37: a Windows build that failed or was cancelled never holds back Mac and Linux. This runs
    # once the builds are over, whatever they ended as, unless the run itself was cancelled;
    # "Every download is there" still refuses a release without Mac's or Linux's files.
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.publish != false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      PRERELEASE: ${{ inputs.prerelease }}
      WINDOWS: ${{ inputs.windows }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true

      # A Mac or Linux build that finished without one of its files must not publish: a release
      # without latest-linux.yml or latest-mac.yml leaves every installed app without its update.
      # The macOS zip and feed are only made when the app is signed. With `windows` off, no
      # Windows file publishes, and nothing warns. With it on, Windows (D37) never stops a
      # release: without its installer and latest.yml, both, the release goes out without
      # Windows, says so, and Windows users get the next one. A latest.yml never ships without
      # the installer it names.
      - name: Every download is there
        id: files
        working-directory: assets
        env:
          SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          need=("Automagik-${VERSION}-linux-x86_64.AppImage" "Automagik-${VERSION}-linux-amd64.deb" latest-linux.yml "Automagik-${VERSION}-mac-arm64.dmg")
          [[ "${SIGNED}" == true ]] && need+=("Automagik-${VERSION}-mac-arm64.zip" latest-mac.yml)
          missing=0
          for file in "${need[@]}"; do
            [[ -s "${file}" ]] || { echo "::error ::${file} is missing"; missing=1; }
          done
          [[ "${missing}" == 0 ]] || exit 1
          exe="Automagik-${VERSION}-win-x64.exe"
          if [[ "${WINDOWS}" != true ]]; then
            rm -f -- *-win-x64.exe *-win-x64.exe.blockmap latest.yml
            echo "windows=false" >> "${GITHUB_OUTPUT}"
          elif [[ -s "${exe}" && -s latest.yml ]]; then
            echo "windows=true" >> "${GITHUB_OUTPUT}"
          else
            rm -f -- "${exe}" "${exe}.blockmap" latest.yml
            line="No Windows installer from this build of v${VERSION} (it failed or did not run): Mac and Linux publish without it, and Windows users get the next release."
            echo "::warning ::${line}"
            echo "### ${line}" >> "${GITHUB_STEP_SUMMARY}"
            echo "windows=false" >> "${GITHUB_OUTPUT}"
          fi

      # A rebuild of a release whose Windows build fails this time keeps the Windows files the
      # release already has, rather than sweeping them away below; they go into SHA256SUMS too.
      # With `windows` off it keeps none: the sweep removes the ones a rebuilt release had.
      - name: Windows files the release already has
        if: steps.files.outputs.windows == 'false' && inputs.windows == true
        working-directory: assets
        run: |
          set -euo pipefail
          exe="Automagik-${VERSION}-win-x64.exe"
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" -p "${exe}" -p "${exe}.blockmap" -p latest.yml 2>/dev/null || true
          if [[ -s "${exe}" && -s latest.yml ]]; then
            echo "v${VERSION} keeps the Windows installer it already had"
          else
            rm -f -- "${exe}" "${exe}.blockmap" latest.yml
          fi

      # Every release also carries its downloads under names without the version, so
      # .../releases/latest/download/Automagik-Mac.dmg (the README's buttons) is always the
      # newest. The Omni-* names are the ones the app had before it was Automagik: links to
      # them keep fetching the newest too; Windows came after the rename, so it has only
      # Automagik-Windows.exe. `omni desktop`, `genie desktop` and the updater read the versioned
      # names, which these never match.
      - name: Stable download names
        working-directory: assets
        run: |
          set -euo pipefail
          for pair in "-mac-arm64.dmg:Mac.dmg" "-linux-x86_64.AppImage:Linux.AppImage" "-linux-amd64.deb:Linux.deb"; do
            file=$(ls -- *"${pair%%:*}" 2>/dev/null | head -1 || true)
            [[ -z "${file}" ]] && continue
            for name in Automagik Omni; do cp -- "${file}" "${name}-${pair##*:}"; done
          done
          file=$(ls -- *-win-x64.exe 2>/dev/null | head -1 || true)
          if [[ "${WINDOWS}" == true && -n "${file}" ]]; then
            cp -- "${file}" Automagik-Windows.exe
          fi
          ls -l

      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Add the builds to the release
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # A rebuild replaces the release's desktop files: one this build did not make goes.
            # The cut's own files stay: every one PLUGINS.SHA256SUMS lists (the plugins, the
            # add-ons the lane carries, plugins.json, addons.json), that list itself, and the
            # release's signed lane (lane.json, lane.json.sig). A lane names those tarballs, so
            # deleting one breaks every app's download of it, and a welcome of this version
            # installs nothing without its lane. Pocket's APK and latest.json, and the meter's
            # binaries, usagemeter.SHA256SUMS and signed pointer (release.yml's meter jobs), are
            # its jobs' own, and server-image.json is server-image.yml's record of the pushed
            # image digest.
            cut=$(gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" -p PLUGINS.SHA256SUMS -O - 2>/dev/null | awk '{print $2}' || true)
            for name in $(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'); do
              case "${name}" in automagik-*.tgz|plugins.json|PLUGINS.SHA256SUMS|lane.json|lane.json.sig|automagik-pocket-*.apk|latest.json|usagemeter-*|usagemeter.SHA256SUMS|meter.json|meter.json.sig|server-image.json) continue ;; esac
              grep -qxF -- "${name}" <<< "${cut}" && continue
              [[ -e "assets/${name}" ]] || gh release delete-asset "${TAG}" "${name}" --yes --repo "${GITHUB_REPOSITORY}"
            done
            gh release upload "${TAG}" assets/* --clobber --repo "${GITHUB_REPOSITORY}"
            if [[ "${PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG}" --prerelease --repo "${GITHUB_REPOSITORY}"
            else
              gh release edit "${TAG}" --prerelease=false --latest --repo "${GITHUB_REPOSITORY}"
            fi
          else
            flags=(--latest)
            [[ "${PRERELEASE}" == "true" ]] && flags=(--prerelease)
            windows=""
            [[ "${WINDOWS}" == true && -s assets/Automagik-Windows.exe ]] && windows=" · Windows (x64): **Automagik-Windows.exe** (not signed yet: SmartScreen asks you to confirm, under More info)"
            gh release create "${TAG}" assets/* "${flags[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SHA}" \
              --title "Automagik ${VERSION}" \
              --notes "**Download:** Mac (Apple silicon): **Automagik-Mac.dmg** · Linux: **Automagik-Linux.deb** (Ubuntu, Debian) or **Automagik-Linux.AppImage**${windows}. Already installed (as Omni too)? The app updates itself. SHA256SUMS lists every file's checksum."
          fi
