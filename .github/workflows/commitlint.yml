name: Commit messages

# Every commit a pull request brings is conventional: `type(scope): description`, with
# header and body lines of at most 100 characters (AGENTS.md).

on:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          # Skipped: only the history an import brought (scripts/import-herdr.sh,
          # docs/rfcs/0011-monorepo-parts-and-releases.md), kept as the source repository wrote it.
          # An import merge is a merge whose second parent's history never reaches this
          # repository's own first commit (the root of dev's first-parent line); its imported
          # commits are those reachable from that second parent and not from its first. A re-run
          # of the import adds one more such merge, whose new upstream commits are skipped the same
          # way. Every other commit, before or after a merge of any kind, is checked.
          root=$(git rev-list --first-parent --max-parents=0 "${BASE}")
          imported=$(for merge in $(git rev-list --merges "${BASE}..${HEAD}"); do
            if ! git merge-base --is-ancestor "${root}" "${merge}^2"; then
              git rev-list --no-merges "${merge}^2" --not "${merge}^1" "${BASE}"
            fi
          done)
          skipped=0
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            if grep -qxF -- "${sha}" <<< "${imported}"; then
              skipped=$((skipped + 1))
              continue
            fi
            subject=$(git log -1 --format=%s "${sha}")
            if ! [[ "${subject}" =~ ^(feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
              echo "::error ::${sha:0:9} is not conventional: ${subject}"
              bad=1
            fi
            if git log -1 --format=%B "${sha}" | awk 'length > 100 { found = 1 } END { exit !found }'; then
              echo "::error ::${sha:0:9} has a line over 100 characters"
              bad=1
            fi
          done
          (( skipped == 0 )) || echo "${skipped} imported commit(s) skipped: their history is the source repository's"
          exit "${bad}"
