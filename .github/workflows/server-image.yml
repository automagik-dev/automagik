name: Server image

# The Automagik server image (server/): the automagik-web DeepSeek Harness profile, with the
# plugins from one chosen release, built from the dispatched tree. Every change builds, smokes
# and scans it; a dispatch or a published release then pushes it to
# ghcr.io/automagik-si/automagik-server as :<content>-<short sha> and, when allowed, :latest.
# The tag and the org.opencontainers.image.version label are the content release (the plugin
# tarballs' release, without its v); org.opencontainers.image.revision is the full workflow
# commit. :latest moves only for a non-prerelease content release and never to a version older
# than the published :latest.
#
# workflow_dispatch takes one optional input, `content`: a release tag that carries
# plugins.json (e.g. v3.93.0). Empty means the newest stable release whose assets include
# plugins.json, searched among the last 30 releases. A herdr, Pocket or am patch carries no
# plugin tarballs, so a dispatch whose content has none fails, naming the tag. A dispatch runs
# on dev or on a v<version> tag (which must be package.json's version). After merge:
#
#   gh workflow run server-image.yml --ref dev -f content=v3.93.0
#
# A release event uses the release's own version as the content when it carries plugins.json,
# with the same composite tag and labels; a release without it builds and pushes nothing. A
# pull_request packs the committed checkout for a nonpublishing test image. A push retains
# release inputs: the current version when it has plugins, otherwise the newest stable plugin
# release. Its path filter and release resolution are unchanged; old release bytes may fail.
#
# A run that pushes also records the pushed manifest digest on the content release itself: the
# asset server-image.json (server/image-record.mjs), on a release event and on a dispatch alike,
# because the cut's own release starts no workflow (below). That record is the release's own: a
# workspace pins the image by its digest, never by :latest (RFC 0024 (g); issue #910). A later
# push for the same content release replaces the record, which names its commit and tag.
# The record job attests that digest with GitHub's keyless build provenance and pushes the
# attestation to the registry. Stable content then advances server-lane/server-image.json in the
# server-lane job: a rolling prerelease (never Latest), one at a time, never to an older version.
# Prereleases never move it; an unreadable existing record fails closed. Consumers verify the
# image with gh attestation verify before pulling by digest (server/README.md, Follow).
#
# The scan (server/secrecy.mjs) extracts the built rootfs and the image config before any login
# and fails the job on a provider key, a token= or JSON token field, a private-key block with a
# real body, a .env or launch-url file, bot/team state under /data, a home or /mnt/ai path, a git
# credential, an archive, a hit from the repository's own privacy grep, or a secret-looking env
# name. The only exceptions are exact reviewed entries in server/secrecy-allowlist.json (one
# file, one rule, the exact match; keys, /data, our own code, /etc and config may never be
# allowlisted; a private-key block only for the six reviewed gnutls test vectors, pinned by the
# block and containing-library sha256). Third-party test/example/docs folders, non-Linux
# prebuilds and the profile's vendor tarballs are pruned before the scan, and the tools stage
# strips the distroless man/changelog pages before the final scratch image copies that rootfs.
# The same scan holds RFC 0025's Decided 12: the image carries no Stripe SDK (package, dependency
# or import), no Stripe host, key or id, and, in this repository's own code and the image's
# config, no billing or ledger import, billing route, or built-in gateway address or credential.
# A self-check in image mode proves a planted key still fails; the layer list, file inventory,
# allowlist used and external symlinks are kept as an artifact. The image is never run by the
# scan.
#
# No key is baked and no test token is in this workflow: the only credential is GITHUB_TOKEN,
# used to log in to the registry, to read the release's assets and, in the record job alone
# (the only one with contents: write), to post server-image.json. Only record can mint an OIDC
# token and write attestations; it also logs in to push the attestation. The token is not passed to docker
# build or into the image. GitHub has no REST endpoint for a Container package's visibility:
# the job checks it and leaves the organization package-settings path in the summary.
#
# A release published with release.yml's GITHUB_TOKEN starts no release-event workflow. After
# the cut, release.yml explicitly dispatches this on the release tag with content=v<version>
# for every stable release carrying plugins.json. That independent job only warns on failure;
# no other lane waits for the image. Manual dispatches can retry it on dev or the release tag.
# A release published by hand (or by a PAT) also triggers the release event above. The record
# job's summary links server-image.json beside the pushed digest for the release's live proof.

on:
  pull_request:
    paths:
      - apps/*-dsh/**
      - package.json
      - bun.lock
      - scripts/server-checkout.ts
      - scripts/server-checkout.test.ts
      - scripts/server-checkout-workflow.test.ts
      - scripts/release-plugins.ts
      - scripts/marketplace.ts
      - scripts/version.ts
      - server/**
      - apps/desktop/runtime/package.json
      - apps/desktop/runtime/package-lock.json
      - apps/desktop/runtime/patches/**
      - apps/desktop/scripts/prune-runtime.mjs
      - apps/desktop/scripts/runtime-patches.mjs
      - herdr/scripts/privacy-check.mjs
      - herdr/scripts/privacy-list.json
      - .github/workflows/server-image.yml
  push:
    branches: [dev]
    paths:
      - server/**
      - apps/desktop/runtime/package.json
      - apps/desktop/runtime/package-lock.json
      - apps/desktop/runtime/patches/**
      - apps/desktop/scripts/prune-runtime.mjs
      - apps/desktop/scripts/runtime-patches.mjs
      - herdr/scripts/privacy-check.mjs
      - herdr/scripts/privacy-list.json
      - .github/workflows/server-image.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      content:
        description: >-
          A release tag whose assets include plugins.json (e.g. v3.93.0). Empty uses the
          newest stable release that has plugins.json.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Server image (build, smoke, scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.gate.outputs.version }}
      content: ${{ steps.gate.outputs.content }}
      tag: ${{ steps.gate.outputs.tag }}
      revision: ${{ steps.gate.outputs.revision }}
      publish: ${{ steps.gate.outputs.publish }}
      latest: ${{ steps.gate.outputs.latest }}
      source: ${{ steps.gate.outputs.source }}
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The image runs Node 24; the build, smoke and scan scripts run on the runner's.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      # The content is the release whose plugin tarballs the image installs; the image is the
      # dispatched tree plus that content. A dispatch chooses the content (empty picks the newest
      # stable release that carries plugins.json, within the last 30 releases); a release is its
      # own content. A herdr/Pocket/am patch has no plugin tarballs: a dispatch whose content has
      # none is refused, and a release for such a version builds nothing.
      - name: Resolve the image content and whether to publish
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_CONTENT: ${{ inputs.content }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          revision="${REVISION}"
          short="${revision:0:8}"
          content=""
          tag=""
          build=true
          publish=false
          latest=false
          source=release
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          has_plugins() {
            gh release view "$1" --repo "${REPOSITORY}" --json assets --jq '.assets[].name' | grep -qx plugins.json
          }
          # The newest stable release that carries the plugin tarballs. A herdr, Pocket or am
          # patch has none, so the image pins the plugins from the last release that does.
          newest_plugins() {
            gh api "repos/${REPOSITORY}/releases?per_page=30" \
              --jq '[.[] | select(.draft|not) | select(.prerelease|not) | select([.assets[].name] | index("plugins.json"))][0].tag_name' \
              | sed 's/^v//'
          }
          release_prerelease() {
            gh release view "v$1" --repo "${REPOSITORY}" --json isPrerelease --jq .isPrerelease
          }
          resolve_content() {
            if has_plugins "v${version}"; then echo "${version}"; else newest_plugins; fi
          }
          case "${EVENT}" in
            pull_request)
              content="${version}"
              source=checkout
              ;;
            workflow_dispatch)
              case "${REF}" in
                refs/heads/dev) ;;
                refs/tags/v*)
                  if [[ "${REF_NAME}" != "v${version}" ]]; then
                    echo "::error::dispatch tag ${REF_NAME} is not v${version}, the version in package.json"
                    exit 1
                  fi
                  ;;
                *)
                  echo "::error::dispatch this on dev or a v<version> tag, not ${REF}"
                  exit 1
                  ;;
              esac
              content="${DISPATCH_CONTENT#v}"
              if [[ -z "${content}" ]]; then
                content="$(newest_plugins)"
                if [[ -z "${content}" ]]; then
                  echo "::error::no stable release in the last 30 carries plugins.json; pass -f content=<tag>"
                  exit 1
                fi
              fi
              if ! has_plugins "v${content}"; then
                echo "::error::content v${content} carries no plugins.json (a herdr/Pocket/am patch); pass a release tag whose assets include plugins.json, e.g. v3.93.0"
                exit 1
              fi
              publish=true
              pre="$(release_prerelease "${content}")"
              if [[ "${pre}" == "true" ]]; then
                echo "::notice::content v${content} is a prerelease; :latest stays put"
              elif [[ "${pre}" != "false" ]]; then
                echo "::error::cannot read prerelease state of v${content}; refusing to publish"
                exit 1
              else
                latest=true
              fi
              ;;
            release)
              if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
                echo "::error::release ${RELEASE_TAG} does not match package.json ${version}"
                exit 1
              fi
              if has_plugins "${RELEASE_TAG}"; then
                content="${version}"
                publish=true
                if [[ "${RELEASE_PRERELEASE}" != "true" ]]; then latest=true; fi
              else
                echo "release ${RELEASE_TAG} carries no plugins.json (a herdr/Pocket/am patch): nothing builds or publishes"
                build=false
              fi
              ;;
            push)
              # Push: build and scan only. A version without plugins (a patch
              # merged into dev) still builds, pinned to the newest release that has them.
              content="$(resolve_content)"
              if [[ -z "${content}" ]]; then
                echo "::error::no stable release carries plugins.json; nothing to pin the plugins from"
                exit 1
              fi
              ;;
            *)
              echo "::error::unsupported event ${EVENT}"
              exit 1
              ;;
          esac
          if [[ -n "${content}" ]]; then
            tag="${content}-${short}"
            if [[ "${source}" == checkout ]]; then tag="checkout-${revision}"; fi
            if [[ ! "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::cannot form a Docker tag from content ${content} and commit ${revision}"
              exit 1
            fi
            if [[ "${content}" != "${version}" ]]; then
              echo "content ${content}: the plugins are this release's; the tree is ${version} at ${short}"
            fi
          fi
          {
            echo "version=${version}"
            echo "content=${content}"
            echo "tag=${tag}"
            echo "revision=${revision}"
            echo "build=${build}"
            echo "publish=${publish}"
            echo "latest=${latest}"
            echo "source=${source}"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # releasePlugins imports the locked root marketplace tooling. No plugin installs/hooks.
      - name: Install locked checkout tooling
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pack committed checkout inputs
        id: checkout-input
        if: github.event_name == 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          REVISION: ${{ github.sha }}
        run: bun scripts/server-checkout.ts "${EVENT}" "${REVISION}"

      - name: Checkout input tests
        if: github.event_name == 'pull_request'
        run: bun test scripts/server-checkout.test.ts scripts/server-checkout-workflow.test.ts

      - name: Install locked gate dependencies
        run: bun install --cwd server --frozen-lockfile --ignore-scripts --linker hoisted

      - name: Syntax
        run: |
          set -euo pipefail
          for file in server/*.mjs server/test/*.mjs; do node --check "${file}"; done
          sh -n server/bin/dsh
          sh -n server/bin/pnpm

      - name: Unit tests
        run: node --test 'server/test/*.test.mjs'

      # The gate itself, in image mode, on a known-red image: a planted key must fail before the
      # real build is trusted. This is the same docker export + scan path the publish runs.
      - name: Secrecy gate self-check (a planted key must fail)
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          printf 'sk-%s\n' "$(printf 'a%.0s' $(seq 1 32))" > "${dir}/leak"
          tar -C "${dir}" -cf "${dir}/rootfs.tar" leak
          docker import "${dir}/rootfs.tar" automagik-secrecy-red:test >/dev/null
          if node server/secrecy.mjs automagik-secrecy-red:test --inventory "${dir}/secrecy"; then
            echo "::error::the secrecy gate passed a planted key"
            exit 1
          fi
          grep -q 'key: sk-\*\*\*' "${dir}/secrecy/secrecy.txt"
          docker rmi automagik-secrecy-red:test >/dev/null
          echo "secrecy gate self-check: the planted key fails the image-mode scan"

      - name: Build
        if: steps.gate.outputs.build == 'true'
        env:
          CONTENT: ${{ steps.gate.outputs.content }}
          TAG: ${{ steps.gate.outputs.tag }}
          REVISION: ${{ steps.gate.outputs.revision }}
          EVENT: ${{ github.event_name }}
          INPUT_KIND: ${{ steps.gate.outputs.source }}
          INPUT_MANIFEST: ${{ steps.checkout-input.outputs.manifest }}
        run: |
          set -euo pipefail
          image_version="${CONTENT}"
          if [[ "${INPUT_KIND}" == checkout ]]; then image_version="checkout-${REVISION}"; fi
          node server/build.mjs --tag "automagik-server:${TAG}" \
            --version "${CONTENT}" --image-version "${image_version}" --revision "${REVISION}" \
            --input-kind "${INPUT_KIND}" --event "${EVENT}" --input-manifest "${INPUT_MANIFEST}"

      - name: Prove the installed checkout child and image identity
        if: github.event_name == 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          INPUT_KIND: ${{ steps.gate.outputs.source }}
          TAG: ${{ steps.gate.outputs.tag }}
          CONTENT: ${{ steps.gate.outputs.content }}
          REVISION: ${{ github.sha }}
          INPUT_MANIFEST: ${{ steps.checkout-input.outputs.manifest }}
          CHILD_SHA: ${{ steps.checkout-input.outputs.child }}
        run: node server/image-source.mjs checkout

      - name: Keep the checkout image proof
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-checkout-proof-${{ github.sha }}
          path: checkout-image-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Smoke
        if: steps.gate.outputs.build == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: node server/smoke.mjs "automagik-server:${TAG}"

      - name: Plugins follow a newer image on an older release volume (offline)
        if: steps.gate.outputs.build == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: node server/follow-smoke.mjs "automagik-server:${TAG}"

      # Before this workflow has logged in anywhere: export the image's rootfs, inventory every
      # file, and fail on a secret, a home path, a credential or any baked state. The inventory
      # is the proof of what was checked.
      - name: Secrecy (extract rootfs and scan)
        if: steps.gate.outputs.build == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: node server/secrecy.mjs "automagik-server:${TAG}" --inventory secrecy

      - name: Assert the image is clean
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          test "$(cat secrecy/secrecy.txt)" = clean
          allowed="$(grep -c . secrecy/allowlist-used.txt || true)"
          echo "image-clean: $(wc -l < secrecy/image-files.txt) files, $(wc -l < secrecy/image-layers.txt) layer lines, 0 findings, ${allowed:-0} exact allowlist hits"

      - name: Keep the secrecy inventory
        if: always() && steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-image-secrecy-${{ steps.gate.outputs.tag }}
          path: secrecy/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save the scanned image for the publish job
        if: steps.gate.outputs.publish == 'true' && steps.gate.outputs.source == 'release' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: docker save "automagik-server:${TAG}" | gzip -1 > server-image.tar.gz

      - name: Keep the image
        if: steps.gate.outputs.publish == 'true' && steps.gate.outputs.source == 'release' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-image-${{ steps.gate.outputs.tag }}
          path: server-image.tar.gz
          retention-days: 1

  publish:
    name: Publish ghcr.io/automagik-si/automagik-server
    needs: image
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DO_NOT_TRACK: '1'
      EVENT: ${{ github.event_name }}
      INPUT_KIND: ${{ needs.image.outputs.source }}
      VERSION: ${{ needs.image.outputs.version }}
      CONTENT: ${{ needs.image.outputs.content }}
      TAG: ${{ needs.image.outputs.tag }}
      REVISION: ${{ needs.image.outputs.revision }}
      LATEST: ${{ needs.image.outputs.latest }}
      GHCR: ghcr.io/automagik-si/automagik-server
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Refuse non-release publication before loading artifacts
        run: node server/image-source.mjs check-publish

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-image-${{ needs.image.outputs.tag }}
          path: .

      - name: Load the scanned image
        run: gunzip -c server-image.tar.gz | docker load

      - name: Verify the loaded candidate source before login
        run: node server/image-source.mjs release

      # The bytes that will be pushed, scanned again after the round trip: a hit here still
      # precedes the login and the push below.
      - name: Secrecy (the bytes about to be pushed)
        run: node server/secrecy.mjs "automagik-server:${TAG}" --inventory secrecy

      - name: Assert the pushed bytes are clean
        run: |
          set -euo pipefail
          test "$(cat secrecy/secrecy.txt)" = clean
          allowed="$(grep -c . secrecy/allowlist-used.txt || true)"
          echo "image-clean: $(wc -l < secrecy/image-files.txt) files, $(wc -l < secrecy/image-layers.txt) layer lines, 0 findings, ${allowed:-0} exact allowlist hits"

      - name: Keep the push secrecy inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-image-push-secrecy-${{ needs.image.outputs.tag }}
          path: secrecy/
          if-no-files-found: ignore
          retention-days: 7

      - name: Log in to the Container registry
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push :content-revision and, when newer, :latest
        id: push
        env:
          LATEST: ${{ needs.image.outputs.latest }}
        run: |
          set -euo pipefail
          docker tag "automagik-server:${TAG}" "${GHCR}:${TAG}"
          out="$(docker push "${GHCR}:${TAG}" 2>&1)"
          printf '%s\n' "${out}"
          digest="$(printf '%s\n' "${out}" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -1)"
          if [[ -z "${digest}" ]]; then
            echo "::error::docker push printed no manifest digest"
            exit 1
          fi
          latest="${LATEST}"
          if [[ "${latest}" == "true" ]]; then
            old="$(docker buildx imagetools inspect "${GHCR}:latest" --format '{{index .Image.Config.Labels "org.opencontainers.image.version"}}' 2>/dev/null || true)"
            if [[ -n "${old}" && "${old}" != "<no value>" ]]; then
              newest="$(printf '%s\n%s\n' "${CONTENT}" "${old}" | sort -V | tail -1)"
              if [[ "${newest}" == "${old}" && "${old}" != "${CONTENT}" ]]; then
                echo "::warning::latest stays at ${old}; ${CONTENT} is older"
                latest=false
              fi
            fi
          fi
          tags="\`:${TAG}\`"
          if [[ "${latest}" == "true" ]]; then
            docker tag "automagik-server:${TAG}" "${GHCR}:latest"
            docker push "${GHCR}:latest"
            tags="${tags}, \`:latest\`"
          else
            echo "latest not moved (a prerelease content release, or older than the published image)"
          fi
          ref="${GHCR}@${digest}"
          printf '%s\n' "${ref}" > image-digest.txt
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          {
            echo "## Automagik server image"
            echo
            echo '```'
            echo "${ref}"
            echo '```'
            echo
            echo "- version: \`${CONTENT}\` (the release whose plugin tarballs are installed)"
            echo "- revision: \`${REVISION}\` (the workflow commit)"
            if [[ "${VERSION}" != "${CONTENT}" ]]; then echo "- repository version: \`${VERSION}\` (the tree this image was built from)"; fi
            echo "- tags: ${tags}"
            echo
            echo "Pull by digest:"
            echo
            echo '```sh'
            echo "docker pull ${ref}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub creates a new package private and has no public REST endpoint to change a
      # Container package's visibility. Check it and leave the UI path in the summary; the
      # image is still pushed, but anonymous pulls fail until the one-time flip.
      - name: Check package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: automagik-server
        run: |
          set -euo pipefail
          endpoint="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}"
          visibility="$(gh api "${endpoint}" --jq .visibility 2>/dev/null || true)"
          if [[ "${visibility}" == "public" ]]; then
            echo "package ${PACKAGE}: public"
            exit 0
          fi
          echo "::warning::GitHub has no REST call to change a package's visibility; make ${PACKAGE} public once at https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE} (Package settings -> Danger Zone -> Change visibility -> Public)"
          {
            echo
            echo "### Package visibility"
            echo
            echo "GitHub has no public REST endpoint for a Container package's visibility. Make it public once:"
            echo
            echo "1. Open https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}"
            echo "2. Package settings -> Danger Zone -> Change visibility -> Public"
            echo
            echo "Until then anonymous pulls fail; a pull authenticated with a GitHub token still works."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the manifest digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-image-digest-${{ needs.image.outputs.tag }}
          path: image-digest.txt
          retention-days: 30

  # The release's own record of what was pushed (RFC 0024 delivery 4's acceptance; issue #910).
  # Its own job: the only one that may write to a release or attest the pushed digest. It
  # runs on a release event and on a dispatch, whichever pushed. The record goes on the content
  # release (v<content>): on a release event that is the release itself. It is built only from
  # the digest the push printed, and read back from the release before the job passes.
  record:
    name: Record the image digest on the release
    needs: [image, publish]
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      DO_NOT_TRACK: '1'
      GH_TOKEN: ${{ github.token }}
      CONTENT: ${{ needs.image.outputs.content }}
      TAG: ${{ needs.image.outputs.tag }}
      REVISION: ${{ needs.image.outputs.revision }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      GHCR: ghcr.io/automagik-si/automagik-server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Log in to push the provenance attestation
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      - name: Attest the pushed image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Write server-image.json and post it on the content release
        run: |
          set -euo pipefail
          node server/image-record.mjs write --image "${GHCR}" --digest "${DIGEST}" \
            --version "${CONTENT}" --revision "${REVISION}" --tag "${TAG}" --out server-image.json
          gh release upload "v${CONTENT}" server-image.json --clobber --repo "${GITHUB_REPOSITORY}"

      # What a workspace will read: the asset as the release serves it, not the local file.
      - name: Read the record back from the release
        run: |
          set -euo pipefail
          mkdir posted
          gh release download "v${CONTENT}" --pattern server-image.json --dir posted --repo "${GITHUB_REPOSITORY}"
          node server/image-record.mjs check posted/server-image.json --digest "${DIGEST}"
          {
            echo
            echo "### Release record"
            echo
            echo "[server-image.json](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${CONTENT}/server-image.json) on \`v${CONTENT}\` records \`${GHCR}@${DIGEST}\`. Pin a workspace by that digest, never by a tag."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io

  # The rolling server-lane prerelease (like pocket-lane): its own small job, so a dropped waiting
  # run never loses a content release's own record. GitHub keeps one job waiting in the group and
  # drops an older waiting one for a newer, so the lane still ends on the newest stable content;
  # server/server-lane.mjs refuses an older version anyway. A prerelease never enters it.
  server-lane:
    name: Advance the stable server lane
    needs: [image, record]
    if: needs.image.outputs.publish == 'true' && needs.image.outputs.latest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: server-lane
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DO_NOT_TRACK: '1'
      GH_TOKEN: ${{ github.token }}
      CONTENT: ${{ needs.image.outputs.content }}
      GHCR: ghcr.io/automagik-si/automagik-server
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Read the content release's record and advance server-lane
        run: |
          set -euo pipefail
          gh release download "v${CONTENT}" --pattern server-image.json --dir posted --repo "${GITHUB_REPOSITORY}"
          node server/server-lane.mjs posted/server-image.json
