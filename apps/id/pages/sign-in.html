<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#d3eff4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#173840" media="(prefers-color-scheme: dark)">
<title>Sign in · Automagik ID</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="preload" href="/assets/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/genie-faces.webp" as="image" type="image/webp">
<link rel="stylesheet" href="/id.css">
<script src="/id.js" defer></script>
</head>
<body data-page="sign-in">
<div class="stage" aria-hidden="true">
<svg class="sky sky-left" viewBox="0 0 360 520" focusable="false"><path class="sky-line" d="M34 96 150 212 60 318M150 212l150 60"/><path class="sky-arc" d="M96 36c92 60 132 150 118 262"/><circle class="node node-cyan" cx="34" cy="96" r="7"/><circle class="node node-lilac" cx="150" cy="212" r="15"/><circle class="node node-pink" cx="60" cy="318" r="8"/><circle class="node node-cyan" cx="300" cy="272" r="6"/></svg>
<svg class="sky sky-right" viewBox="0 0 360 520" focusable="false"><path class="sky-line" d="M326 120 214 196l72 132M214 196 70 150"/><path class="sky-arc" d="M300 470C190 430 120 350 110 250"/><circle class="node node-pink" cx="326" cy="120" r="9"/><circle class="node node-cyan" cx="214" cy="196" r="13"/><circle class="node node-lilac" cx="286" cy="328" r="8"/><circle class="node node-pink" cx="70" cy="150" r="5"/></svg>
</div>
<main class="shell">
<div class="column">
  <header class="brand"><picture><source media="(prefers-color-scheme: dark)" srcset="/assets/automagik-lockup-three-colours-cream-header.svg"><img src="/assets/automagik-lockup-three-colours-ink-header.svg" width="1632" height="264" alt="Automagik"></picture></header>

  <div class="middle" id="scene" data-who="genie" data-mood="work">
  <div class="host">
    <div class="pet-spot" aria-hidden="true"><div class="pet" id="pet"></div></div>
    <p class="bubble" id="say" role="status">One moment…</p>
  </div>
  <div class="pal" aria-hidden="true"></div>

  <section class="card" id="card" aria-labelledby="title" aria-busy="true">
    <h1 id="title" tabindex="-1"><span id="lead">Sign in</span> <span class="product" id="product" hidden></span></h1>

    <div class="view" data-view="loading">
      <div class="stack" aria-hidden="true"><span class="sk block"></span><span class="sk block"></span></div>
    </div>

    <!-- Passkey: the main way in. One choice for people who have one, one for people who are new. -->
    <div class="view" data-view="passkey" hidden>
      <div class="stack">
        <button class="button primary" id="use-passkey" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="4.5"/><path d="M12.5 12H21v3.5M17 12v2.6"/></svg>
          <span data-label>Continue with a passkey</span>
        </button>
        <button class="button secondary" id="create-passkey" type="button">
          <span data-label><span class="aside">New here?</span> Create a passkey</span>
        </button>
      </div>
      <!-- WhatsApp: shown only when the service has it on. -->
      <div id="whatsapp-offer" hidden>
        <p class="or">or</p>
        <div class="stack">
          <button class="button secondary" id="use-whatsapp" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 0 0-7.3 12.8L3.5 20.5l4.3-1.1A8.5 8.5 0 1 0 12 3.5z"/><path d="M9 9.2c.2 2.6 2.2 4.8 4.9 5.4l1.4-1.4"/></svg>
            <span data-label>Use WhatsApp</span>
          </button>
        </div>
      </div>
      <p class="wait" id="passkey-wait" hidden></p>
    </div>

    <!-- Already signed in on this browser. -->
    <div class="view" data-view="session" hidden>
      <div class="stack">
        <button class="button primary" id="continue" type="button"><span data-label>Continue</span></button>
        <button class="button secondary" id="switch" type="button"><span data-label>Use another account</span></button>
      </div>
      <p class="wait" id="session-wait" hidden></p>
    </div>

    <!-- WhatsApp is the only way in on this browser, or the last code ran out. -->
    <div class="view" data-view="offer" hidden>
      <div class="stack">
        <button class="button primary" id="start-whatsapp" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 0 0-7.3 12.8L3.5 20.5l4.3-1.1A8.5 8.5 0 1 0 12 3.5z"/><path d="M9 9.2c.2 2.6 2.2 4.8 4.9 5.4l1.4-1.4"/></svg>
          <span data-label>Use WhatsApp</span>
        </button>
      </div>
      <p class="wait" id="offer-wait" hidden></p>
      <button class="link" id="offer-passkey" type="button">Use a passkey</button>
    </div>

    <!-- WhatsApp: the message is ready. The person sends it; this page waits and signs in. -->
    <div class="view" data-view="whatsapp" hidden>
      <div class="proof" id="proof">
        <div class="qr" id="qr" hidden><svg id="qr-code" role="img" aria-label="QR code: opens WhatsApp on your phone with the message ready" focusable="false"></svg></div>
        <div class="letter">
          <p class="letter-label">Your message, ready to send</p>
          <p class="letter-text"><span id="wa-words"></span> <strong id="wa-code"></strong></p>
        </div>
      </div>
      <ol class="steps">
        <li id="wa-step-open"></li>
        <li>Press send. Nothing is sent for you.</li>
        <li>Come back here. This page signs you in.</li>
      </ol>
      <div class="stack">
        <a class="button primary" id="open-whatsapp" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 0 0-7.3 12.8L3.5 20.5l4.3-1.1A8.5 8.5 0 1 0 12 3.5z"/><path d="M9 9.2c.2 2.6 2.2 4.8 4.9 5.4l1.4-1.4"/></svg>
          <span data-label>Open WhatsApp</span>
        </a>
      </div>
      <p class="wait waiting" id="wa-wait"><span class="spin" aria-hidden="true"></span><span id="wa-left"></span></p>
      <button class="link" id="leave-whatsapp" type="button">Use a passkey</button>
    </div>

    <!-- Signed in, on the way back to the product. -->
    <div class="view" data-view="going" hidden>
      <p class="going"><span class="spin" aria-hidden="true"></span><span id="going-text">Taking you back…</span></p>
    </div>

    <!-- Signed in with nowhere to go back to. -->
    <div class="view" data-view="done" hidden>
      <p class="note">You can close this page.</p>
      <div class="stack">
        <button class="button secondary" id="sign-out" type="button"><span data-label>Sign out</span></button>
      </div>
    </div>

    <!-- Could not load: try again. -->
    <div class="view" data-view="retry" hidden>
      <div class="stack">
        <button class="button primary" id="retry" type="button"><span data-label>Try again</span></button>
      </div>
      <p class="wait" id="retry-wait" hidden></p>
    </div>

    <!-- Nothing more to do here. -->
    <div class="view" data-view="stop" hidden>
      <p class="note" id="stop-text"></p>
    </div>

    <noscript><p>Turn on JavaScript to sign in.</p></noscript>
  </section>
  </div>

  <p class="foot">Automagik ID</p>
</div>
</main>
</body>
</html>
