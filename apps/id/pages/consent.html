<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#d3eff4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#173840" media="(prefers-color-scheme: dark)">
<title>Allow access · Automagik ID</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="preload" href="/assets/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/pet.webp" as="image" type="image/webp">
<link rel="stylesheet" href="/id.css">
<script src="/id.js" defer></script>
</head>
<body data-page="consent">
<div class="stage" aria-hidden="true"></div>
<main class="shell">
<div class="column">
  <header class="brand"><img src="/assets/wordmark.webp" width="471" height="96" alt="Automagik"></header>

  <div class="middle">
  <div class="host">
    <div class="pet-spot" aria-hidden="true"><div class="pet" id="pet" data-mood="work"></div></div>
    <p class="bubble" id="say" role="status">One moment…</p>
  </div>

  <section class="card" id="card" aria-labelledby="title" aria-busy="true">
    <h1 id="title" tabindex="-1"><span id="lead">Allow access</span> <span class="product" id="product" hidden></span></h1>

    <div class="view" data-view="loading">
      <div class="stack" aria-hidden="true"><span class="sk block"></span><span class="sk block"></span></div>
    </div>

    <!-- Who asks, what it will be able to do, and the two answers. Nothing is sent on load. -->
    <div class="view" data-view="ask" hidden>
      <p class="asks-label" id="asks-label">It will be able to</p>
      <ul class="asks" id="asks" aria-labelledby="asks-label"></ul>
      <div class="stack">
        <button class="button primary" id="allow" type="button"><span data-label>Allow</span></button>
        <button class="button secondary" id="deny" type="button"><span data-label>Cancel</span></button>
      </div>
      <p class="wait" id="ask-wait" hidden></p>
    </div>

    <div class="view" data-view="going" hidden>
      <p class="going"><span class="spin" aria-hidden="true"></span><span id="going-text">Taking you back…</span></p>
    </div>

    <!-- The sign-in ran out: sign in again with the same request. -->
    <div class="view" data-view="expired" hidden>
      <div class="stack">
        <button class="button primary" id="sign-in-again" type="button"><span data-label>Sign in</span></button>
      </div>
    </div>

    <div class="view" data-view="retry" hidden>
      <div class="stack">
        <button class="button primary" id="retry" type="button"><span data-label>Try again</span></button>
      </div>
      <p class="wait" id="retry-wait" hidden></p>
    </div>

    <div class="view" data-view="stop" hidden>
      <p class="note" id="stop-text"></p>
    </div>

    <noscript><p>Turn on JavaScript to answer this request.</p></noscript>
  </section>
  </div>

  <p class="foot">Automagik ID</p>
</div>
</main>
</body>
</html>
