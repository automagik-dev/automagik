[package]
name = "automagik-tauri-spike"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
