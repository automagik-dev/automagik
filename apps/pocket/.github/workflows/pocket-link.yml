name: Pocket Link

# The desktop mod's bridge (desktop/pocket-link/): syntax and its dependency-free tests (the
# pre-pairing limits, the pairing code, where its state lives, public-status.json, and how the dialog finds Node), on Linux and macOS. Runs only when the mod changes.
on:
  push:
    branches: [dev]
    paths:
      - 'desktop/pocket-link/**'
      - '.github/workflows/pocket-link.yml'
  pull_request:
    paths:
      - 'desktop/pocket-link/**'
      - '.github/workflows/pocket-link.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bridge tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop/pocket-link/mods/pocket-link
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check bridge/bridge.mjs && node --check bridge/guard.mjs && node --check bridge/pairing.mjs && node --check bridge/state.mjs && node --check bridge/presence.mjs && node --check find-node.js
      - name: Test
        run: node --test bridge/guard.test.mjs bridge/pairing.test.mjs bridge/state.test.mjs bridge/presence.test.mjs find-node.test.mjs
