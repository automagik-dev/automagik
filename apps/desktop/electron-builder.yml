# Automagik desktop packaging. The app is named Automagik wherever a person sees it (the
# bundle and its menu bar, the desktop entry, the artifacts) and in its installed identity:
# the appId (macOS takes an update only for the same id and signer), the Linux executable,
# desktop entry id (package.json desktopName) and deb package, and Electron's data folder
# (src/identity.js). Builds up to 3.11.x kept Omni's identity; one of those does not update
# into this one, it is installed afresh. Run `npm run prepare-runtime` first (the dist:* scripts do): it fills
# build/runtime and build/profile, which ship as resources beside the app.
appId: ai.namastex.automagik
productName: Automagik
copyright: Copyright © 2026 Namastex Labs
directories:
  output: dist
  buildResources: assets
files:
  - src/**
  - package.json
extraResources:
  - from: build/runtime/node_modules
    to: runtime/node_modules
  - from: build/profile
    to: profile
  # Named on its own: extraResources leaves out node_modules folders nested in a `from`.
  - from: build/profile/node_modules
    to: profile/node_modules
  - from: build/versions.json
    to: versions.json
  # The desktop's DSH-in-Herdr setup imports the shared installer (src/dsh-tui.js): am/dshTui.mjs
  # and its two local modules, copied by prepare-runtime. Never a second copy in the repository.
  - from: build/dsh-tui
    to: dsh-tui
asar: true
# automagik:// and omni:// links (src/deeplink.js) open this app: automagik:// is Automagik's
# own (Herdr's Work button, RFC 0013), omni:// stays as its alias, and an Omni's "Open in the
# app" links use it. macOS takes the schemes from Info.plist (CFBundleURLTypes); Linux from the
# desktop entry's MimeType, which electron-builder writes for each scheme here. NSIS does not
# read this list: assets/installer.nsh registers the same schemes on Windows.
protocols:
  - name: Automagik
    schemes:
      - automagik
  - name: Omni
    schemes:
      - omni
# Chromium's sandbox on Linux needs either a setuid chrome-sandbox (the deb sets it on
# install) or unprivileged user namespaces, which Ubuntu 24.04+ restricts. The launcher
# the hook writes picks --no-sandbox only when neither is available (an AppImage there).
afterPack: scripts/after-pack.cjs
linux:
  target:
    - AppImage
    - deb
  category: Network
  executableName: automagik
  icon: assets/icon.png
  syncDesktopName: true
  synopsis: Automagik on your desktop
  description: Automagik's Bot team and Omni's channels on a DeepSeek Harness of its own, linked to your Omni by a code sent over WhatsApp.
  maintainer: Namastex Labs <dev@namastex.ai>
  # `omni desktop`, `genie desktop` and the update feeds find a build by what follows the
  # version (-linux-x86_64.AppImage, -mac-arm64.dmg, the zip), not by the name in front.
  artifactName: Automagik-${version}-linux-${arch}.${ext}
deb:
  # The package installed copies have: a deb of the same package upgrades it in place, from
  # apt, dpkg or a software center alike. It installs to /opt/Automagik, and the postinst
  # points /usr/bin/automagik there.
  packageName: automagik
  packageCategory: net
  appArmorProfile: scripts/apparmor-profile.tpl
# Windows x86_64: an NSIS installer, which installs for the person (no administrator) into
# %LOCALAPPDATA%\Programs and is also what an installed app updates from (latest.yml,
# src/update.js). Unsigned for now: SmartScreen warns on the first download. Signing later is
# one of these, with nothing else to change (desktop-build.yml, "Build Windows installer"):
#   - a code-signing certificate: the WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD secrets, which
#     electron-builder reads by those names;
#   - Azure Trusted Signing: an `azureSignOptions` block here (publisherName, endpoint,
#     certificateProfileName, codeSigningAccountName) and AZURE_TENANT_ID, AZURE_CLIENT_ID and
#     AZURE_CLIENT_SECRET in the build's environment.
# A signed build writes its publisher into app-update.yml, and from then on electron-updater
# installs only updates signed by that publisher. An unsigned build names none, so it takes the
# first signed one as well: leave publisherName unset until the builds are signed.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
  artifactName: Automagik-${version}-win-${arch}.${ext}
# The installer registers the links' schemes, which electron-builder's NSIS leaves out of
# `protocols`.
nsis:
  include: assets/installer.nsh
mac:
  # The zip is what an installed app updates from (src/update.js); the dmg is for a first install.
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: assets/icon.png
  # Signed with the Developer ID in the build machine's keychain (none found: unsigned), under
  # the hardened runtime. Notarized when APPLE_KEYCHAIN_PROFILE names a notarytool profile.
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  # Voice chat: macOS asks once, with this line, the first time a chat listens.
  # Local network: without this line macOS never asks, and every connection to a LAN address
  # (an Omni on this network) fails with EHOSTUNREACH (#96).
  extendInfo:
    NSMicrophoneUsageDescription: Automagik listens to you only while voice chat is on, to hear what you say to your Bots.
    NSLocalNetworkUsageDescription: Automagik connects to Omni and other services on your local network.
  entitlementsInherit: assets/entitlements.mac.plist
  artifactName: Automagik-${version}-mac-${arch}.${ext}
dmg:
  title: Automagik ${version}
  # The install window: assets/background.png (and @2x, which dmg-builder combines into one
  # TIFF) sets its size, 680x440. The app and the Applications link sit on the background's
  # two clear spots, at 128 px, with the arrow between them. The background's source is
  # assets/dmg-source (background.svg under page.html, rendered at 1x and 2x).
  iconSize: 128
  iconTextSize: 13
  contents:
    - x: 190
      y: 205
      type: file
    - x: 490
      y: 205
      type: link
      path: /Applications
  # The dmg is signed too (electron-builder signs only the app by default), and release.yml
  # notarizes and staples it, so a downloaded dmg opens without a warning.
  sign: true
# Where the update feeds (latest-mac.yml, latest-linux.yml, latest.yml) say the builds are. The builds
# never publish themselves (--publish never): desktop-build.yml uploads them to this
# repository's release `v<version>`, and the app reads that release's feed (src/update.js).
publish:
  provider: github
  owner: automagik-dev
  repo: automagik
  releaseType: prerelease
