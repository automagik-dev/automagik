<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Code mode spike</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<style>
  :root { --bg:#0f1115; --panel:#161922; --line:#262b38; --fg:#d7dae0; --dim:#7d8590; --acc:#7aa2f7; --ok:#9ece6a; --warn:#e0af68; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px -apple-system, system-ui, sans-serif; }
  #app { display:grid; grid-template-rows: 38px 1fr; height:100%; }
  header { display:flex; align-items:center; gap:12px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .mode { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .mode span { padding:4px 12px; color:var(--dim); }
  .mode span.on { background:var(--acc); color:#0f1115; font-weight:600; }
  header .note { color:var(--dim); font-size:12px; margin-left:auto; }
  main { display:grid; grid-template-columns: 270px 1fr; min-height:0; }
  aside { border-right:1px solid var(--line); overflow:auto; padding:8px 0; }
  .core { padding:6px 12px 2px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .space { padding:5px 12px; font-weight:600; }
  .tab { padding:3px 12px 3px 24px; color:var(--dim); cursor:pointer; display:flex; justify-content:space-between; }
  .tab:hover, .tab.on { color:var(--fg); background:#1d2130; }
  .tab .n { font-size:11px; }
  .badge { font-size:10px; padding:0 5px; border-radius:6px; border:1px solid var(--line); margin-left:6px; }
  #stage { position:relative; min-height:0; padding:6px; }
  .split { display:flex; width:100%; height:100%; gap:6px; }
  .split.column { flex-direction:column; }
  .pane { position:relative; border:1px solid var(--line); border-radius:6px; overflow:hidden; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .pane .title { font-size:11px; color:var(--dim); padding:3px 8px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .pane .title .st { margin-left:auto; }
  .pane .term { flex:1; min-height:0; padding:4px; }
  .pane.ro .term { display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; text-align:center; }
  .st.working { color:var(--warn); } .st.idle, .st.done { color:var(--ok); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mode"><span>Work</span><span class="on">Code</span></div>
    <div id="where" style="color:var(--dim)"></div>
    <div class="note">spike · herdr-core attach stream → xterm.js</div>
  </header>
  <main>
    <aside id="side"></aside>
    <section id="stage"></section>
  </main>
</div>
<script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
<script src="renderer.js"></script>
</body>
</html>
