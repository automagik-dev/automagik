[package]
name = "usagemeter"
version = "3.138.8"
edition = "2024"
rust-version = "1.89"
description = "Counts coding-agent token usage per machine as ae/1 rows and publishes a summary doc to herdr-core"
license = "Apache-2.0"
publish = false

[[bin]]
name = "usagemeter"
path = "src/main.rs"

[lib]
name = "meter"
path = "src/lib.rs"

[dependencies]
memchr = "2"
# dsh-tui sessions are multi-frame zstd. Decoder only, pure Rust, no transitive dependencies.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
