name: Commit messages

# Every commit a pull request brings is conventional: `type(scope): description`, with
# header and body lines of at most 100 characters (AGENTS.md).

on:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            subject=$(git log -1 --format=%s "${sha}")
            if ! [[ "${subject}" =~ ^(feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
              echo "::error ::${sha:0:9} is not conventional: ${subject}"
              bad=1
            fi
            if git log -1 --format=%B "${sha}" | awk 'length > 100 { found = 1 } END { exit !found }'; then
              echo "::error ::${sha:0:9} has a line over 100 characters"
              bad=1
            fi
          done
          exit "${bad}"
